<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Off the Bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --fg:#000000; --muted:#8a8a8e; --hair:#d8d8dc;
  --in:#e9e9eb; --in-fg:#000; --out:#0a84ff; --out-fg:#fff;
  --chip:#f2f2f7; --chip-fg:#0a84ff; --bar:#f7f7f9;
  --sheet:#ffffff; --scrim:rgba(0,0,0,.35); --hl:rgba(238,240,70,.8);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#ffffff; --muted:#8d8d93; --hair:#2c2c2e;
    --in:#26252a; --in-fg:#fff; --chip:#1c1c1e; --chip-fg:#4aa3ff; --bar:#121214;
    --sheet:#1c1c1e; --scrim:rgba(0,0,0,.55); --hl:rgba(190,195,40,.42);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#ffffff; --muted:#8d8d93; --hair:#2c2c2e;
  --in:#26252a; --in-fg:#fff; --chip:#1c1c1e; --chip-fg:#4aa3ff; --bar:#121214;
  --sheet:#1c1c1e; --scrim:rgba(0,0,0,.55); --hl:rgba(190,195,40,.42);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
@media (max-width:440px){.app{border:0}}

/* map */
.map{position:relative;flex:0 0 40%;min-height:220px;background:#7a9a52;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;top:10px;font-family:"Stardos Stencil","Impact","Arial Narrow",sans-serif;color:#f4efd8;text-shadow:0 1px 0 rgba(0,0,0,.45);line-height:1.05;pointer-events:none}
.hud .t{font-size:30px;letter-spacing:.5px}
.hud .d{font-size:15px;opacity:.92}
.drill{position:absolute;right:10px;top:10px;background:rgba(20,26,14,.62);color:#f4efd8;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.35;pointer-events:none}
.drill b{font-weight:600}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:7px;height:7px;border-radius:2px;background:rgba(244,239,216,.25)}
.pips i.on{background:#f4efd8}

/* contact header */
.head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--hair)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(#9aa6b5,#7b8798);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.head .n{font-size:15px;font-weight:600}
.head .s{font-size:12px;color:var(--muted)}

/* thread */
.thread{flex:1 1 auto;overflow-y:auto;padding:10px 12px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.stamp{align-self:center;text-align:center;color:var(--muted);font-size:11.5px;margin:10px 0 4px;max-width:88%;line-height:1.35}
.stamp b{font-weight:600}
.scroll{align-self:center;text-align:center;color:var(--muted);font-size:12.5px;font-style:italic;margin:6px 0;max-width:86%;line-height:1.4}
.from{font-size:11px;color:var(--muted);margin:7px 0 1px 12px}
.b{max-width:78%;padding:7px 12px;border-radius:18px;font-size:16px;line-height:1.3;word-wrap:break-word}
.b.in{align-self:flex-start;background:var(--in);color:var(--in-fg);border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:#34c759;color:var(--out-fg);border-bottom-right-radius:6px;margin-top:6px}
.b.typing{display:flex;gap:4px;padding:11px 13px}
.b.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.b.typing span:nth-child(2){animation-delay:.2s}.b.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.delivered{align-self:flex-end;font-size:11px;color:var(--muted);margin:2px 4px 2px 0}

/* reply area */
.replies{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:6px 12px 14px}
.chip{appearance:none;border:1px solid var(--hair);background:var(--chip);color:var(--chip-fg);border-radius:18px;padding:9px 14px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.chip:focus-visible{outline:3px solid var(--out);outline-offset:2px}
.chip:active{transform:scale(.98)}
.inputbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 10px}
.inputbar .field{flex:1;border:1px solid var(--hair);border-radius:18px;padding:8px 14px;color:var(--muted);font-size:15px}
.ptt{width:32px;height:32px;border-radius:50%;background:var(--hair);display:grid;place-items:center;color:var(--muted);font-size:15px}

/* training sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);display:none;align-items:flex-end;z-index:5}
.scrim.show{display:flex}
.sheet{background:var(--sheet);width:100%;border-radius:16px 16px 0 0;padding:16px 14px 18px}
.sheet h2{font-size:18px;margin:0 0 2px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.4}
.card{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;margin-top:8px;font:inherit;cursor:pointer}
.card:focus-visible{outline:3px solid var(--out);outline-offset:2px}
.card .ct{font-size:15.5px;font-weight:600}
.card .cs{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.card .lvl{float:right;font-size:12px;color:var(--muted);font-weight:500}
.sheet{max-height:88%;overflow-y:auto}
/* the O Group page: changed headings edged amber, unchanged ones grey and tappable, the mission highlighted as with a marker pen */
.oi{display:block;width:100%;text-align:left;border:1px solid var(--hair);border-left:4px solid #e3a33a;background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;margin-top:7px;font:inherit}
.oi.same{border-left-color:var(--hair);cursor:pointer}
.oi .oh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.oi .ot{font-size:14.5px;line-height:1.4;margin-top:2px}
.oi.same .ot{color:var(--muted)}
.oi .ot.mission .hl{background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px;margin:0 -2px}
.card.chk{display:flex;align-items:center;gap:10px}
.card.chk .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.card.chk[aria-pressed="true"] .box{background:var(--out);border-color:var(--out);color:#fff}
.card.go{text-align:center;background:var(--out);border-color:var(--out);color:#fff}
@media (prefers-reduced-motion:reduce){.b.typing span{animation:none}}

.gloss{align-self:flex-start;max-width:80%;margin:2px 0 4px 42px;font-size:12.5px;line-height:1.35;color:var(--muted);font-style:italic}
.ic{align-self:center;max-width:86%;text-align:center;font-size:13px;color:var(--fg);opacity:.85;margin:6px 0;padding:5px 10px;border:1px dashed var(--hair);border-radius:10px}
.ic b{font-weight:600;color:var(--muted);margin-right:4px}
.b.ic-in{align-self:flex-start;background:var(--in);color:var(--in-fg);border-bottom-left-radius:6px}
.b.ic-out{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px;margin-top:6px}
.chip.hint{color:var(--fg);background:transparent;border-style:dashed}
.avatar.f2f{background:linear-gradient(#c9a77a,#a7835a)}
.thread[hidden]{display:none}
.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,132,255,.92);color:#fff;font-size:13px;padding:7px 12px;border-radius:14px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tip[hidden]{display:none}
.title{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,18,10,.78);opacity:0;transition:opacity 1.2s;pointer-events:none}
.title.show{opacity:1}
.title div{font-family:"Stardos Stencil","Impact","Arial Narrow",sans-serif;color:#f4efd8;text-align:center;line-height:1.1}
.title .big{font-size:44px;letter-spacing:1px}
.title .sub{font-size:15px;margin-top:8px;opacity:.9}
@media (prefers-reduced-motion:reduce){.title{transition:none}}
.ac{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:none;cursor:pointer;font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.ac.show{display:block}
.ac .bal{position:relative;background:#fdf7e4;color:#6b5236;border-radius:34px/44px;padding:26px 24px 30px;min-height:118px;box-shadow:0 3px 0 #e7dcbd,0 8px 24px rgba(60,40,10,.25);font-size:19px;font-weight:700;line-height:1.45}
.ac .tag{position:absolute;top:-16px;left:26px;padding:4px 16px;border-radius:16px;color:#fff;font-weight:800;font-size:16px;transform:rotate(-4deg);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.ac .gl{display:block;margin-top:8px;font-size:13.5px;font-weight:700;color:#a68c66;font-style:italic}
.ac .more{position:absolute;right:26px;bottom:12px;color:#e3a33a;font-size:16px;visibility:hidden;animation:bob 1s ease-in-out infinite}
.ac.ready .more{visibility:visible}
@keyframes bob{50%{transform:translateY(4px)}}
.ac .opts{position:absolute;right:6px;bottom:calc(100% + 18px);background:#fdf7e4;border-radius:26px;padding:10px 8px;box-shadow:0 3px 0 #e7dcbd,0 8px 24px rgba(60,40,10,.25);display:none}
.ac .opts.show{display:block}
.ac .opts button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:#6b5236;padding:8px 14px 8px 30px;border-radius:14px;position:relative;cursor:pointer}
.ac .opts button:hover,.ac .opts button:focus-visible{background:#f6ecc9;outline:none}
.ac .opts button:hover::before,.ac .opts button:focus-visible::before{content:"▶";position:absolute;left:10px;color:#e3a33a;font-size:13px;top:11px}
@media (prefers-reduced-motion:reduce){.ac .more{animation:none}}
.chip.ch-net{color:#1f9a45}
.chip.ch-ic{color:#0a84ff}
.row{display:flex;align-items:flex-end;gap:6px;align-self:flex-start;max-width:86%}
.row .b{max-width:100%}
.from{margin-left:42px!important}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:-.2px}

stamp <b>Wednesday 25 April 1990</b> · 1015<br>Salisbury Plain Training Area
radio A Light Gun battery in action on the Plain: six 105mm guns, one command post. You are the Gun Position Officer. The FOO is up on the ridge with the infantry, watching the target area.
near board,brew,tannoy
wait 900
hear Gun 3, layer: Brew’s stewed.
hear Gun 3, Bombardier: It’s always stewed. It’s the Plain. Drink it.
hear Gun 5, loader: How long have we been sat here?
hear Gun 5, No. 1: Two hours. And you’ll sit two more if they want you to.
gloss Bombardier — the Royal Artillery’s corporal. The gun’s No. 1, its detachment commander, is usually a sergeant.
wait 600
net Four Three: Four Zero, Four Three. Fire mission. Over.
gloss Four Three — the Forward Observation Officer’s callsign. Four Zero — your command post. Fire mission — the call for fire.
choose Four Three, Four Zero. Send, over.
net Four Three: Grid zero nine seven four five two. Direction four eight zero zero. Infantry in the open. Adjust fire. Over.
gloss Grid — the target’s map reference. Direction — the FOO’s bearing to the target, in mils (6,400 to the circle). Adjust fire — range one gun onto the target before the battery fires.
choose Grid zero nine seven four five two. Direction four eight zero zero. Infantry in the open. Adjust fire. Out.
near board,face,tannoy
radio The command post’s computer, FACE, works out the data for the guns: bearing one six four zero, elevation three two zero, charge four.
gloss FACE — Field Artillery Computer Equipment.
choose ic: Fire mission battery!
ic Gun 3: Number three!
choose ic: HE, charge four, fuze quick. Bearing one six four zero. Elevation three two zero.
set g1,g2,g3,g4,g5,g6 telev=0.55

<script>/* Off the Bus engine core: the game with no page.
   Parses scenes, compiles scripts to steps, runs them, and keeps the whole game state as plain
   data (core.state). Everything the player sees or does goes through an `io` object supplied by
   the caller: the page (ui.js) animates and waits for taps; the test harness answers instantly.

   io: print(entry) · choose(opts, {targets}) → i · ask(opts) → i · say(ac) · tap() · cards(title, sub, items) → i
       orders(page, review) · pick(title, sub, items) → [0|1, …]
       zoom(label) · wait(ms) · waitMoves(ids) · effect(ev) · update() · persist(json) · end(kind)
   All io methods may return promises. */
(function(root){
'use strict';

const UNIVERSAL_PROPS=`
@pistol your pistol
kit: yes
icon: 🔫
verb: Clean
use: radio You strip and clean your 9mm Browning — slide, barrel, spring, frame — and put it back together. It was clean before. It is cleaner now.
use: gloss Clean your weapon whenever there is nothing else to do. There is always something else to do, and you clean it anyway.
@socks your socks
kit: yes
icon: 🧦
verb: Change
use: radio You take off your boots and change your socks. Dry feet. For a few minutes, the world is a better place.
use: gloss Foot care: every soldier is taught that wet feet end campaigns. Nobody needs to tell you twice.
`;

function parseScene(text){
  const [headText, rest] = text.split(/^---map\s*$/m);
  const [mapText, afterMap] = rest.split(/^---script\s*$/m);
  const [scriptAndProps, daysText=''] = afterMap.split(/^---days\s*$/m);
  const [scriptText, propsText=''] = scriptAndProps.split(/^---props\s*$/m);
  const legend={}, days=[];
  for(const raw of daysText.split('\n')){ const l=raw.trim(); if(!l||l.startsWith('#')) continue;
    let m=l.match(/^legend:\s*(.*)$/); if(m){ for(const part of m[1].split('|')){ const [key,...vals]=part.trim().split(/\s+/); legend[key]={}; for(const v of vals){ const [n,num]=v.split('='); legend[key][n]=+num; } } continue; }
    m=l.match(/^([^:]+):\s*(.*)$/); if(m){ const row={label:m[1].trim()}; for(const kv of m[2].split(/\s+/)){ const [k,v]=kv.split('='); if(k) row[k]=legend[k]&&v in legend[k]?legend[k][v]:+v; } days.push(row); } }
  const head={};
  for(const line of headText.split('\n')){ const m=line.match(/^(\w+):\s*(.*)$/); if(m) head[m[1]]=m[2].trim(); }
  const lists=k=>Object.fromEntries((head[k]||'').split(',').filter(Boolean).map(p=>p.split('=').map(s=>s.trim())));
  const people={}; for(const [n,v] of Object.entries(lists('people'))){ const [col,por]=v.split(':'); people[n]={col,portrait:por}; }
  const all=scriptText.split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim() && !l.trim().startsWith('#')).map(l=>l.trim());
  const macros={}, script=[]; let into=null;
  for(const l of all){ const m=l.match(/^def\s+(\w+)$/); if(m){ into=macros[m[1]]=[]; continue; } if(l==='enddef'){ into=null; continue; } (into||script).push(l); }
  const props={}; let cur=null;
  for(const raw of (UNIVERSAL_PROPS+'\n'+propsText).split('\n')){ const l=raw.trim(); if(!l||l.startsWith('#')) continue;
    let m=l.match(/^@(\w+)\s+(.*)$/); if(m){ cur=props[m[1]]={id:m[1],label:m[2],verb:'Use',look:[],use:[],asks:{},at:null,kit:false,person:null,icon:'•'}; continue; }
    m=l.match(/^at:\s*(-?[\d.]+),\s*(-?[\d.]+)$/); if(m&&cur){ cur.at=[+m[1],+m[2]]; continue; }
    m=l.match(/^(kit|person|icon|unit):\s*(.*)$/); if(m&&cur){ cur[m[1]]=m[1]==='kit'?true:m[2]; continue; }
    m=l.match(/^verb:\s*(.*)$/); if(m&&cur){ cur.verb=m[1]; continue; }
    m=l.match(/^(look|use):\s*(.*)$/); if(m&&cur){ cur[m[1]].push(m[2]); continue; }
    m=l.match(/^ask (.+?):\s*(.*)$/); if(m&&cur){ (cur.asks[m[1]]=cur.asks[m[1]]||[]).push(m[2]); } }
  return { head, map:JSON.parse(mapText), script, macros, props, days, legend, callsigns:lists('callsigns'), crew:lists('crew'), people,
    vars:Object.fromEntries(Object.entries(lists('vars')).map(([k,v])=>[k,Number(v)])) };
}

const parseLine=l=>{ const m=l.match(/^(\S+)\s*(.*)$/); return [m[1],m[2]]; };
const nameText=a=>{ const m=a.match(/^([^:]+):\s*(.*)$/); return [m[1].trim(),m[2]]; };
const pt=s=>s.split(',').map(Number);
function kv(args){ const o={}; for(const m of args.matchAll(/(\w+)=([^\s]+)/g)) o[m[1]]=isNaN(+m[2])?m[2]:+m[2]; return o; }
function parseOpts(arg){ return arg.split('||').map(o=>{ o=o.trim(); let when=null; const w=o.match(/^\{(\$\w+\s*(?:=|!=|<|>)\s*-?\d+)\}\s*(.*)$/); if(w){ when=w[1]; o=w[2]; } const m=o.match(/^(net|ic|act|hint):\s*(.*)$/); return {...(m?{kind:m[1],text:m[2]}:{kind:'net',text:o}), when}; }); }
function compile(lines){
  const out=lines.map(l=>{ const [cmd,arg]=parseLine(l); return {cmd,arg}; }), stack=[];
  out.forEach((ins,i)=>{
    if(ins.cmd==='if'||ins.cmd==='while') stack.push(i);
    else if(ins.cmd==='else'){ const j=stack.pop(); out[j].jump=i+1; stack.push(i); }
    else if(ins.cmd==='end'){ const j=stack.pop(); if(out[j].cmd==='while'){ ins.loop=j; out[j].jump=i+1; } else out[j].jump=i+1; }
  });
  return out;
}
function parsePick(arg){ const [headPart,list]=arg.split('::'); const [title,sub]=headPart.split('|').map(x=>x.trim());
  const items=list.split('||').map(o=>{ o=o.trim(); let when=null; const w=o.match(/^\{(\$\w+\s*(?:=|!=|<|>)\s*-?\d+)\}\s*(.*)$/); if(w){ when=w[1]; o=w[2]; } const k=o.lastIndexOf('=');
    return {label:o.slice(0,k).trim(), v:o.slice(k+1).trim().replace('$',''), when}; });
  return {title, sub:sub||'', items}; }
function setPicked(vars,items,chosen){ for(const o of items) vars[o.v]=0; items.forEach((o,i)=>{ if(chosen[i]) vars[o.v]=1; }); }
const LEVELS=['Raw','Practised','Drilled'];
const WAITS=new Set(['net','me','ic','icme','hear','choose','ask','say','wait','waitmove','cards','tap','zoomgate','replay','orders','pick']);
const SPEECH={net:'net',me:'out',ic:'ic',icme:'icout',hear:'hear'};

function createCore({scenes, campaign, io}){
  const PARSED={}, COMPILED={}, TREES={};
  const sceneOf=n=>PARSED[n]||(PARSED[n]=parseScene(scenes[n]));
  const S=()=>sceneOf(state.scene);
  let state=null;
  const fresh=()=>({v:3, sceneIdx:0, scene:campaign.order[0], nestDepth:0, frames:[], vars:{}, thread:[],
    world:{units:[], broken:[], tracks:[], gaps:[], cam:[0,0,6], night:0, hud:['',''], badge:'', tip:'', near:[], used:[], end:false},
    ac:{show:false, name:'', text:'', gloss:'', collapsed:false}, lastAsked:false, rng:1});
  state=fresh();

  /* ---- text ---- */
  const LV=()=>(S().head.levels||'4,8').split(',').map(Number);
  const levelOf=n=>{ const lv=LV(); return n>=lv[1]?2:n>=lv[0]?1:0; };
  const CAL=()=>(S().head.calendar||'').split('|').map(x=>x.trim());
  function interp(t){ const vars=state.vars; return t.replace(/\{(level|pips|date|bar)?:?\$(\w+)\}/g,(m,f,k)=>{ const v=vars[k]??0; if(f==='level') return LEVELS[levelOf(v)]; if(f==='date') return CAL()[v]||'';
    if(f==='bar'){ const lv=LV(), l=levelOf(v), lo=l===0?0:lv[0], hi=l===0?lv[0]:lv[1], w=l>=2?1:Math.max(0,Math.min(1,(v-lo)/(hi-lo))); return `<span class="xpbar"><i style="width:${Math.round(w*100)}%"></i></span>`; }
    if(f==='pips'){ const on=v>0?levelOf(v)+1:0; return '<span class="pips">'+[0,1,2].map(i=>`<i class="${i<on?'on':''}"></i>`).join('')+'</span>'; } return String(v); }); }
  function cond(expr){ const m=expr.match(/^\$(\w+)\s*(=|!=|<|>)\s*(-?\d+)$/); if(!m) throw new Error('bad if: '+expr); const v=state.vars[m[1]]??0, n=+m[3];
    return {'=':v===n,'!=':v!==n,'<':v<n,'>':v>n}[m[2]]; }
  function rand(n){ state.rng=(state.rng*16807)%2147483647; return state.rng%n; }

  /* ---- the world ---- */
  function treesOf(name){ if(TREES[name]) return TREES[name]; const sc=sceneOf(name), out=[]; let seed=1; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
    for(const a of sc.map.trees||[]){ seed=a.seed||7;
      for(let i=0;i<a.n;i++){ const x=a.x[0]+rnd()*(a.x[1]-a.x[0]), y=a.y[0]+rnd()*(a.y[1]-a.y[0]); const s=(a.s||[.7,1.3]); const t={x,y,s:s[0]+rnd()*(s[1]-s[0]),kind:a.kind||'broad',col:a.col};
        if((sc.map.keep||[]).some(k=>Math.hypot(k[0]-x,k[1]-y)<(k[2]||.8))) continue; out.push(t); } }
    for(const t of sc.map.tree||[]) out.push({s:1,kind:'broad',...t});
    for(const h of sc.map.hedge||[]){ const [a,b]=[h.from,h.to], n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(h.step||.35)); for(let i=0;i<=n;i++) out.push({x:a[0]+(b[0]-a[0])*i/n,y:a[1]+(b[1]-a[1])*i/n,s:.9+((i*37)%5)/20,kind:'hedge'}); }
    return TREES[name]=out; }
  const unit=id=>state.world.units.find(u=>u.id===id);
  const ids=s=>s.split(',').map(x=>x.trim()).flatMap(x=>x==='all'?state.world.units.map(u=>u.id):[x]);
  function tick(dt){                                   // advance moving units; tracks and broken hedges are world state
    const w=state.world, trees=treesOf(state.scene);
    for(const u of w.units){ if(!u.trail||!u.path.length||u.delay>0) continue; const last=u._tr; if(!last||Math.hypot(u.x-last[0],u.y-last[1])>.12){ w.tracks.push([u.x,u.y,last?Math.atan2(u.y-last[1],u.x-last[0]):0]); u._tr=[u.x,u.y]; }
      trees.forEach((t,i)=>{ if(t.kind==='hedge'&&!w.broken.includes(i)&&Math.hypot(t.x-u.x,t.y-u.y)<.45){ w.broken.push(i); w.gaps.push([t.x,t.y]); } }); }
    for(const u of w.units){ if(u.delay>0){u.delay-=dt;continue;} if(u.path.length){ const [px,py]=u.path[0], dx=px-u.x, dy=py-u.y, d=Math.hypot(dx,dy); if(d<.03) u.path.shift(); else { const v=Math.min(d,dt*u.spd); u.x+=dx/d*v; u.y+=dy/d*v; } }
      if(u.telev!=null) u.elev=(u.elev??.25)+(u.telev-(u.elev??.25))*Math.min(1,dt*2); }
  }
  function finishMoves(){ let guard=0; while(state.world.units.some(u=>u.path.length||u.delay>0)&&guard++<20000) tick(.05); for(const u of state.world.units) if(u.telev!=null) u.elev=u.telev; }
  const moving=list=>list.some(id=>{ const u=unit(id); return u&&(u.path.length||u.delay>0); });

  /* ---- objects ---- */
  function verbsOf(p){ const out=[], used=state.world.used;
    if(p.look.length) out.push({icon:'🔍',text:'Look at '+p.label,lines:p.look,key:p.id+':look'});
    if(p.use.length&&!used.includes(p.id+':use')) out.push({icon:'✋',text:p.verb+' '+p.label,lines:p.use,key:p.id+':use',once:1});
    for(const [topic,lines] of Object.entries(p.asks)) if(!used.includes(p.id+':ask:'+topic)) out.push({icon:'💬',text:'Ask '+topic,lines,key:p.id+':ask:'+topic,once:1});
    return out; }
  const nearProps=()=>state.world.near.map(id=>S().props[id]).filter(Boolean);
  const kitProps=()=>Object.values(S().props).filter(p=>p.kit);
  async function useVerb(key){
    const [id]=key.split(':'); const p=S().props[id]; const v=p&&verbsOf(p).find(x=>x.key===key); if(!v) return;
    const saved={...state.ac};
    if(v.once) state.world.used.push(v.key);
    await exec(v.lines);
    if(saved.show){ state.ac={...saved}; io.update(); }
    save();
  }

  /* ---- thread ---- */
  async function emit(entry){ await io.print(entry); state.thread.push(entry); }

  /* ---- commands ---- */
  const H=()=>({printed:null,choice:null});
  let hook=H();
  async function exec(lines){                          // object verbs: run whole, not as saved steps
    for(let i=0;i<lines.length;i++){ const [cmd,arg]=parseLine(lines[i]); await run1(cmd,arg,true); }
  }
  async function run1(cmd,a,inVerb){
    const vars=state.vars, w=state.world;
    switch(cmd){
      case 'stamp': await emit({k:'stamp',html:interp(a)}); break;
      case 'radio': await emit({k:'radio',text:interp(a)}); break;
      case 'gloss': await emit({k:'gloss',text:a}); break;
      case 'net': case 'ic': case 'hear': { const [n,t]=nameText(a); await emit({k:SPEECH[cmd],who:n,text:cmd==='net'?interp(t):t}); hook.printed&&hook.printed(); break; }
      case 'me': case 'icme': await emit({k:SPEECH[cmd],text:a}); hook.printed&&hook.printed(); break;
      case 'choose': { state.pemSpoke=false; const opts=parseOpts(a); const i=await io.choose(opts,{}); hook.choice&&hook.choice(i); vars.choice=i; await chooseEffect(opts[i]); hook.printed&&hook.printed(); break; }
      case 'say': { const [n,t]=nameText(a); const [txt,gl]=interp(t).split(' | '); const me=S().head.player||'Pemberton';
        if(n===me && !inVerb && state.ac.show && txt!=='…' && !/^[“"]/.test(txt) && !state.lastAsked && !state.pemSpoke){ await io.ask([{text:txt}]); }   // a line that opens a conversation was already chosen
        if(n===me){ state.lastAsked=false; state.pemSpoke=true; } else state.pemSpoke=false;
        state.ac={show:true,name:n,text:txt,gloss:gl||'',collapsed:false}; await io.say(state.ac); hook.printed&&hook.printed(); await io.tap(); break; }
      case 'ask': { state.pemSpoke=false; const os=parseOpts(a); const shown=os.map((o,i)=>[o,i]).filter(([o])=>!o.when||cond(o.when)); const j=await io.ask(shown.map(([o])=>o)); const i=shown[j][1];
        hook.choice&&hook.choice(i); vars.choice=i; state.lastAsked=true; break; }
      case 'endtalk': state.ac={...state.ac,show:false}; io.update(); break;
      case 'wait': await io.wait(+a); break;
      case 'var': { const m=a.match(/^\$?(\w+)\s*(\+?=)\s*(\$\w+|-?\d+)$/); const v=m[3].startsWith('$')?(vars[m[3].slice(1)]??0):+m[3]; vars[m[1]]=m[2]==='+='?(vars[m[1]]??0)+v:v; io.update(); break; }
      case 'do': await exec(S().macros[a.trim()]); break;      // only reached from object verbs; the step interpreter handles 'do' itself
      case 'today': { const row=S().days[vars[a.replace('$','').trim()]??0]||{}; for(const k of Object.keys(S().legend||{})) vars[k]=0; for(const [k,v] of Object.entries(row)) if(k!=='label') vars[k]=v; w.used=[]; io.update(); break; }
      case 'str': { const m=a.match(/^\$?(\w+)\s*=\s*(.*)$/); vars[m[1]]=interp(m[2]); break; }
      case 'random': { const [k,lo,hi]=a.replace('$','').split(/\s+/); vars[k]=rand(+hi-+lo+1)+(+lo); break; }
      case 'xp': { const m=a.match(/^\$?(\w+)\s+(-?\d+)\s+(.*)$/); const before=levelOf(vars[m[1]]??0); vars[m[1]]=(vars[m[1]]??0)+(+m[2]); const after=levelOf(vars[m[1]]);
        await emit({k:'xp',html:`<b>+${m[2]} XP</b> · ${m[3]} ${interp('{bar:$'+m[1]+'}')}`});
        if(after>before) await emit({k:'levelup',html:`<b>${m[3]} is now ${LEVELS[after]}</b>`});
        io.update(); break; }
      case 'cards': { state.pemSpoke=false; const [headPart,list]=a.split('::'); const [title,sub]=headPart.split('|').map(x=>x.trim());
        const items=list.split('||').map(c=>c.split('|').map(x=>x.trim())).map(([t,d,l])=>({title:t,desc:d||'',label:interp(l||'')}));
        const i=await io.cards(interp(title),interp(sub||''),items); hook.choice&&hook.choice(i); vars.choice=i; break; }
      case 'orders': {                                 // the O Group, written up in the notebook: headings unchanged since the last page say "No change"

/* ================= the thread ================= */
const thread=$('thread'), replies=$('replies');
let lastFrom=null, lastDelivered=null, skip=false, speaking=false;
thread.addEventListener('click',()=>{ if(speaking) skip=true; });
const scrollDown=()=>{ thread.scrollTop=thread.scrollHeight; };
function el(cls,txt,html){ const d=document.createElement('div'); d.className=cls; if(html!=null) d.innerHTML=html; else d.textContent=txt; return d; }
function add(e){ thread.appendChild(e); scrollDown(); return e; }
const NET_WPM=380, IC_WPM=250;
async function speak(b,text,msPerWord,animate){
  if(!animate){ b.textContent=text; return; }
  b.textContent=''; speaking=true; skip=false;
  const said=document.createElement('span'), rest=document.createElement('span'); rest.className='unsaid'; rest.textContent=text; b.append(said,rest); scrollDown();
  const per=msPerWord/5.5;
  for(let i=0;i<text.length;i++){ if(skip||reduce) break; said.textContent=text.slice(0,i+1); rest.textContent=text.slice(i+1);
    const ch=text[i], nx=text[i+1]||' '; let d=per; if(/[.!?…]/.test(ch)&&/[\s"”’]/.test(nx)) d+=380; else if(/[,—–:;]/.test(ch)) d+=200;
    await new Promise(r=>setTimeout(r,d)); }
  said.textContent=text; rest.textContent=''; skip=false; speaking=false;
}
function row(avCls,avTxt,bCls){ const r=el('row',null,`<span class="av ${avCls}">${avTxt}</span>`); const b=el(bCls,''); r.appendChild(b); add(r); return b; }
function fromLabel(t){ if(lastFrom!==t){ add(el('from',t)); } lastFrom=t; }
/* draw one thread entry; animate when it is new, not when redrawing a restored thread */
function drawStatic(e){                            // a restored entry: drawn at once, in order
  const sc=SC();
  switch(e.k){
    case 'net': { fromLabel(e.who); row('av-net',sc.callsigns[e.who]??e.who.slice(0,2),'b in').textContent=e.text; return; }
    case 'out': { if(lastDelivered) lastDelivered.remove(); add(el('b out',e.text)); lastDelivered=add(el('delivered','Transmitted')); lastFrom=null; return; }
    case 'ic': { fromLabel(e.who+' · intercom'); row('av-ic',sc.crew[e.who]??e.who[0],'b ic-in').textContent=e.text; return; }
    case 'icout': { add(el('b ic-out',e.text)); lastFrom=null; return; }
    case 'hear': { fromLabel(e.who+' · overheard'); row('av-oh',(e.who.match(/\d/)||['·'])[0],'b oh').textContent=e.text; return; }
  }
  draw(e,false);                                     // stamps, narration and glosses draw synchronously anyway
}
async function draw(e,animate){
  const sc=SC();
  switch(e.k){
    case 'stamp': case 'orders': add(el('stamp',null,e.html)); lastFrom=null; break;
    case 'act': add(el('stamp',null,'<b>'+e.text+'</b>')); lastFrom=null; break;
    case 'xp': add(el('stamp xp',null,e.html)); lastFrom=null; break;
    case 'levelup': add(el('stamp levelup',null,e.html)); lastFrom=null; break;
    case 'radio': add(el('scroll',e.text)); lastFrom=null; if(animate&&AC.classList.contains('show')&&!AC.classList.contains('collapsed')) setCollapsed(true,true); break;   // narration: put the balloon away so it can be read
    case 'gloss': add(el('gloss',e.text)); break;
    case 'net': { fromLabel(e.who); const b=row('av-net',sc.callsigns[e.who]??e.who.slice(0,2),'b in'+(animate?' typing':''));
      if(animate){ b.innerHTML='<span></span><span></span><span></span>'; await sleep(650); b.className='b in'; } await speak(b,e.text,NET_WPM,animate); if(animate) await sleep(250); break; }
    case 'out': { if(lastDelivered) lastDelivered.remove(); const b=add(el('b out','')); await speak(b,e.text,NET_WPM,animate); lastDelivered=add(el('delivered','Transmitted')); lastFrom=null; if(animate) await sleep(200); break; }
    case 'ic': { fromLabel(e.who+' · intercom'); const b=row('av-ic',sc.crew[e.who]??e.who[0],'b ic-in'); if(animate) await sleep(250); await speak(b,e.text,IC_WPM,animate); if(animate) await sleep(150); break; }
    case 'icout': { const b=add(el('b ic-out','')); lastFrom=null; await speak(b,e.text,IC_WPM,animate); if(animate) await sleep(150); break; }
    case 'hear': { fromLabel(e.who+' · overheard'); const b=row('av-oh',(e.who.match(/\d/)||['·'])[0],'b oh'); if(animate) await sleep(300); await speak(b,e.text,NET_WPM*.85,animate); if(animate) await sleep(200); break; }
  }
}
function redrawThread(){ thread.innerHTML=''; lastFrom=null; lastDelivered=null; for(const e of ST().thread) drawStatic(e); scrollDown(); }

let waiting=0, busy=false;
const canAct=()=>waiting>0&&!busy;
async function waitFor(promise){ waiting++; refreshWorld(); try{ return await promise; } finally{ waiting--; refreshWorld(); } }
let mapPick=null, tapTargets=null, zoomWanted=null, pinch=null;
function chips(opts){
  return new Promise(res=>{ replies.innerHTML='';
    const pick=i=>{ replies.innerHTML=''; mapPick=null; res(i); };
    opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='chip '+({net:'ch-net',ic:'ch-ic',act:'ch-act',hint:'hint'}[o.kind]);
      b.textContent=o.kind==='ic'?`“${o.text}”`:o.text; b.onclick=()=>pick(i); replies.appendChild(b); });
    mapPick=pick; scrollDown(); });

$('acReopen').addEventListener('click',()=>setCollapsed(false));
function showBalloon(ac,full){                       // draw the balloon from the core's state
  AC.classList.toggle('show',!!ac.show); if(!ac.show){ setCollapsed(false); return; }
  const p=SC().people[ac.name]||{}; acTag.textContent=ac.name; acTag.style.background=p.col||'#8aa05a';
  const img=p.portrait&&PORTRAITS[p.portrait]; acPor.classList.toggle('show',!!img); if(img){ acPor.style.backgroundImage=`url(${img})`; acPor.setAttribute('aria-label',ac.name); }
  if(full){ acText.textContent=ac.text; acGl.textContent=ac.gloss||''; }
}

/* ================= the world: objects, people, kit ================= */
const propsBar=$('props'), pop=$('pop');
function refreshWorld(){ propsBar.innerHTML=''; $('pouch').hidden=!canAct(); AC.classList.toggle('can-hide',canAct());
  if(!canAct()){ closePop(); return; }
  for(const p of core.nearProps()){ if(p.at||p.unit||p.kit||p.person||!core.verbsOf(p).length) continue;
    const b=document.createElement('button'); b.className='chip ch-prop'; b.textContent=(p.icon!=='•'?p.icon+' ':'')+p.label; b.onclick=e=>openPop(p,e.currentTarget); propsBar.appendChild(b); } }
function openPop(p,anchor){ const vs=core.verbsOf(p); if(!vs.length||!canAct()) return;
  pop.innerHTML=`<div class="pt">${p.label}</div>`; for(const v of vs){ const b=document.createElement('button'); b.textContent=v.icon+' '+v.text; b.onclick=e=>{ e.stopPropagation(); runVerb(v); }; pop.appendChild(b); }
  pop.hidden=false; const r=anchor?anchor.getBoundingClientRect():null, app=$('app').getBoundingClientRect();
  if(r){ pop.style.left=Math.max(8,Math.min(app.width-pop.offsetWidth-8,r.left-app.left+r.width/2-pop.offsetWidth/2))+'px'; pop.style.top=Math.max(8,r.top-app.top-pop.offsetHeight-6)+'px'; }
  else { pop.style.left=((app.width-pop.offsetWidth)/2)+'px'; pop.style.top='30%'; } }
function openPopAt(p,sx,sy){ openPop(p,{getBoundingClientRect:()=>{ const c=cv.getBoundingClientRect(); return {left:c.left+sx,top:c.top+sy,width:0,height:0}; }}); }
function closePop(){ pop.hidden=true; pop.innerHTML=''; }
document.addEventListener('click',e=>{ if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('.ch-prop')&&e.target!==cv&&!e.target.closest('#acTag')&&!e.target.closest('#acPortrait')) closePop(); });
async function runVerb(v){ closePop(); const speaks=v.lines.some(l=>/^say\s/.test(l)); const wasCollapsed=AC.classList.contains('collapsed'), wasAuto=autoCollapsed; if(speaks) setCollapsed(false);
  busy=true; refreshWorld(); const optsWas=acOpts.classList.contains('show'), readyWas=AC.classList.contains('ready'), tapWas=acTap;
  replies.style.visibility='hidden'; acOpts.classList.remove('show');
  inVerb=true; await core.useVerb(v.key); inVerb=false;
  replies.style.visibility=''; showBalloon(ST().ac,true);
  if(ST().ac.show){ if(optsWas) acOpts.classList.add('show'); AC.classList.toggle('ready',readyWas); acTap=tapWas; if(wasCollapsed&&speaks) setCollapsed(true,wasAuto); }
  busy=false; refreshWorld(); scrollDown(); }
let inVerb=false, redrawPending=false;
function openPouch(){ if(!canAct()) return; const sh=$('sheet'); sh.innerHTML='<h2>Pouch</h2><p>What you carry.</p>';
  for(const p of core.kitProps()) for(const v of core.verbsOf(p)){ const b=document.createElement('button'); b.className='card';
    b.innerHTML=`<div class="ct">${p.icon!=='•'?p.icon+' ':''}${v.text}</div>`; b.onclick=()=>{ $('scrim').classList.remove('show'); runVerb(v); }; sh.appendChild(b); }
  const r=document.createElement('button'); r.className='card'; r.innerHTML='<div class="ct">↺ Start again from the beginning</div><div class="cs">Clears your saved game.</div>';
  r.onclick=()=>{ sh.innerHTML='<h2>Start again?</h2><p>Your saved game will be cleared and the campaign will start from the beginning.</p>';
    const y=document.createElement('button'); y.className='card'; y.innerHTML='<div class="ct">Yes, start again</div>'; y.onclick=()=>{ clearSave(); location.reload(); };
    const n=document.createElement('button'); n.className='card'; n.innerHTML='<div class="cs">No, keep playing</div>'; n.onclick=()=>$('scrim').classList.remove('show');
    sh.append(y,n); }; sh.appendChild(r);
  const c=document.createElement('button'); c.className='card'; c.innerHTML='<div class="cs">Close</div>'; c.onclick=()=>$('scrim').classList.remove('show'); sh.appendChild(c);
  $('scrim').classList.add('show'); }
$('pouch').addEventListener('click',openPouch);
const personProp=name=>core.nearProps().find(p=>p.person===name);
$('acTag').addEventListener('click',e=>{ const p=personProp(acTag.textContent); if(p&&canAct()){ e.stopPropagation(); openPop(p,acTag); } });
$('acPortrait').addEventListener('click',e=>{ const p=personProp(acTag.textContent); if(p&&canAct()){ e.stopPropagation(); openPop(p,acPor); } });

/* ================= the io the core talks to ================= */
const io={
  async print(e){ await draw(e,true); },
  choose(opts,o){ if(o.targets) tapTargets=o.targets; return waitFor(chips(opts)).finally(()=>{ tapTargets=null; }); },
  ask(opts){ return waitFor(new Promise(res=>{ acOpts.innerHTML=''; acOpts.classList.add('show'); AC.classList.remove('ready'); acTap=null;
    opts.forEach((o,i)=>{ const b=document.createElement('button'); b.textContent=o.text; b.onclick=e=>{ e.stopPropagation(); acOpts.classList.remove('show'); res(i); }; acOpts.appendChild(b); if(i===0) setTimeout(()=>b.focus(),30); }); })); },
  async say(ac){ if(autoCollapsed) setCollapsed(false); showBalloon(ac,false); AC.classList.remove('ready'); acOpts.classList.remove('show'); acGl.textContent=''; acText.textContent='';
    let done=false; acTap=()=>{done=true;};
    for(let i=0;i<ac.text.length&&!done;i++){ acText.textContent=ac.text.slice(0,i+1); if(reduce) continue;
      const ch=ac.text[i]; let d=70; if(/[.!?…]/.test(ch)) d+=320; else if(/[,—–]/.test(ch)) d+=160; await new Promise(r=>setTimeout(r,d)); }
    acText.textContent=ac.text; acGl.textContent=ac.gloss||''; acTap=null; },
  tap(){ AC.classList.add('ready'); AC.focus({preventScroll:true}); return waitFor(new Promise(r=>{ acTap=()=>{ acTap=null; r(); }; })); },
  cards(title,sub,items){ return waitFor(new Promise(res=>{ const sh=$('sheet'); sh.innerHTML=`<h2>${title}</h2><p>${sub}</p>`;
    items.forEach((it,i)=>{ const b=document.createElement('button'); b.className='card'; b.innerHTML=`<span class="lvl">${it.label}</span><div class="ct">${it.title}</div><div class="cs">${it.desc}</div>`;
      b.onclick=()=>{ $('scrim').classList.remove('show'); res(i); }; sh.appendChild(b); });
    $('scrim').classList.add('show'); setTimeout(()=>sh.querySelector('.card')?.focus(),50); })); },
  orders(page,review){ return waitFor(new Promise(res=>{ const sh=$('sheet');   // the O Group as written in the notebook
    sh.innerHTML=`<h2>${page.title}</h2><p>${review?'Your notebook: the last orders you wrote down.':'Your notebook. Tap “No change” to see what you wrote last time.'}</p>`;
    for(const it of page.items){ const d=document.createElement(it.same?'button':'div'); d.className='oi'+(it.same?' same':'');
      const tx=it.h==='Mission'?`<div class="ot mission"><span class="hl">${it.t}</span></div>`:`<div class="ot">${it.same?'No change':it.t}</div>`;
      d.innerHTML=`<div class="oh">${it.h}</div>${tx}`;
      if(it.same){ d.setAttribute('aria-expanded','false'); d.onclick=()=>{ const open=d.getAttribute('aria-expanded')==='true'; d.setAttribute('aria-expanded',String(!open)); d.querySelector('.ot').textContent=open?'No change':'No change: '+it.t; }; }
      sh.appendChild(d); }
    const b=document.createElement('button'); b.className='card go'; b.innerHTML=`<div class="ct">${review?'Close the notebook':'Done'}</div>`;
    b.onclick=()=>{ $('scrim').classList.remove('show'); res(); }; sh.appendChild(b);
    $('scrim').classList.add('show'); sh.scrollTop=0; setTimeout(()=>b.focus({preventScroll:true}),50); })); },
  pick(title,sub,items){ return waitFor(new Promise(res=>{ const sh=$('sheet'), on=items.map(()=>0); sh.innerHTML=`<h2>${title}</h2><p>${sub}</p>`;
    items.forEach((it,i)=>{ const b=document.createElement('button'); b.className='card chk'; b.setAttribute('aria-pressed','false');
      const draw=()=>{ b.innerHTML=`<span class="box">${on[i]?'✓':''}</span><div class="ct">${it.label}</div>`; b.setAttribute('aria-pressed',String(!!on[i])); };
      b.onclick=()=>{ on[i]=on[i]?0:1; draw(); }; draw(); sh.appendChild(b); });
    const g=document.createElement('button'); g.className='card go'; g.innerHTML='<div class="ct">Give orders</div>';
    g.onclick=()=>{ $('scrim').classList.remove('show'); res(on); }; sh.appendChild(g);
    $('scrim').classList.add('show'); sh.scrollTop=0; setTimeout(()=>sh.querySelector('.card')?.focus(),50); })); },
  zoom(label){ return waitFor(new Promise(res=>{ replies.innerHTML=''; const b=document.createElement('button'); b.className='chip hint'; b.textContent=label;
    zoomWanted=()=>{ zoomWanted=null; replies.innerHTML=''; res(); }; b.onclick=()=>zoomWanted&&zoomWanted(); replies.appendChild(b); })); },
  wait(ms){ return sleep(ms); },
  async waitMoves(list){ while(list.some(id=>{ const u=unitById(id); return u&&(u.path.length||u.delay>0); })) await sleep(120); },
  async effect(ev){
    if(ev.k==='burst'){ const p=iso(...ev.at); flash(p[0],p[1],tw*.25); puff(p[0],p[1],{r:tw*.08,grow:tw*.9,life:2.6,col:'105,95,80',a:.8,vy:-5}); if(ev.shake) shake=.5; return; }
    if(ev.k==='shake'){ shake=ev.s; return; }
    if(ev.k==='missile'){ const u=unitById(ev.from); const mz=V(u).muzzle||iso(u.x,u.y); missile={a:[mz[0],mz[1]],to:ev.to,t:0}; return; }
    if(ev.k==='fire'){ const atPoint=Array.isArray(ev.at);
      for(const id of ev.from){ const u=unitById(id); V(u).recoil=1; const mz=V(u).muzzle||iso(u.x,u.y); flash(mz[0],mz[1],tw*(ev.light?.12:.2)); puff(mz[0],mz[1],{r:tw*.06,grow:tw*(ev.light?.3:.7),life:1.6});
        const tgt=()=>{ if(atPoint) return iso(...ev.at); const t=unitById(ev.at); const p=V(t).top||iso(t.x,t.y); return ev.miss?[p[0]-tw*.55,p[1]+tw*.12]:p; };
        tracer={a:[mz[0],mz[1]],b:tgt,t:0}; if(ev.from.length>1) await sleep(90); }
      await sleep(420);
      if(!atPoint){ const t=unitById(ev.at), p=V(t).top||iso(t.x,t.y);
        if(ev.miss) puff(p[0]-tw*.55,p[1]+tw*.12,{r:tw*.06,grow:tw*.55,life:2,col:'205,190,150',a:.85,vy:-4});
        else { flash(p[0],p[1]-tw*.05,tw*.2); puff(p[0],p[1],{r:tw*.06,grow:tw*.4,life:1.3,col:'90,80,70',a:.7}); } } }
  },
  update(){ if(!core) return; const w=ST().world;
    if(redrawPending){ redrawPending=false; redrawThread(); showBalloon(ST().ac,true); }
    applyChrome(); $('hudT').textContent=w.hud[0]||''; $('hudD').textContent=w.hud[1]||'';
    const b=$('badge'); b.hidden=!w.badge; if(w.badge) b.innerHTML=core.interp(w.badge);
    $('tip').textContent=w.tip||''; $('tip').hidden=!w.tip; $('end').classList.toggle('show',!!w.end);
    if(!ST().ac.show) showBalloon(ST().ac,false); refreshWorld(); },
  persist(json){ try{ localStorage.setItem(SAVEKEY,JSON.stringify({build:BUILD,state:json})); }catch(e){} },
  end(){ return waitFor(chips([{kind:'hint',text:'Start the campaign again'}])).then(()=>{ clearSave(); thread.innerHTML=''; lastFrom=null; lastDelivered=null; return 0; }); },
};

/* ================= the map loop ================= */
let last=performance.now(), shownScene=null;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!core){ requestAnimationFrame(frame); return; }
  core.tick(dt); for(const id in VIS) VIS[id].recoil=Math.max(0,(VIS[id].recoil||0)-dt*2.2);
  const st=ST(), w=st.world, sc=SC();
  if(shownScene!==st.scene){ shownScene=st.scene; cam.fx=w.cam[0]; cam.fy=w.cam[1]; cam.z=w.cam[2]; night=w.night; }
  cam.tfx=w.cam[0]; cam.tfy=w.cam[1]; cam.tz=w.cam[2]; nightT=w.night;
  for(const k of ['fx','fy','z']) cam[k]+=(cam['t'+k]-cam[k])*Math.min(1,dt*2.2);
  night+=(nightT-night)*Math.min(1,dt*1.5);
  resizeIf(); setCam(); if(shake>0){ shake-=dt; ox+=(Math.random()-.5)*6; oy+=(Math.random()-.5)*4; }
  cx.fillStyle=sc.map.bg||'#8a9a5a'; cx.fillRect(0,0,W,H); drawGround();
  for(const m of sc.map.marks||[]) if(m.type==='pad'||m.type==='parapet'||m.type==='chalk') drawMark(m);
  cx.fillStyle='rgba(120,92,52,.55)'; for(const [x,y,a] of w.tracks){ for(const o of [-.11,.11]){ const p=iso(x-Math.sin(a)*o,y+Math.cos(a)*o); cx.beginPath(); cx.ellipse(p[0],p[1],Math.max(1.5,tw*.035),Math.max(1,tw*.02),0,0,7); cx.fill(); } }
  for(const [x,y] of w.gaps){ const p=iso(x,y); cx.fillStyle='rgba(110,84,50,.7)'; cx.beginPath(); cx.ellipse(p[0],p[1],tw*.14,tw*.06,0,0,7); cx.fill(); cx.strokeStyle='#5a4126'; cx.lineWidth=1; for(let i=0;i<3;i++){ cx.beginPath(); cx.moveTo(p[0]-tw*.1+i*tw*.08,p[1]-2); cx.lineTo(p[0]-tw*.06+i*tw*.08,p[1]-tw*.07); cx.stroke(); } }
  const trees=core.treesOf(st.scene).filter((t,i)=>!w.broken.includes(i));
  const items=[...trees.map(t=>({k:t.x+t.y,f:()=>drawTree(t)})),...(sc.map.marks||[]).filter(m=>m.type!=='pad'&&m.type!=='parapet'&&m.type!=='chalk').map(m=>({k:m.x+m.y,f:()=>drawMark(m)})),
    ...w.units.filter(u=>!u.hidden).map(u=>({k:u.x+u.y+.01,f:()=>DRAW[u.type](u)}))];
  items.sort((a,b)=>a.k-b.k).forEach(i=>i.f());
  for(const u of w.units){ if(u.hidden) continue; const p=iso(u.x,u.y);
    if(u.smoke&&Math.random()<dt*7) puff(p[0]+(Math.random()-.5)*6,p[1]-tw*.2,{r:3,grow:tw*.35,life:3,col:'55,50,46',a:.55,vy:-9});
    if(u.blossom&&Math.random()<dt*1.5) puff(p[0]+(Math.random()-.5)*tw,p[1]-tw*.3,{r:1.5,grow:0,life:2.5,col:'245,200,215',a:.9,vy:4}); }
  for(const t of trees) if(t.blossom&&Math.random()<dt*1.5){ const p=iso(t.x+(Math.random()-.5),t.y+(Math.random()-.5)); puff(p[0],p[1]-tw*.3,{r:1.5,grow:0,life:2.5,col:'245,200,215',a:.9,vy:4}); }
  if(tracer){ tracer.t+=dt; const k=Math.min(1,tracer.t/.18), a=tracer.a, b=tracer.b(); cx.strokeStyle=`rgba(255,240,200,${Math.max(0,1-tracer.t*3)})`; cx.lineWidth=2; cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k); cx.stroke(); if(tracer.t>.35) tracer=null; }
  if(missile){ missile.t+=dt; const k=Math.min(1,missile.t/1.6), a=missile.a, b=iso(...missile.to); const x=a[0]+(b[0]-a[0])*k, y=a[1]+(b[1]-a[1])*k-Math.sin(k*Math.PI)*tw*.4;
    puff(x,y,{r:1.5,grow:4,life:1.2,col:'235,235,235',a:.7,vy:0}); cx.fillStyle='#ffd27a'; cx.beginPath(); cx.arc(x,y,2.5,0,7); cx.fill(); if(k>=1) missile=null; }
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.t+=dt; if(p.t>p.life){fx.splice(i,1);continue;} const k=p.t/p.life, r=Math.max(1,p.r+p.grow*k); cx.fillStyle=`rgba(${p.col},${p.a*(1-k)})`; cx.beginPath(); cx.arc(p.x,p.y+p.vy*p.t*3,r,0,7); cx.fill(); }
  if(night>.01){ cx.fillStyle=`rgba(12,22,52,${.62*night})`; cx.fillRect(0,0,W,H); }
  if(canAct()){ const seen={}; for(const p of core.nearProps()){ const u=p.unit&&unitById(p.unit); let pos=p.at||(u&&[u.x,u.y]); if(!pos) continue; const key=pos.map(v=>v.toFixed(1)).join(); const k=seen[key]=(seen[key]||0)+1; pos=[pos[0]+(k-1)*.45,pos[1]-(k-1)*.45]; const [sx,sy]=iso(...pos);
    const pulse=1+Math.sin(now/300)*.12, r=Math.max(9,tw*.14)*pulse; cx.fillStyle='rgba(253,247,228,.92)'; cx.strokeStyle='#e3a33a'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(sx,sy-tw*.55,r,0,7); cx.fill(); cx.stroke(); cx.font=`${Math.round(r*1.1)}px system-ui`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p.icon!=='•'?p.icon:'🔍',sx,sy-tw*.55+1); MARK[p.id]=[sx,sy-tw*.55]; } }
  requestAnimationFrame(frame);
}
const MARK={};
cv.addEventListener('click',e=>{ const rc=cv.getBoundingClientRect(), px=e.clientX-rc.left, py=e.clientY-rc.top;
  if(canAct()){ let best=null,bd=1e9; for(const p of core.nearProps()){ const m=MARK[p.id]; if(!m) continue; const d=Math.hypot(m[0]-px,m[1]-py); if(d<bd){bd=d;best=p;} } if(best&&bd<Math.max(22,tw*.3)){ openPopAt(best,MARK[best.id][0],MARK[best.id][1]-10); return; } }
  if(!tapTargets||!mapPick) return;
  let best=-1,bd=1e9; tapTargets.forEach((list,i)=>{ for(const id of list){ const t=unitById(id)||(SC().map.marks||[]).find(m=>m.id===id); if(!t) continue; const p=iso(t.x,t.y), d=Math.hypot(p[0]-px,p[1]-py); if(d<bd){bd=d;best=i;} } });
  if(best>=0&&bd<tw*1.2) mapPick(best); });
cv.addEventListener('wheel',e=>{ if(zoomWanted&&e.deltaY>0){ e.preventDefault(); zoomWanted(); } },{passive:false});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&zoomWanted){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(pinch&&d<pinch-25) zoomWanted(); pinch=pinch||d; e.preventDefault(); } },{passive:false});
cv.addEventListener('touchend',()=>pinch=null);

/* ================= saving and starting ================= */
const SAVEKEY='offthebus:'+(CAMPAIGN.name||'scene');
let BUILD=0; { const t=Object.values(SCENES).join('\u0001')+'|core-1'; for(let i=0;i<t.length;i++) BUILD=(BUILD*31+t.charCodeAt(i))|0; }
function clearSave(){ try{ localStorage.removeItem(SAVEKEY); }catch(e){} }
async function start(){
  if(QS.has('reset')){ clearSave(); history.replaceState(null,'',location.pathname); }
  core=OTBCore.createCore({scenes:SCENES, campaign:CAMPAIGN, io});
  window.__core=core;
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(SAVEKEY)); }catch(e){}
  const sn=saved&&saved.state?JSON.parse(saved.state):null;
  if(sn&&sn.v===3&&saved.build===BUILD){ redrawPending=true; return core.resume(sn); }
  if(sn&&sn.v===3){ redrawPending=true; return core.restartScene(sn,'<b>The game was updated.</b> Picking up at the start of this scene.'); }
  return core.start();
}
resize(); requestAnimationFrame(frame);
start();
window.__redraw=redrawThread;
})();
</script>
