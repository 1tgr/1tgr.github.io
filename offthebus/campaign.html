/* ================= the interpreter ================= */
const LEVELS=['Raw','Practised','Drilled'];
let LV=[4,8];
const levelOf=n=>n>=LV[1]?2:n>=LV[0]?1:0;
let CAL=[];
function interp(t){ return t.replace(/\{(level|pips|date|bar)?:?\$(\w+)\}/g,(m,f,k)=>{ const v=vars[k]??0; if(f==='level') return LEVELS[levelOf(v)]; if(f==='date') return CAL[v]||'';
  if(f==='bar'){ const l=levelOf(v), lo=l===0?0:LV[0], hi=l===0?LV[0]:LV[1], w=l>=2?1:Math.max(0,Math.min(1,(v-lo)/(hi-lo))); return `<span class="xpbar"><i style="width:${Math.round(w*100)}%"></i></span>`; }
  if(f==='pips'){ const on=v>0?levelOf(v)+1:0; return '<span class="pips">'+[0,1,2].map(i=>`<i class="${i<on?'on':''}"></i>`).join('')+'</span>'; } return String(v); }); }
function cards(arg){ const [headPart,list]=arg.split('::'); const [title,sub]=headPart.split('|').map(x=>x.trim());
  const items=list.split('||').map(c=>c.split('|').map(x=>x.trim()));
  return new Promise(res=>{ const sh=$('sheet'); sh.innerHTML=`<h2>${interp(title)}</h2><p>${interp(sub||'')}</p>`;
    items.forEach(([t,d,l],i)=>{ const b=document.createElement('button'); b.className='card'; b.innerHTML=`<span class="lvl">${interp(l||'')}</span><div class="ct">${t}</div><div class="cs">${d||''}</div>`;
      b.onclick=()=>{ $('scrim').classList.remove('show'); const ch=choiceHook; choiceHook=null; ch&&ch(i); res(i); }; sh.appendChild(b); });
    $('scrim').classList.add('show'); setTimeout(()=>sh.querySelector('.card')?.focus(),50);
    if(TEST){ const i=trand(items.length); TLOG.choices.push(items[i][0].slice(0,40)); soon(()=>{ $('scrim').classList.remove('show'); const ch=choiceHook; choiceHook=null; ch&&ch(i); res(i); }); } }); }
const vars={};
const pt=s=>s.split(',').map(Number);
const ids=s=>s.split(',').map(x=>x.trim()).flatMap(x=>x==='all'?units.map(u=>u.id):[x]);
function kv(args){ const o={}; for(const m of args.matchAll(/(\w+)=([^\s]+)/g)) o[m[1]]=isNaN(+m[2])?m[2]:+m[2]; return o; }
function cond(expr){ const m=expr.match(/^\$(\w+)\s*(=|!=|<|>)\s*(-?\d+)$/); if(!m) throw new Error('bad if: '+expr); const v=vars[m[1]]??0, n=+m[3];
  return {'=':v===n,'!=':v!==n,'<':v<n,'>':v>n}[m[2]]; }
function blockEnd(lines,i){ let depth=0; for(let j=i;j<lines.length;j++){ const c=lines[j]; if(/^(if|while)\b/.test(c)) depth++; else if(c==='end'){ if(depth===0) return j; depth--; } else if(c==='else'&&depth===0) return j; } return lines.length; }
const parseLine=l=>{ const m=l.match(/^(\S+)\s*(.*)$/); return [m[1],m[2]]; };
const nameText=a=>{ const m=a.match(/^([^:]+):\s*(.*)$/); return [m[1].trim(),m[2]]; };
async function exec(lines){
  for(let i=0;i<lines.length;i++){
    const [cmd,arg]=parseLine(lines[i]);
    if(cmd==='while'){ const e=blockEnd(lines,i+1); let guard=0; while(cond(arg)&&guard++<60) await exec(lines.slice(i+1,e)); i=e; continue; }
    if(cmd==='if'){ const e=blockEnd(lines,i+1); let e2=e; let elseStart=null; if(lines[e]==='else'){ elseStart=e+1; e2=blockEnd(lines,e+1); }
      if(cond(arg)) await exec(lines.slice(i+1,e)); else if(elseStart!=null) await exec(lines.slice(elseStart,e2)); i=e2; continue; }
    await run1(cmd,arg);
  }
}
async function run1(cmd,a){
  TLOG.steps++;
  switch(cmd){
    case 'stamp': stamp(interp(a)); break;
    case 'radio': radio(interp(a)); break;
    case 'gloss': gloss(a); break;
    case 'net': { const [n,t]=nameText(a); await netIn(n,interp(t)); break; }
    case 'me': await netOut(a); break;
    case 'ic': { const [n,t]=nameText(a); await icIn(n,t); break; }
    case 'icme': await icOut(a); break;
    case 'hear': { const [n,t]=nameText(a); await hear(n,t); break; }
    case 'choose': vars.choice=await waitFor(choose(parseOpts(a))); break;
    case 'say': { const [n,t]=nameText(a); const [txt,gl]=interp(t).split(' | ');
      if(n===(S.head.player||'Pemberton') && !busy && txt!=='…' && !/^[“"]/.test(txt) && !lastAsked){ await waitFor(acChoose([{text:txt}])); }
      if(n===(S.head.player||'Pemberton')) lastAsked=null; await acSay(n,txt,gl); break; }
    case 'ask': { const os=parseOpts(a); vars.choice=await waitFor(acChoose(os)); lastAsked=true; break; }   // the next 'say Pemberton' is this choice's line
    case 'endtalk': acShow(false); break;
    case 'wait': await sleep(+a); break;
    case 'var': { const m=a.match(/^\$?(\w+)\s*(\+?=)\s*(\$\w+|-?\d+)$/); const v=m[3].startsWith('$')?(vars[m[3].slice(1)]??0):+m[3]; vars[m[1]]=m[2]==='+='?(vars[m[1]]??0)+v:v; renderBadge(); break; }
    case 'do': await exec(S.macros[a.trim()]); break;
    case 'today': { const row=S.days[vars[a.replace('$','').trim()]??0]||{}; for(const k of Object.keys(S.legend||{})) vars[k]=0; for(const [k,v] of Object.entries(row)) if(k!=='label') vars[k]=v; used.clear(); refreshWorld(); break; }  // a new day: everything can be used again
    case 'str': { const m=a.match(/^\$?(\w+)\s*=\s*(.*)$/); vars[m[1]]=interp(m[2]); break; }  // a text variable
    case 'random': { const [k,lo,hi]=a.replace('$','').split(/\s+/); vars[k]=Math.floor(Math.random()*(+hi-+lo+1))+(+lo); break; }
    case 'xp': { // xp <var> <points> <name>: award practice points, announce level-ups
      const m=a.match(/^\$?(\w+)\s+(-?\d+)\s+(.*)$/); const before=levelOf(vars[m[1]]??0); vars[m[1]]=(vars[m[1]]??0)+(+m[2]); const after=levelOf(vars[m[1]]);
      add(el('stamp xp',null,`<b>+${m[2]} XP</b> · ${m[3]} ${interp('{bar:$'+m[1]+'}')}`)); lastFrom=null;
      if(after>before){ add(el('stamp levelup',null,`<b>${m[3]} is now ${LEVELS[after]}</b>`)); lastFrom=null; }
      renderBadge(); break; }
    case 'cards': vars.choice=await cards(a); break;
    case 'badge': badgeText=a; renderBadge(); break;
    case 'move': { const parts=a.split(/\s+/); const who=ids(parts[0]); const pts=parts.slice(1).filter(p=>/^-?[\d.]+,-?[\d.]+$/.test(p)).map(pt); const o=kv(a);
      who.forEach((id,k)=>{ const u=U[id]; u.path=pts.map(p=>[...p]); u.spd=o.speed??1; u.delay=(o.delay??0)+(o.stagger??0)*k; if(TEST){ const l=u.path[u.path.length-1]; if(l){ u.x=l[0]; u.y=l[1]; } u.path=[]; u.delay=0; } }); break; }
    case 'to': { // to id x,y id x,y ... (each unit its own destination) [speed=] [stagger=]
      const parts=a.split(/\s+/).filter(p=>!p.includes('=')); const o=kv(a); let k=0;
      for(let j=0;j<parts.length;j+=2){ const u=U[parts[j]]; u.path=[pt(parts[j+1])]; u.spd=o.speed??1; u.delay=(o.stagger??0)*k++; if(TEST){ [u.x,u.y]=u.path[0]; u.path=[]; u.delay=0; } } break; }
    case 'waitmove': { const w=ids(a||'all'); while(w.some(id=>U[id].path.length||U[id].delay>0)) await sleep(120); break; }
    case 'set': { const parts=a.split(/\s+/); const o=kv(a); for(const id of ids(parts[0])) Object.assign(U[id],o); break; }
    case 'teleport': { const parts=a.split(/\s+/); for(let j=0;j<parts.length;j+=2){ const u=U[parts[j]]; [u.x,u.y]=pt(parts[j+1]); u.path=[]; } break; }
    case 'fire': { const m=a.match(/^(\S+)\s+at\s+(\S+)(.*)$/); const miss=/\bmiss\b/.test(m[3]), light=/\blight\b/.test(m[3]);
      for(const id of ids(m[1])){ const u=U[id]; u.recoil=1; const mz=u.muzzle||iso(u.x,u.y); flash(mz[0],mz[1],tw*(light?.12:.2)); puff(mz[0],mz[1],{r:tw*.06,grow:tw*(light?.3:.7),life:1.6});
        const tgt=()=>{ if(/^-?[\d.]+,-?[\d.]+$/.test(m[2])) return iso(...pt(m[2])); const t=U[m[2]]; const p=t.top||iso(t.x,t.y); return miss?[p[0]-tw*.55,p[1]+tw*.12]:p; };
        tracer={a:[mz[0],mz[1]],b:tgt,t:0}; if(ids(m[1]).length>1) await sleep(90); }
      await sleep(420);
      if(!/^-?[\d.]+,-?[\d.]+$/.test(m[2])){ const t=U[m[2]], p=t.top||iso(t.x,t.y);
        if(miss) puff(p[0]-tw*.55,p[1]+tw*.12,{r:tw*.06,grow:tw*.55,life:2,col:'205,190,150',a:.85,vy:-4});
        else { flash(p[0],p[1]-tw*.05,tw*.2); puff(p[0],p[1],{r:tw*.06,grow:tw*.4,life:1.3,col:'90,80,70',a:.7}); } }
      break; }
    case 'burst': { const [x,y]=pt(a.split(/\s+/)[0]); const p=iso(x,y); flash(p[0],p[1],tw*.25); puff(p[0],p[1],{r:tw*.08,grow:tw*.9,life:2.6,col:'105,95,80',a:.8,vy:-5}); if(/shake/.test(a)) shake=.5; break; }
    case 'missile': { const [id,to]=a.split(/\s+/); const u=U[id]; const mz=u.muzzle||iso(u.x,u.y); missile={a:[mz[0],mz[1]],to:pt(to),t:0}; break; }
    case 'cam': { const [x,y,z]=pt(a); cam.tfx=x; cam.tfy=y; if(z) cam.tz=z; break; }
    case 'shake': shake=+a||.5; break;
    case 'hud': { const [t,d]=interp(a).split('|').map(s=>s.trim()); $('hudT').textContent=t; if(d) $('hudD').textContent=d; break; }
    case 'night': nightT=+a; break;
    case 'tutorial': tutorial(a); break;
    case 'tap': { const opts=a.split('||').map(o=>{ const [l,r]=o.split('='); return {targets:l.trim().split('|').map(s=>s.trim()),text:r.trim(),kind:'hint'}; });
      tapTargets=opts.map(o=>o.targets); vars.choice=await waitFor(choose(opts.map(o=>({kind:'hint',text:o.text})))); tapTargets=null; break; }
    case 'zoomgate': await waitFor(new Promise(res=>{ replies.innerHTML=''; const b=document.createElement('button'); b.className='chip hint'; b.textContent=a;
      zoomWanted=()=>{ zoomWanted=null; replies.innerHTML=''; res(); }; b.onclick=()=>zoomWanted&&zoomWanted(); replies.appendChild(b); if(TEST) soon(()=>zoomWanted&&zoomWanted()); })); break;
    case 'near': near=a.split(',').map(x=>x.trim()).filter(Boolean); refreshWorld(); break;
    case 'title': case 'checkpoint': case 'replay': case 'play': break;   // handled by the interpreter
    default: console.warn('unknown command',cmd,a);
  }
}
let replayVal=null, badgeText='', lastAsked=null;
function renderBadge(){ const b=$('badge'); b.hidden=!badgeText; if(badgeText) b.innerHTML=interp(badgeText); }
/* ================= the step interpreter and the saved state =================
   A script is compiled to a flat list of steps. Where the game is up to is a stack of frames,
   each {scene, code, pc}: plain data, so the whole game state can be saved and restored. */
let sceneIdx=0, nestDepth=0, frames=[];
const COMPILED={};
function compile(lines){
  const out=lines.map(l=>{ const [cmd,arg]=parseLine(l); return {cmd,arg}; }), stack=[];
  out.forEach((ins,i)=>{
    if(ins.cmd==='if'||ins.cmd==='while') stack.push(i);
    else if(ins.cmd==='else'){ const j=stack.pop(); out[j].jump=i+1; stack.push(i); }
    else if(ins.cmd==='end'){ const j=stack.pop(); if(out[j].cmd==='while'){ ins.loop=j; out[j].jump=i+1; } else out[j].jump=i+1; }
  });
  return out;
}
function code(scene,name){ const k=scene+'|'+name; if(COMPILED[k]) return COMPILED[k];
  const sc=sceneOf(scene); const lines=name==='main'?sc.script:name.startsWith('macro:')?sc.macros[name.slice(6)]:SYNTH[name];
  return COMPILED[k]=compile(lines||[]); }
const SYNTH={};                                  // small generated scripts, e.g. "Continue: next scene"
const WAITS=new Set(['net','me','ic','icme','hear','choose','ask','say','wait','waitmove','cards','tap','zoomgate','replay']);
const PRINTS=new Set(['net','me','ic','icme','hear','say']), CHOICES=new Set(['choose','ask','cards','tap']);
/* A step restored with .done has already printed its output or had its choice made: finish it without repeating anything */
async function resumeDone(f,ins){
  const d=f.done;
  if(ins.cmd==='say'){ if(!d.printed) return run1('say',ins.arg); await acWaitTap(); return; }
  if(PRINTS.has(ins.cmd)) return;                                      // the line is already in the thread
  if(ins.cmd==='choose'){ const o=parseOpts(ins.arg)[d.chosen]; vars.choice=d.chosen; if(!d.printed){ await chooseEffect(o); f.done.printed=1; save(); } return; }
  if(ins.cmd==='ask'){ const o=parseOpts(ins.arg)[d.chosen]; vars.choice=d.chosen; lastAsked=true; acOpts.classList.remove('show'); return; }
  if(ins.cmd==='tap'){ vars.choice=d.chosen; return; }
  if(ins.cmd==='cards'){ vars.choice=d.chosen; return; }
}
function loadScene(name){
  SNAME=name; S=sceneOf(name); LV=(S.head.levels||'4,8').split(',').map(Number); CAL=(S.head.calendar||'').split('|').map(x=>x.trim());
  applyChrome(); acShow(false); tutorial(); $('end').classList.remove('show');
  near=[]; used=new Set(); waiting=0; busy=false; propsBar.innerHTML=''; closePop(); badgeText=''; renderBadge(); $('scrim').classList.remove('show');
  resetUnits(); buildTrees(); tracks.length=0; gaps.length=0; fx.length=0; tracer=null; missile=null; shake=0;
  const [x,y,z]=pt(S.head.camera||'0,0,6'); cam.fx=cam.tfx=x; cam.fy=cam.tfy=y; cam.z=cam.tz=z; night=nightT=+(S.head.night||0);
  for(const [k,v] of Object.entries(S.vars)) if(vars[k]===undefined) vars[k]=v;
}
function startScene(i){ sceneIdx=i; loadScene(CAMPAIGN.order[i]); frames=[{scene:SNAME,code:'main',pc:0}]; }
async function interpret(){
  while(frames.length){
    const f=frames[frames.length-1], c=code(f.scene,f.code);
    if(f.pc>=c.length){ frames.pop(); if(f.nested){ nestDepth--; loadScene(f.caller); badgeText=f.badge; renderBadge(); near=f.near; refreshWorld(); } continue; }
    const ins=c[f.pc];
    switch(ins.cmd){
      case 'if': f.pc=cond(ins.arg)?f.pc+1:ins.jump; continue;
      case 'while': f.pc=cond(ins.arg)?f.pc+1:ins.jump; continue;
      case 'else': f.pc=ins.jump; continue;
      case 'end': f.pc=ins.loop!=null?ins.loop:f.pc+1; continue;
      case 'do': f.pc++; frames.push({scene:f.scene,code:'macro:'+ins.arg.trim(),pc:0}); continue;
      case 'play': { f.pc++; const fr={scene:ins.arg.trim(),code:'main',pc:0,nested:1,caller:SNAME,badge:badgeText,near:[...near]};
        nestDepth++; loadScene(fr.scene); frames.push(fr); continue; }
      case 'title': f.pc++; if(!nestDepth&&sceneIdx===CAMPAIGN.order.length-1) $('end').classList.add('show'); continue;
      case 'checkpoint': f.pc++; continue;            // no longer needed: the whole state is saved
      case 'replay':
        if(nestDepth||CAMPAIGN.order.length>1){ f.pc++; continue; }
        if(TEST){ TLOG.final=finalState(); TLOG.done=true; frames=[]; return; }
        save(); { const parts=ins.arg.split('||').map(x=>x.split('=').map(y=>y.trim())); const i=await choose(parts.map(p=>({kind:'hint',text:p[0]})));
          clearSave(); thread.innerHTML=''; for(const k of Object.keys(vars)) delete vars[k]; startScene(0);
          const v=parts[i][1]; if(v){ const [k,n]=v.split(':'); vars[k]=+n; } } continue;
    }
    if(f.done){ await resumeDone(f,ins); delete f.done; f.pc++; continue; }   // restored after this step's output or choice
    if(WAITS.has(ins.cmd)){ save();                 // saved with pc at this step, so a restore redoes it
      if(TEST&&RESTORE_AT&&TLOG.steps>=RESTORE_AT&&!TLOG.saved&&RESTORE_MODE==='before'){ TLOG.saved=true; return new Promise(()=>{}); } }
    printedHook=PRINTS.has(ins.cmd)?()=>{ f.done={printed:1}; save(); }:null;
    choiceHook=CHOICES.has(ins.cmd)?i=>{ f.done={chosen:i}; save(); printedHook=()=>{ f.done.printed=1; save(); }; }:null;
    await run1(ins.cmd,ins.arg);
    printedHook=null; choiceHook=null;
    if(TEST&&RESTORE_AT&&TLOG.steps>=RESTORE_AT&&!TLOG.saved&&RESTORE_MODE==='after'&&WAITS.has(ins.cmd)){ TLOG.saved=true; return new Promise(()=>{}); }
    if(frames[frames.length-1]===f){ delete f.done; f.pc++; }
  }
}

/* ----- saving and restoring ----- */
const SAVEKEY='offthebus:'+(CAMPAIGN.name||'scene');
let BUILD=0; { const t=Object.values(SCENE_TEXTS).join('\u0001')+'|engine-3'; for(let i=0;i<t.length;i++) BUILD=(BUILD*31+t.charCodeAt(i))|0; }
function snapshot(){
  return {v:1, build:BUILD, sceneIdx, nestDepth, scene:SNAME, frames, vars,
    thread:thread.innerHTML,
    world:{units, trees, tracks, gaps, cam:{fx:cam.tfx,fy:cam.tfy,z:cam.tz}, night:nightT, hudT:$('hudT').textContent, hudD:$('hudD').textContent,
      badge:badgeText, tip:$('tip').hidden?'':$('tip').textContent, near, used:[...used]},
    ac:{show:AC.classList.contains('show'), collapsed:AC.classList.contains('collapsed'), tag:acTag.textContent, bg:acTag.style.background,
      text:acText.textContent, gl:acGl.textContent, por:acPor.className, img:acPor.style.backgroundImage},
    lastAsked, lastFrom, end:$('end').classList.contains('show'), test:TEST?{seed:tseed,steps:TLOG.steps,choices:TLOG.choices}:null};
}
let saveTimer=null;
function save(force){ if(TEST&&!force&&!RESTORE_AT) return; try{ localStorage.setItem(SAVEKEY,JSON.stringify(snapshot())); }catch(e){} }
function clearSave(){ try{ localStorage.removeItem(SAVEKEY); }catch(e){} }

function restore(sn){
  sceneIdx=sn.sceneIdx; nestDepth=sn.nestDepth; for(const k of Object.keys(vars)) delete vars[k]; Object.assign(vars,sn.vars);
  loadScene(sn.scene); frames=sn.frames;
  const w=sn.world; units=w.units; for(const k in U) delete U[k]; for(const u of units) U[u.id]=u;
  trees.length=0; trees.push(...w.trees); tracks.push(...w.tracks); gaps.push(...w.gaps);
  cam.fx=cam.tfx=w.cam.fx; cam.fy=cam.tfy=w.cam.fy; cam.z=cam.tz=w.cam.z; night=nightT=w.night;
  $('hudT').textContent=w.hudT; $('hudD').textContent=w.hudD; badgeText=w.badge; renderBadge(); tutorial(w.tip); near=w.near; used=new Set(w.used);
  thread.innerHTML=sn.thread; thread.querySelectorAll('.b.typing').forEach(e=>e.closest('.row')?.remove()); lastDelivered=[...thread.querySelectorAll('.delivered')].pop()||null; lastFrom=sn.lastFrom??null;
  const a=sn.ac; if(a.show){ acShow(true); acTag.textContent=a.tag; acTag.style.background=a.bg; acText.textContent=a.text; acGl.textContent=a.gl; acPor.className=a.por; acPor.style.backgroundImage=a.img; setCollapsed(a.collapsed); }
  lastAsked=sn.lastAsked; if(sn.end) $('end').classList.add('show'); refreshWorld(); scrollDown();
  if(TEST&&sn.test){ tseed=sn.test.seed; TLOG.steps=sn.test.steps; TLOG.choices=sn.test.choices; TLOG.restored=true; }
}

/* ----- the campaign ----- */
async function play(){
  for(;;){
    await interpret();
    if(sceneIdx<CAMPAIGN.order.length-1){
      const next=sceneOf(CAMPAIGN.order[sceneIdx+1]).head.title.replace(/^Off the Bus — /,'');
      SYNTH['continue']=['choose hint: Continue: '+next];
      frames=[{scene:SNAME,code:'continue',pc:0}]; await interpret(); startScene(sceneIdx+1); continue;
    }
    if(CAMPAIGN.order.length>1){
      $('end').classList.add('show'); if(TEST){ TLOG.final=finalState(); TLOG.done=true; return; }
      SYNTH['again']=['choose hint: Start the campaign again']; frames=[{scene:SNAME,code:'again',pc:0}]; await interpret();
      clearSave(); thread.innerHTML=''; for(const k of Object.keys(vars)) delete vars[k]; startScene(0); continue;
    }
    return;
  }
}
async function start(){
  if(QS.has('reset')){ clearSave(); history.replaceState(null,'',location.pathname); }
  let sn=null; if(!TEST||RESUME){ try{ sn=JSON.parse(localStorage.getItem(SAVEKEY)); }catch(e){} }
  if(sn&&sn.v===1&&sn.build===BUILD){ try{ restore(sn); }catch(e){ console.warn('restore failed',e); sn=null; } if(sn) return play(); }
  if(sn&&sn.v===1){                                // a save from an older build: keep progress, restart the scene it was in
    thread.innerHTML=sn.thread; for(const k of Object.keys(vars)) delete vars[k]; Object.assign(vars,sn.vars);
    startScene(Math.min(sn.sceneIdx,CAMPAIGN.order.length-1)); stamp('<b>The game was updated.</b> Picking up at the start of '+($('hudD').textContent||'this scene')+'.');
    return play();
  }
  thread.innerHTML=''; for(const k of Object.keys(vars)) delete vars[k]; startScene(0); return play();
}
resize(); requestAnimationFrame(frame); start();
})();
