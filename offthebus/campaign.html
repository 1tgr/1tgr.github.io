<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Off the Bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --fg:#000000; --muted:#8a8a8e; --hair:#d8d8dc;
  --in:#e9e9eb; --in-fg:#000; --out:#0a84ff; --out-fg:#fff;
  --chip:#f2f2f7; --chip-fg:#0a84ff; --bar:#f7f7f9;
  --sheet:#ffffff; --scrim:rgba(0,0,0,.35); --hl:rgba(238,240,70,.8);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#ffffff; --muted:#8d8d93; --hair:#2c2c2e;
    --in:#26252a; --in-fg:#fff; --chip:#1c1c1e; --chip-fg:#4aa3ff; --bar:#121214;
    --sheet:#1c1c1e; --scrim:rgba(0,0,0,.55); --hl:rgba(190,195,40,.42);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#ffffff; --muted:#8d8d93; --hair:#2c2c2e;
  --in:#26252a; --in-fg:#fff; --chip:#1c1c1e; --chip-fg:#4aa3ff; --bar:#121214;
  --sheet:#1c1c1e; --scrim:rgba(0,0,0,.55); --hl:rgba(190,195,40,.42);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
@media (max-width:440px){.app{border:0}}

/* map */
.map{position:relative;flex:0 0 40%;min-height:220px;background:#7a9a52;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;top:10px;font-family:"Stardos Stencil","Impact","Arial Narrow",sans-serif;color:#f4efd8;text-shadow:0 1px 0 rgba(0,0,0,.45);line-height:1.05;pointer-events:none}
.hud .t{font-size:30px;letter-spacing:.5px}
.hud .d{font-size:15px;opacity:.92}
.drill{position:absolute;right:10px;top:10px;background:rgba(20,26,14,.62);color:#f4efd8;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.35;pointer-events:none}
.drill b{font-weight:600}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:7px;height:7px;border-radius:2px;background:rgba(244,239,216,.25)}
.pips i.on{background:#f4efd8}

/* contact header */
.head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--hair)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(#9aa6b5,#7b8798);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.head .n{font-size:15px;font-weight:600}
.head .s{font-size:12px;color:var(--muted)}

/* thread */
.thread{flex:1 1 auto;overflow-y:auto;padding:10px 12px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.stamp{align-self:center;text-align:center;color:var(--muted);font-size:11.5px;margin:10px 0 4px;max-width:88%;line-height:1.35}
.stamp b{font-weight:600}
.scroll{align-self:center;text-align:center;color:var(--muted);font-size:12.5px;font-style:italic;margin:6px 0;max-width:86%;line-height:1.4}
.from{font-size:11px;color:var(--muted);margin:7px 0 1px 12px}
.b{max-width:78%;padding:7px 12px;border-radius:18px;font-size:16px;line-height:1.3;word-wrap:break-word}
.b.in{align-self:flex-start;background:var(--in);color:var(--in-fg);border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:#34c759;color:var(--out-fg);border-bottom-right-radius:6px;margin-top:6px}
.b.typing{display:flex;gap:4px;padding:11px 13px}
.b.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.b.typing span:nth-child(2){animation-delay:.2s}.b.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.delivered{align-self:flex-end;font-size:11px;color:var(--muted);margin:2px 4px 2px 0}

/* reply area */
.replies{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:6px 12px 14px}
.chip{appearance:none;border:1px solid var(--hair);background:var(--chip);color:var(--chip-fg);border-radius:18px;padding:9px 14px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.chip:focus-visible{outline:3px solid var(--out);outline-offset:2px}
.chip:active{transform:scale(.98)}
.inputbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 10px}
.inputbar .field{flex:1;border:1px solid var(--hair);border-radius:18px;padding:8px 14px;color:var(--muted);font-size:15px}
.ptt{width:32px;height:32px;border-radius:50%;background:var(--hair);display:grid;place-items:center;color:var(--muted);font-size:15px}

/* training sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);display:none;align-items:flex-end;z-index:5}
.scrim.show{display:flex}
.sheet{background:var(--sheet);width:100%;border-radius:16px 16px 0 0;padding:16px 14px 18px}
.sheet h2{font-size:18px;margin:0 0 2px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.4}
.card{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;margin-top:8px;font:inherit;cursor:pointer}
.card:focus-visible{outline:3px solid var(--out);outline-offset:2px}
.card .ct{font-size:15.5px;font-weight:600}
.card .cs{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.card .lvl{float:right;font-size:12px;color:var(--muted);font-weight:500}
.sheet{max-height:88%;overflow-y:auto}
/* the O Group page: changed headings edged amber, unchanged ones grey and tappable, the mission highlighted as with a marker pen */
.oi{display:block;width:100%;text-align:left;border:1px solid var(--hair);border-left:4px solid #e3a33a;background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;margin-top:7px;font:inherit}
.oi.same{border-left-color:var(--hair);cursor:pointer}
.oi .oh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.oi .ot{font-size:14.5px;line-height:1.4;margin-top:2px}
.oi.same .ot{color:var(--muted)}
.oi .ot.mission .hl{background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px;margin:0 -2px}
.card.chk{display:flex;align-items:center;gap:10px}
.card.chk .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.card.chk[aria-pressed="true"] .box{background:var(--out);border-color:var(--out);color:#fff}
.card.go{text-align:center;background:var(--out);border-color:var(--out);color:#fff}
@media (prefers-reduced-motion:reduce){.b.typing span{animation:none}}

.gloss{align-self:flex-start;max-width:80%;margin:2px 0 4px 42px;font-size:12.5px;line-height:1.35;color:var(--muted);font-style:italic}
.ic{align-self:center;max-width:86%;text-align:center;font-size:13px;color:var(--fg);opacity:.85;margin:6px 0;padding:5px 10px;border:1px dashed var(--hair);border-radius:10px}
.ic b{font-weight:600;color:var(--muted);margin-right:4px}
.b.ic-in{align-self:flex-start;background:var(--in);color:var(--in-fg);border-bottom-left-radius:6px}
.b.ic-out{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px;margin-top:6px}
.chip.hint{color:var(--fg);background:transparent;border-style:dashed}
.avatar.f2f{background:linear-gradient(#c9a77a,#a7835a)}
.thread[hidden]{display:none}
.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,132,255,.92);color:#fff;font-size:13px;padding:7px 12px;border-radius:14px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tip[hidden]{display:none}
.title{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,18,10,.78);opacity:0;transition:opacity 1.2s;pointer-events:none}
.title.show{opacity:1}
.title div{font-family:"Stardos Stencil","Impact","Arial Narrow",sans-serif;color:#f4efd8;text-align:center;line-height:1.1}
.title .big{font-size:44px;letter-spacing:1px}
.title .sub{font-size:15px;margin-top:8px;opacity:.9}
@media (prefers-reduced-motion:reduce){.title{transition:none}}
.ac{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:none;cursor:pointer;font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.ac.show{display:block}
.ac .bal{position:relative;background:#fdf7e4;color:#6b5236;border-radius:34px/44px;padding:26px 24px 30px;min-height:118px;box-shadow:0 3px 0 #e7dcbd,0 8px 24px rgba(60,40,10,.25);font-size:19px;font-weight:700;line-height:1.45}
.ac .tag{position:absolute;top:-16px;left:26px;padding:4px 16px;border-radius:16px;color:#fff;font-weight:800;font-size:16px;transform:rotate(-4deg);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.ac .gl{display:block;margin-top:8px;font-size:13.5px;font-weight:700;color:#a68c66;font-style:italic}
.ac .more{position:absolute;right:26px;bottom:12px;color:#e3a33a;font-size:16px;visibility:hidden;animation:bob 1s ease-in-out infinite}
.ac.ready .more{visibility:visible}
@keyframes bob{50%{transform:translateY(4px)}}
.ac .opts{position:absolute;right:6px;bottom:calc(100% + 18px);background:#fdf7e4;border-radius:26px;padding:10px 8px;box-shadow:0 3px 0 #e7dcbd,0 8px 24px rgba(60,40,10,.25);display:none}
.ac .opts.show{display:block}
.ac .opts button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:#6b5236;padding:8px 14px 8px 30px;border-radius:14px;position:relative;cursor:pointer}
.ac .opts button:hover,.ac .opts button:focus-visible{background:#f6ecc9;outline:none}
.ac .opts button:hover::before,.ac .opts button:focus-visible::before{content:"▶";position:absolute;left:10px;color:#e3a33a;font-size:13px;top:11px}
@media (prefers-reduced-motion:reduce){.ac .more{animation:none}}
.chip.ch-net{color:#1f9a45}
.chip.ch-ic{color:#0a84ff}
.row{display:flex;align-items:flex-end;gap:6px;align-self:flex-start;max-width:86%}
.row .b{max-width:100%}
.from{margin-left:42px!important}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:-.2px}

son", "x": 15.2, "y": 7.3, "col": "#4a5634", "hidden": 1}, {"id": "sm1", "type": "smoke", "x": 9.8, "y": 6.1, "hidden": 1}, {"id": "sm2", "type": "smoke", "x": 12.5, "y": 6.0, "hidden": 1}, {"id": "sm3", "type": "smoke", "x": 15.2, "y": 6.1, "hidden": 1}, {"id": "sm4", "type": "smoke", "x": 17.9, "y": 6.2, "hidden": 1}, {"id": "rpg", "type": "person", "x": 22.5, "y": 5.6, "col": "#3a4430", "enemy": 1, "hidden": 1}, {"id": "mg", "type": "person", "x": 23.8, "y": 5.2, "col": "#3a4430", "enemy": 1, "hidden": 1}, {"id": "snp", "type": "person", "x": 25.5, "y": 4.6, "col": "#3a4430", "enemy": 1, "hidden": 1}, {"id": "flank", "type": "person", "x": 27, "y": 5.4, "col": "#3a4430", "enemy": 1, "hidden": 1}, {"id": "sp1", "type": "person", "x": 23.4, "y": 5.0, "col": "#3a4430", "down": 1, "hidden": 1}, {"id": "sp2", "type": "person", "x": 25.2, "y": 4.4, "col": "#3a4430", "down": 1, "hidden": 1}, {"id": "sp3", "type": "person", "x": 26.6, "y": 5.1, "col": "#3a4430", "down": 1, "hidden": 1}, {"id": "lynx1", "type": "lynx", "x": -4, "y": 18, "alt": 3, "hidden": 1}, {"id": "arrv1", "type": "arrv", "x": -8, "y": 7.5, "hidden": 1}, {"id": "fj1", "type": "rover", "x": 36, "y": 7.4, "hidden": 1}, {"id": "fj2", "type": "rover", "x": 38, "y": 7.4, "hidden": 1}, {"id": "pol", "type": "car", "x": 40, "y": 7.6, "col": "#eef1ea", "trim": "#2f6b3a", "hidden": 1}, {"id": "fjp1", "type": "person", "x": 20.4, "y": 8.2, "col": "#5f6a44", "hidden": 1}, {"id": "fjp2", "type": "person", "x": 17.8, "y": 9.0, "col": "#5f6a44", "hidden": 1}, {"id": "fjp3", "type": "person", "x": 19.4, "y": 6.4, "col": "#5f6a44", "hidden": 1}, {"id": "polw", "type": "person", "x": 22.0, "y": 9.2, "col": "#3b6b48", "hidden": 1}, {"id": "polm", "type": "person", "x": 25.2, "y": 6.9, "col": "#3b6b48", "hidden": 1}, {"id": "capt", "type": "person", "x": 16.6, "y": 10.6, "col": "#4a5634", "hidden": 1}]}
---script
stamp <b>Friday 4 May 1990</b> · 1650<br>The Sibbesse road
radio A courier run: the week’s int summaries to a Bundeswehr Panzergrenadier company in the next valley, and back to the hides by stand-to. Nine days of routine. Hatches open, heads out, the sun low behind the pines.
near notebook
choose One One, One Two, One Zero. Line ahead. One Two lead. Out.
to b 11,7.5 a 9.6,7.5 p 8.2,7.5 speed=0.8 stagger=0.3
cam 8,7.1,6.4
wait 1800
radio The road bends right around a stand of pines.
if $sawmerc=1
stamp A grey Mercedes with H plates, across the road ahead. You have seen it before: the farm track, two days ago.
end
waitmove b,a,p
cam 14.5,7.6,10.5
near merc,trabant,plate,suitcase,mother,child,father,drivers,road,treeline,notebook
radio Round the bend, the road is blocked. A Mercedes has nudged the rear corner of a Trabant. Both cars are at an angle across the road. Nobody is hurt.
hear Mercedes driver: Sind Sie blind?
gloss “Are you blind?”
hear Trabant driver: Nein. Nein.
wait 1200
net One One: One Zero, One One. Hold on a minute. Take a look.
wait 1600
net One One: That’s the same as outside Detmold. Same cars. Same family. Tenner says it isn’t.
choose One One, One Two, One Zero. Close down. Out. || hint: Stay up and look
if $choice=0
var closed=1
set a,p,b open=0
radio Hatches shut. Through the periscope the scene is smaller and greener, and still there.
end
radio Eighty metres. The tanks are still rolling.
choose One Two, One Zero. Bypass right, over the verge, as before. Out. || One One, One Two, One Zero. Halt. Observe. Out. || One One, One Two, One Zero. Reverse, back round the bend. Out. || One Two, One Zero. Dismount and check it, on foot. Out. || One One, One Two, One Zero. Treeline right. Coax. Fire. Out.
var dec=$choice
if $dec=0
var out=1
end
if $dec=2
var out=3
end
if $dec=3
var out=4
end
if $dec=4
var out=5
end

# Halt and observe: a second decision
if $dec=1
to b 14,7.5 a 12.6,7.5 p 11.2,7.5 speed=0.5
waitmove b,a,p
radio The troop stops seventy metres short.
wait 1600
radio The father lifts a hand to the side of his head, as if to brush away a fly.
set mg hidden=0
wait 700
set mg hidden=1
net One One: One Zero, One One. Movement, treeline right. Not wind.
choose One One, One Two, One Zero. Treeline right. Engage. Out. || One One, One Two, One Zero. Reverse. Now. Out. || hint: Keep watching
if $choice=0
var out=6
end
if $choice=1
var out=3
end
if $choice=2
var out=7
end
end

# 1 · Bypass over the verge, as on 24 April
if $out=1
set b trail=1
move b 15,8.3 17.5,8.6 speed=0.6
wait 1400
burst 17.5,8.6 shake
set b smoke=1
move b 17.5,8.6
radio The verge lifts under One Two. A column of earth and smoke, and the tank lurches and stops with a track off.
set rpg hidden=0
missile rpg 17.6,8.4
wait 1200
burst 17.6,8.4 shake
net One One: One Zero, One One. Contact. Treeline, north. One Two’s been hit.
do contact
do immediate
do sniper
do grenades
do reaction
radio The Mercedes driver has a rifle out from under his coat.
fire a at mdriver light
set mdriver down=1
var driverkia=1
move father 21.5,5.6 22.5,4 speed=1.2
move mother 21.6,6 22.6,4.4 speed=0.9
wait 1600
set father,mother hidden=1
net One Two: One Two. Watts. Commander’s dead. Loader and driver hit. Wait out.
var bxkia=1
var iqwia=1
radio When the firing stops, the child is lying on the verge by the Trabant. She is not moving.
set child down=1
end

# 4 · Dismount and check it on foot
if $out=4
to b 15,7.5 a 13.6,7.5 p 12.2,7.5 speed=0.5
waitmove b,a,p
set bxf,iqf hidden=0
radio Baxter climbs down with his loader and walks forward along the road, out of the tank, into the open. Rifles slung.
net One One: One Zero, One One. Don’t like this.
move bxf 18,7.9 speed=0.5
move iqf 18.2,7.2 speed=0.5
wait 2200
radio The mother takes a step back. The father’s hand goes inside his jacket.
fire father,mdriver at bxf light
wait 300
fire father,mdriver at iqf light
set bxf,iqf down=1
radio Two short bursts. Baxter and Iqbal go down in the road.
set rpg hidden=0
missile rpg 15.2,7.6
wait 1200
burst 15.2,7.6 shake
radio An RPG from the pines bursts against One Two’s front. The armour holds.
do contact
do immediate
do sniper
do reaction
fire a at mdriver light
set mdriver down=1
var driverkia=1
move father 21.5,5.6 22.5,4 speed=1.2
move mother 21.6,6 22.6,4.4 speed=0.9
wait 1600
set father,mother hidden=1
net One Two: One Two. Watts. Commander and loader down. They’re not moving. Wait out.
var bxkia=1
var iqkia=1
radio When the firing stops, the child is lying on the verge by the Trabant. She is not moving.
set child down=1
end

# 7 · Kept watching: the trap is sprung at range
if $out=7
wait 1200
radio The father drops his hand.
set rpg hidden=0
missile rpg 14.2,7.4
wait 1200
burst 14.2,7.4 shake
radio An RPG from the pines bursts on One Two’s front plate. The tank rocks. The armour holds.
do contact
do immediate
do sniper
do grenades
var iqwia=1
do reaction
fire a at mdriver light
set mdriver down=1
var driverkia=1
move father 21.5,5.6 22.5,4 speed=1.2
move mother 21.6,6 22.6,4.4 speed=0.9
wait 1600
set father,mother hidden=1
net One Two: One Two. Loader hit, not bad. Still in action. Out.
radio When the firing stops, the child is lying on the verge by the Trabant. She is not moving.
set child down=1
end

# 5 and 6 · Engage the treeline first
if $out=5
to b 14,7.5 a 12.6,7.5 p 11.2,7.5 speed=0.7
waitmove b,a,p
end
if $out>4
if $out<7
fire a,p,b at 23.5,5.2 light
wait 300
fire p at 22.5,5.6
burst 22.5,5.6
wait 300
fire b at 25.5,4.6
burst 25.5,4.6
set rpg,mg,snp,flank hidden=0
do contact
radio The Mercedes driver pulls a rifle from under his coat.
fire a at mdriver light
set mdriver down=1
var driverkia=1
missile rpg 16.5,9.5
wait 1200
burst 16.5,9.5
radio The father has something in his hand and is pressing it. Nothing happens.
if $out=5
do sniper
do grenades
var iqwia=1
end
fire a at 21.2,7.6 light
radio A burst of coax goes across the road at the father as he runs. He goes down, still moving. The burst goes on past him.
set father down=1
var fathercap=1
move rpg,mg,snp,flank 25,1 speed=1.3
set sp1,sp2,sp3 hidden=0
wait 1600
set rpg,mg,snp,flank hidden=1
var spk=3
wait 1600
radio When the firing stops, the mother is lying beside the Trabant, and so is the child. Neither of them is moving.
set mother,child down=1
var mumkia=1
if $out=5
net One Two: One Two. Loader hit, not bad. Out.
end
end
end

if $out!=3
do sitrep
end

# 3 · Reverse and call it in
if $out=3
set sm2,sm3,sm4 hidden=0
to b 6,7.5 a 4.6,7.5 p 3.2,7.5 speed=0.7
cam 9,7.1,6.4
waitmove b,a,p
choose Zero, One Zero. Contact, wait out.
choose Zero, One Zero. Suspected ambush, civilians as bait, Sibbesse road three kilometres short of the village. Pulled back round the bend. Request air and a reaction force. Over.
net Zero: Zero. Lynx on its way. Hold where you are. Do not go forward. Out.
wait 1600
set rpg,mg,snp,flank hidden=0
move rpg 23,2 speed=0.7
move mg 24.2,2 speed=0.7
move snp 25.8,1.8 speed=0.7
move flank 27.4,2.2 speed=0.7
set sm2,sm3,sm4 hidden=1
radio The smoke thins. Through the gap at the bend: men in the pines, moving north, away from the road. They aren’t hurrying.
move mdriver 21,5 22,3 speed=0.9
move father 21.5,5.6 22.5,3 speed=0.9
wait 2400
set rpg,mg,snp,flank,mdriver,father hidden=1
set mother,child sit=1
var childok=1
var mumcap=1
end

# Aftermath: the map holds, and the player looks
wait 1200
stamp 1710
hud 1710
set sm1,sm2,sm3,sm4 hidden=1
cam 19,8.8,9
set lynx1 hidden=0
move lynx1 15.5,12.5 speed=1.4
waitmove lynx1
set lynx1 alt=0
set fj1,fj2,pol hidden=0
move fj1 23.2,7.4 speed=1
move fj2 24.6,7.4 speed=1 delay=0.6
move pol 26,7.6 speed=1 delay=1.2
if $out=1
set arrv1 hidden=0
move arrv1 14.2,7.6 speed=0.8
end
waitmove fj1,fj2,pol
set fjp1,fjp2,fjp3,polm,capt hidden=0
if $out=1
set crater hidden=0
end
if $out=4
set bxf,iqf cover=1
end
if $mumkia=1
set mother cover=1
end
if $mumcap=1
set mother sit=1
end
if $fathercap=1
teleport father 19.3,6.5
set father down=0 sit=1 hidden=0
end
if $childok=1
teleport child 21.6,9.2
set child sit=1
set polw hidden=0
else
set child cover=1
end
if $pemwound=1
radio A medic from the Lynx picks the splinters out of your cheek and puts a dressing on it.
end

str lkv=A Feldjäger kneels on the right-hand verge, a few metres short of the Mercedes, easing a bayonet into the gravel. A thin wire runs from the spot into the grass, towards where the father stood.
if $out=1
str lkv=A crater in the right-hand verge, black at the edges, with pieces of One Two’s track in it.
end
str lkd=The Mercedes driver’s door is open. He is gone.
if $driverkia=1
str lkd=The Mercedes driver lies in the road. A Feldjäger has opened his suit jacket: grey army underwear, a Cyrillic label at the collar. Soviet army boots under the suit trousers.
end
str lkf=A quilted jacket at the edge of the pines, dropped where he went into the trees.
if $fathercap=1
str lkf=The father sits against the Mercedes with his legs bandaged, a Feldjäger standing over him. He looks at nobody, and says nothing in any language.
end
str lkw=Her handbag, dropped on the verge. A lipstick, West German cigarettes, a bus ticket from Hildesheim.
if $mumcap=1
str lkw=The woman sits on the verge, hands in her lap. A Feldjäger has her handbag open on the Mercedes bonnet: a small camera, East German marks, an identity card for Inge Hartmann, Magdeburg.
end
if $mumkia=1
str lkw=A grey blanket by the Trabant. A Feldjäger stands over it, turning over an identity card for Inge Hartmann, Magdeburg, and a small camera that was sewn into the hem of her dress.
end
str lkc=A small shape under a grey blanket, by the Trabant’s back wheel.
if $childok=1
str lkc=She sits on the verge in a blanket beside the policewoman, holding a mug in both hands. She asks the policewoman when they are going home.
end
str lkp=Cartridge cases in the pine needles, an RPG launcher left behind, and broken bracken going north.
if $spk=1
str lkp=A man in civilian clothes face down in the pine needles, where the coax went. Cartridge cases, an RPG launcher, broken bracken going north.
end
if $spk=2
str lkp=Two men in civilian clothes face down in the pine needles, where the coax went. Cartridge cases, an RPG launcher, broken bracken going north.
end
if $spk=3
str lkp=Three men in civilian clothes among the pines, where the coax and the HESH went. Cartridge cases, an RPG launcher, splintered trunks.
end
if $out=3
str lkp=Flattened bracken where men lay, a scatter of cigarette ends, and a path of broken bracken going north.
end
str lk12=One Two, untouched. Its crew sit on the turret roof and don’t say much.
if $out=1
str lk12=One Two sits beyond the crater with a track off and a black scar behind the turret. A Chieftain recovery vehicle is backing up to it. Hollis is in One Two’s turret, taking Baxter’s things out himself, one at a time.
end
if $out=4
str lk12=One Two stands where it stopped, with two grey blankets in the road in front of it. Hollis is in its turret, taking Baxter’s things out himself, one at a time.
end
if $out=5
str lk12=One Two’s loader’s hatch is open, and there is blood on the rim.
end
if $out=7
str lk12=One Two’s front plate is scorched and pitted where the RPG burst.
end
str lk10=Your tank. Dust on the glacis, nothing else.
if $smoked=1
str lk10=Your turret, sooty round the smoke dischargers.
end
if $pemwound=1
str lk10=A bright chip in the rim of your cupola, a hand’s width from where your head was.
end
str lkl=The Lynx in the field, rotors turning. The crew stay in their seats, waiting to take the captain back.
if $iqwia=1
str lkl=The Lynx in the field, rotors turning. One Two’s loader walks across to it with his arm strapped up.
end
if $bxkia=1
str lkl=The Lynx in the field, rotors turning. Two stretchers go aboard from One Two.
end
if $out=4
str lkl=The Lynx in the field, rotors turning. Two stretchers go aboard under grey blankets.
end
near am_trabant,am_merc,am_verge,am_driver,am_father,am_woman,am_child,am_pines,am_onetwo,am_yourtank,am_lynx,am_captain,am_police,notebook
choose act: Back to the hides
if $out=3
say Sgt Hollis: Tenner, sir. When you’ve got it. | He doesn’t smile. You don’t either.
endtalk
end

stamp 1900 · The hides
hud 1900
night 0.4
radio BBC World Service: “Reports are emerging of an incident involving British forces in Lower Saxony this afternoon. The Foreign Office has confirmed the incident but declined to give details. We will bring you more as we have it.”
wait 1400
radio AFN: “American officials say the incident in northern Germany this afternoon involved an apparent ambush of a British military patrol by what U.S. intelligence describes as Soviet special forces personnel operating in civilian disguise. The Pentagon declined to confirm or deny the reports.”
wait 1400
radio BBC World Service, ten o’clock: “The Defence Secretary, Mr Patten, declined tonight to confirm reports of a ‘serious incident’ involving British forces in Germany. He will make a statement to the House tomorrow.”
wait 1400
title
replay Play again

def sniper
if $smoked=1
set snp hidden=0
fire snp at p light miss
radio A round cracks somewhere into the smoke.
else
if $closed=0
set snp hidden=0
fire snp at p light
var pemwound=1
radio Something cracks off the rim of your cupola, a hand’s width from your head. Your cheek is wet. Splinters.
else
set snp hidden=0
fire snp at p light miss
radio A round rings off your closed hatch.
end
end
enddef

def contact
choose Zero, One Zero. Contact, wait out.
net Zero: Zero.
enddef

def sitrep
str sre=Enemy in civilian clothes, gone north on foot.
if $spk=1
str sre=Enemy in civilian clothes, one dead, the rest gone north on foot.
end
if $spk=2
str sre=Enemy in civilian clothes, two dead, the rest gone north on foot.
end
if $spk=3
str sre=Enemy in civilian clothes, three dead and one wounded prisoner, the rest gone north on foot.
end
str sro=No casualties.
str srr=Request the Feldjäger.
if $iqwia=1
str sro=One wounded.
str srr=Request casevac and the Feldjäger.
end
if $out=1
str sro=One Two hit and immobilised. One dead, two wounded.
end
if $out=4
str sro=Two dead from One Two.
str srr=Request casevac and the Feldjäger.
end
str src=One child dead.
if $mumkia=1
str src=A woman and a child dead.
end
choose Zero, One Zero. Ambush, Sibbesse road, at the bend three kilometres short of the village. {$sre} {$sro} {$src} {$srr} Over.
if $out=6
net Zero: Zero. Lynx on its way. Reaction force and Feldjäger on their way. Hold where you are. Out.
else
net Zero: Zero. Lynx on its way for your casualties. Reaction force and Feldjäger on their way. Hold where you are. Out.
end
enddef

def immediate
choose ic: Smoke! || hint: Get fire down first
if $choice=0
var smoked=1
set sm1,sm2,sm3,sm4 hidden=0
end
enddef

def grenades
burst 13.2,6.9
wait 400
burst 14.6,8.2
radio Grenades from the pines, small and flat, bursting between the tanks. One drops by One Two’s open loader’s hatch.
enddef

def reaction
choose One One, One Two, One Zero. Contact. Treeline right. Coax. Fire. Out.
fire a,p at 23.5,5.2 light
wait 300
fire a,p at 25.5,4.6 light
set mg,flank hidden=0
if $contact>39
var spk=1
end
if $contact>99
var spk=2
end
move rpg,mg,snp,flank 25,1 speed=1.2
wait 1800
set rpg,mg,snp,flank hidden=1
if $spk>0
set sp1 hidden=0
end
if $spk>1
set sp2 hidden=0
end
enddef

---props
@notebook your notebook
kit: yes
icon: 📓
verb: Write in
look: radio Your notebook. This morning’s orders, and under them: “Courier: int sums to PzGren coy. Back by 1900.”
use: radio You write the time and the place. Then you sit with the pencil and write nothing else.
@merc the Mercedes
unit: merc
icon: 🚘
look: radio A light grey Mercedes saloon, a dent in the front wing.
@trabant the Trabant
unit: trabant
icon: 🚙
look: radio A Trabant 601, mid-blue, two suitcases strapped to the roof rack. It sits low at the back, as if the boot were full.
@plate the number plates
at: 19.5,8
icon: 🔍
look: radio The Mercedes has an H plate: Hannover. The Trabant has a DDR sticker, and a plate that looks newly washed.
@suitcase the suitcase
at: 18.6,8.4
icon: 🧳
look: radio A suitcase has burst on the verge. Children’s clothes beside it on the grass, folded, in a neat pile.
@mother the woman
unit: mother
icon: 👩
look: radio A woman in her thirties in a new anorak and clean white trainers, a handbag over her arm. She stands beside the child without touching her.
@child the child

radio The troop has squared away at the range and pulled out onto the road north for Detmold: across the Senne to Augustdorf, then over the ridge. Twenty-odd kilometres of heath, woodland and lanes.
near notebook,traffic
tutorial Line ahead for the road; wedge for going off-road
choose One One, One Two, One Zero. Line ahead. Out. || One One, One Two, One Zero. Wedge. Out.
tutorial
if $choice=1
net One One: One One. Wedge? On this road?
choose One One, One Two, One Zero. Correction. Line ahead. Out.
end
gloss Line ahead — one behind the other, for roads. Wedge — an arrowhead, for open ground.

cam 8,7.1,6.4
move golf -12,1.5 speed=1.4
move van -12,1.5 speed=1.2 delay=3
wait 2000
radio Across the fields, on the parallel road, civilian traffic. All of it heading west.
radio BBC World Service: “…Federal Border Police report increased traffic from the German Democratic Republic this week. The Interior Ministry has urged calm and asks West German citizens to extend the usual hospitalities to recent arrivals…”
waitmove a,p,b
cam 13,7.4,5.6
near merc,trabant,plate,suitcase,family,hedge,field,notebook
radio Round the bend, the road is blocked. A Mercedes has nudged the rear corner of a Trabant. Both cars are at an angle across the road. Nobody is hurt.
choose Zero, One Zero. Possible obstacle. Wait, out.
set a,p,b open=1
hear Mercedes driver: Mein Gott, schauen Sie sich das an!
gloss “My God, look at this!”
hear Mercedes driver: Sind Sie blind?
gloss “Are you blind?”
hear Mercedes driver: Versicherung — haben Sie Versicherung?
gloss “Insurance — do you have insurance?”
hear Trabant driver: Nein.
gloss “No.” Their East German state insurance means nothing on a West German road. They are from the other side.
net Zero: One Zero, Zero. Sitrep your location, over.
choose Zero, One Zero. Civilian RTA blocking the road. No casualties. No way through. Over.
gloss RTA — road traffic accident.
net Zero: Bypass it. Don’t get drawn in. Holley’s been on the net — don’t keep him. Out.

tutorial Switch to wedge, then tap the field beyond the crash
choose One One, One Two, One Zero. Wedge. Out. || One One, One Two, One Zero. Line ahead. Bypass left, through the trees. Out.
if $choice=1
net One One: One One. Trees are too thick, One Zero. Field’s the only way.
choose One One, One Two, One Zero. Wedge. Out.
end

tutorial

radio The mother pulls the child closer as the tanks come off the road.
wait 1400
radio Both drivers stop arguing and watch. The Trabant driver glances at the tanks, once.
wait 1600
radio As the tanks pass, the child waves. Once. You can’t tell whether it’s hope, or fear, or neither.
radio In One Two’s cupola, Baxter looks towards the family for a moment, then looks ahead again.
waitmove a,p,b
set a,p,b trail=0
near tracks,gaps,notebook,family

tutorial

net One One: Yeah.

waitmove a,p,b

title

stamp <b>Tuesday 24 April 1990</b> · 1815<br>Over the Teutoburger Wald to Detmold
radio Past Augustdorf the road climbs into the Teutoburger Wald. Spruce and beech close in on both sides, and the engines echo.
near notebook
to a 7,7.5 p 5.7,7.5 b 4.4,7.5 speed=0.9 stagger=0.3
cam 3,5,7
wait 2600
cam 6,4,7.5
radio At the top of the climb, Hiddesen. Off to the right, high on its hill above the trees, a green copper giant with a sword raised.
near hermann,notebook
waitmove a,p,b
net One One: Big bloke up there’s been waving that sword nearly two thousand years.
net One Two: Yeah. Hasn’t stopped anyone yet.
gloss The Hermannsdenkmal: the Hermann Monument, on the Grotenburg above Detmold.
wait 1400
teleport a 17.6,7.5 p 16.3,7.5 b 15,7.5
cam 21,7.5,7
hud 1840
radio Down off the ridge into Detmold.
tutorial Town speed limit: 50 km/h. Indicate at every junction
choose One One, One Two, One Zero. Town. Fifty, and indicate. Out. || hint: Let the drivers get on with it
tutorial
if $choice=1
net One One: One One. Fifty in town, lads. Indicators. Out.
end
to a 27,7.5 p 25.7,7.5 b 24.4,7.5 speed=0.6 stagger=0.3
wait 1800
radio Three Challengers slow to fifty and indicate in turn, one after another, like learner drivers.
near townsfolk,oldman,notebook
waitmove a,p,b
tutorial 30 km/h in the old town. Cobbles ahead
wait 1200
tutorial
cam 31,8,6.5
to a 33,7.5 p 31.7,7.5 b 30.4,7.5 speed=0.45 stagger=0.3
radio Tracks on cobbles: a noise like a rack of crockery going down the stairs. Timber-framed houses close enough to touch.
radio Shoppers stop and look up. Schoolchildren point. An old man on the kerb takes his hat off and holds it, and watches the whole troop go by.
waitmove a,p,b
net One One: This isn’t built for tanks.
choose Just don’t put one through somebody’s window. || hint: Say nothing
if $choice=0
net One One: One One. I’ll tell the driver.
end
tutorial Tight turn ahead: slow approach
cam 36,10,6.5
to a 41,7.5 p 39.7,7.5 b 38.4,7.5 speed=0.4 stagger=0.4
radio The turn by the Schloss moat takes One Zero three goes. A shopkeeper holds her door shut until you’re past.
near schloss,notebook
waitmove a,p,b
tutorial
wait 800
cam 50,7.5,7
hud 1905
to a 56,7.5 p 54.7,7.5 b 53.4,7.5 speed=0.8 stagger=0.3
radio Out past the old town, the married quarters: streets of identical semi-detached houses, the regiment’s families’ homes.
wait 1800
radio Curtains drawn. No cars in the drives. A child’s bike chained to a railing.
near quarters,bike,notebook
waitmove a,p,b
wait 1600
cam 62,7,6.5
to a 61.4,7.5 p 60.1,7.5 b 58.8,7.5 speed=0.7 stagger=0.3
radio Hobart Barracks. A red-and-white barrier, a brick gatehouse, a sentry with an SA80. The sentry steps out and raises a hand.
waitmove a,p,b
near gate,notebook
radio The guard commander comes out of the gatehouse with a clipboard and walks up to your tank.
say Guard Commander: Evening, sir. ID card, please.
ask Hand down your ID card
say Guard Commander: Thank you, sir. You’re on the list.
say Guard Commander: Tank park, line four, for tonight.
say Guard Commander: Message from the workshop: sixteen hundred tomorrow.
say Pemberton: Thank you, Corporal.
endtalk
radio He hands the card back and waves the barrier up.
set barrier up=1
cam 69,11,7
move a 65.5,7.5 68.5,11.5 71.5,11.5 speed=0.6
move p 65.5,7.5 68.5,12.9 71.5,12.9 speed=0.6 delay=1.2
move b 65.5,7.5 68.5,14.3 71.5,14.3 speed=0.6 delay=2.4
waitmove a,p,b
set a,p,b open=0
radio Engines off. In the quiet, the tank park is mostly oil stains. Two Challengers sit under cam nets in the far corner. The rest of the squadron has already gone forward.
near tankpark,notebook
wait 1400
night 0.65
hud 2130
stamp 2130 · the Officers’ Mess
radio The Mess is one steward and a plate kept warm under a cover.
choose act: Write a letter home || act: Turn in
if $choice=0
radio You write a page. It says the weather is warm and the food is fine and not much else.
else
radio Clean sheets. You’re asleep before you’ve decided whether to set an alarm.
end
radio BBC World Service, late: “…weather across central Europe remaining warm, with isolated showers in the highlands…”
wait 1600
night 0
hud 0600 | 25 April 1990
stamp <b>Wednesday 25 April 1990</b> · 0600<br>Hobart Barracks
radio Stand-to in the tank park, then a day of waiting: last kit from the block, a NAAFI run, the tanks checked and checked again.
wait 1800
hud 1600
radio At sixteen hundred the troop starts up and moves across to the workshop bay.
set a,p,b open=1
move a 74,11.5 78,11.5 speed=0.7
move p 74,12.9 78,12.9 speed=0.7
move b 74,14.3 78,14.3 speed=0.7
waitmove a,p,b
title
replay Play again

stamp <b>Saturday 12 May 1990</b> · 0700<br>The hides, south of Hildesheim · Day 4 of the war
radio Three days at Stand-To-Charlie. The artillery to the east has been continuous and distant. Nothing has come near the troop. 2nd Troop is out in front on the ridge, as the squadron’s screen.
near notebook,rangecard,periscope,telegraph,bv
wait 900
net Zero Alpha: Hello all stations, this is Zero Alpha. Today is the day. Sunray reports OMG forward elements have penetrated to within five kilometres of our screen. First contact expected before noon. Stand to. Crews mounted. Arcs confirmed. Mortar section on standby on frequency four. Out.
gloss OMG — Operational Manoeuvre Group: Soviet forces sent deep, past the front, to break up the defence.
choose One Zero. Wilco, out.
net One One: One One. Wilco, out.
if $bxkia=1
net One Two: One Two. Standing to. Out.
radio Watts, in One Two. He has said as little as that since the Sibbesse road.
else
net One Two: One Two. Standing to, hatches manned, mortar section on four. Out.
end
radio The waiting begins.
wait 1400
stamp 0900
hud 0900
net One One: One One.
radio Nothing else. Hollis is letting you know he is there.
choose One Zero.
wait 1500

stamp 0915
hud 0915
net Two Zero: Hello Zero, this is Two Zero. Contact, wait out.
cam 10,7.2,13
wait 700
net Two Zero: Zero, Two Zero. Contact. Two BRDM, grid five four seven three one two, one thousand, moving west. Engaging. Out.
near togs,periscope,rangecard
net One One: One One. Stand by.
fire s0 at 18,4
burst 18.5,4
wait 500
fire s1 at 18,6.2
burst 18.5,6.2
wait 500
fire s2 at 18,8.4
burst 18.5,8.4
wait 500
fire s3 at 18,10.6
burst 18.5,10.6
radio A flat, heavy thump to the east, and the chatter of coax. Heavier machine-gun fire answers.
wait 1200
net Two Zero: Zero, Two Zero. Two BRDM stopped. Larger element behind. T-80 and BMP, count six plus. Pulling back to bound. Out.

stamp 0925 · Passage of lines
hud 0925
set s0,s1,s2,s3 gun=3.1416
set s1 smoke=1
move s0 6,2.4 -8,3.6 speed=1.6
move s1 6,4.6 -8,5.8 speed=1.6 delay=0.3
move s2 6,9.2 -8,8 speed=1.6 delay=0.6
move s3 6,11.4 -8,10.2 speed=1.6 delay=0.9
radio 2nd Troop’s Challengers come back through your position, passing between the hides at speed. One is trailing smoke from the engine decks.
net Two Zero: One Zero, Two Zero. They’re four minutes behind us. T-80 leading. Good luck. Out.
net Zero: Two Zero, Zero. On the bus, next bound. Out.
gloss Passage of lines — one unit passing back through another’s position. 1st Troop is now the squadron’s front edge.
net One One: One One. Range markers confirmed.
if $posrange=1
radio Your range card from the high seat is taped inside the cupola: field gate six hundred, track junction nine hundred, farm fourteen hundred.
else
gloss Range card — a sketch of known ranges to features in your arc, made in advance so the fire order needs no guesswork.
end
choose One One, right arc. One Two, left arc. I’ll take centre. Engage on my order. Out.

stamp 0930
hud 0930
set t80,bmp1,bmp2,bmp3,bmp4 hidden=0
move t80 12.6,7.0 speed=0.55
radio A whine carries before the dust: a gas turbine. A T-80 crests the rise at fourteen hundred metres. It is on the move and has not seen you.
gloss T-80 — Soviet main battle tank, gas-turbine engine. Engage with FIN.
if $obs>39
radio You had it identified before anyone called it. A fortnight of looking at fields has taught your eyes what belongs in them.
else
radio For a long second you aren’t sure it isn’t one of ours. Then the low turret, the long gun: a T-80.
end
wait 1800
choose Engage. || hint: Wait.
if $choice=1
radio You let it come. Six hundred metres of open field between it and the wood.
wait 1500
choose Engage.
end

choose ic: Fire.

set t80 smoke=1
move t80 12.6,7.0
ic Gunner: Target.
ic Gunner: Target stop.
radio The T-80 brews up. A column of black smoke stands over the rise.
wait 800

move bmp2 15,8.6 speed=0.6
move bmp3 15.4,6.6 speed=0.6

wait 1700

net One One: One Zero, One One. That was close.

move bmp4 15.8,9.8

look: radio Your range card: a sketch of the field from your hide, the farm track at eight hundred, the lone bush at eleven hundred, the rise at fourteen hundred. Hollis paced the first two himself.
use: radio You check the range card against the ground. Eight hundred, the track. Eleven hundred, the bush. Fourteen hundred, the rise. Nothing has moved but the light.
@periscope the periscope
unit: p
icon: 🔭
verb: Look through
look: radio The commander’s periscope, its glass smeared where you keep wiping it with your sleeve.
use: radio Through the periscope: the field, the track, the rise. Nothing. Nothing. Then, very faint, dust above the rise where there was no dust before.
@togs the thermal sight
unit: p
icon: 🌡️
verb: Look through
look: radio TOGS — the Thermal Observation and Gunnery Sight. The gunner’s picture, repeated for you.
use: radio In the thermal picture the field is grey and cold. Beyond the rise, too far for the eye, small white shapes are moving: engines, warm and getting warmer.
use: gloss TOGS sees heat, not light. No Soviet tank of 1990 has anything like it.
@telegraph the Telegraph
kit: yes
icon: 📰
look: radio The Telegraph, four days old by the time it reached you. The deaths column runs to two pages.
use: radio You read the deaths column. You don’t know any of the names. Then you do.
@bv the boiling vessel
unit: p
icon: ☕
verb: Brew up with
look: radio The boiling vessel, the BV, built into the turret: hot water for tea and boil-in-the-bag food without leaving the tank.
use: radio The water takes four minutes. You make three teas and pass two down. Your loader says it is the best tea he has ever had. He says that every time.
use: gloss Brew-up — a brew of tea. Also a tank catching fire, as the T-80 did. Nobody in the turret mentions it.
@cigarette Hollis’s cigarette
unit: a
icon: 🚬
look: radio Hollis in his cupola, cigarette in his hand, looking east at the smoke over the rise. It is the first time you have seen him smoke.
</script>

stamp <b>Wednesday 25 April 1990</b> · 1630<br>Hobart Barracks, Detmold
radio Late afternoon, low sun, long shadows. The troop moves across from the tank park to the workshop bay.
to a 5.6,4.4 p 4.3,4.4 b 3,4.4 speed=1.3 stagger=0.4
cam 5,6,7.5
waitmove a,p,b
radio REME are waiting. They take over the moment the hatches open: track tension, fuel, ammunition, periscopes. Compressors, ratchets, a shout in broad Yorkshire.
near chalkmap,rover,reme
radio In the yard, a Land Rover with “44” on the door, parked at an angle. A captain in a green beret stands by the bonnet, looking down at a chalk drawing on the tarmac at his feet. He sees you coming and doesn’t move. He lets you walk the distance.
cam 7.6,8.4,7
choose act: Salute
radio You halt and salute. Sandhurst-clean, possibly slightly over-keen.
say Capt Holley: Pemberton, is it? | He returns the salute, correctly but unhurried. Jungle-green camouflage, a green Commando beret, about fifty. Nobody explains any of it.
ask Say “Sir”
say Pemberton: Sir.
say Capt Holley: Right. Come round here. Mind the map. | A map drawn in chalk, about three metres square, smudged where he has walked across it. He points with the toe of his boot.
say Capt Holley: You’ve come from Sennelager. Davies has spoken to you.
say Capt Holley: He’s gone ahead. Left me his Rover and the stragglers.
say Capt Holley: We are here. | His boot taps Detmold.
say Capt Holley: Foreign Secretary in Stockholm, agreement within days.
say Capt Holley: You’ll have noticed the squadron’s gone forward in a hurry, while the radio insists otherwise.
say Capt Holley: Between you, me and Hermann, we don’t know. | His boot taps the little chalk figure on the peak.
say Capt Holley: So we go forward. | Not a hard look. Just direct. The first time anyone in uniform has told you the radio is not the whole picture.
say Capt Holley: Third Shock Army opposite this sector.
say Capt Holley: Tanks, motor rifle, the usual. Heavy.
say Capt Holley: They’ve been mobilising for three weeks.
say Capt Holley: Forward elements moved into assembly areas last night. | His boot moves east of the border line, to “3 SA”.
say Capt Holley: Assume they’re coming. Hope they’re not.
say Capt Holley: Regiment’s here.
say Capt Holley: Hildesheim, south of the town, in hides in the Hildesheimer Wald. | His boot moves to Hildesheim, circled, with “SQN” beside it.
say Capt Holley: We’re corps reserve.
say Capt Holley: Covering force goes forward, the forward divisions dig in, and we sit and wait until Corps tells us where to hit.
say Capt Holley: Your mission is to get there.
say Capt Holley: Meet your squadron leader, Major Calloway, by eighteen hundred tomorrow.
say Capt Holley: He’ll have your orders when you arrive. You’re his now.
say Capt Holley: Mortar section will catch up with you on the road.
say Capt Holley: Sergeant Coates and his lads.
say Capt Holley: They’ll fall in behind your three tanks.
say Capt Holley: Worth a brew when you meet him. | He says this warmly. Coates is someone he knows and likes.
say Capt Holley: Route is the B1.
say Capt Holley: Call it sixty miles.
say Capt Holley: Should take you the rest of today and part of tomorrow, depending on traffic. | His boot traces the dotted route.
say Capt Holley: You will see a lot of military traffic going east.
say Capt Holley: Some of it British. Most of it German.
say Capt Holley: You will also see civilians going west.
say Capt Holley: Don’t get tangled in either.
say Capt Holley: Stay on the road, keep your spacing, don’t dawdle.
say Capt Holley: Hermann’s behind you once you’re out of town.
say Capt Holley: Keep the Teutoburger Wald on your right as far as Horn.
say Capt Holley: If the hills are on your left, you’ve gone wrong. | His boot finds the little stick figure with its sword raised. He drew it himself. A slight smile, the first.
say Capt Holley: Comms: regimental net, frequency one, through the rebro.
say Capt Holley: You’ll lose it in the valleys.
say Capt Holley: You’re Bravo One Zero on that net. Your OC’s Bravo Zero Alpha.
say Capt Holley: Sunray on that net is the Colonel.
say Capt Holley: Change to the squadron net when you reach them.
say Capt Holley: Break radio silence if you have a contact or a casualty.
say Capt Holley: Otherwise nothing.
say Capt Holley: On contact: report and break.
say Capt Holley: Do not engage unless you have to.
say Capt Holley: You are not the cavalry of song. Clear? | The paternal note surfaces for the first time.
ask Say “Sir”
say Pemberton: Sir.
say Capt Holley: Tanks are being topped up here.
say Capt Holley: Fuel for the move and combat load.
say Capt Holley: Rations and water for seventy-two hours.
say Capt Holley: Your sergeant should check stowage before you move.
say Capt Holley: Questions?
while $hdone=0
ask {$hq1=0} Ask “Comms?” || {$hq2=0} Ask “Civilians?” || {$hq3=0} Ask “The Bundeswehr?” || {$hq4=0} Ask “Trouble on the route?” || {$hq5=0} Ask “Air?” || {$hasked=0} Say “No questions, sir” || {$hasked>0} Say nothing
if $choice=0
say Pemberton: What if comms go down?
say Capt Holley: Make for the RV.
say Capt Holley: Use ground signals if you have to — orange smoke for friendly, black for not.
say Capt Holley: Major Calloway knows you’re coming.
var hq1=1
end
if $choice=1
say Pemberton: What about the civilians?
say Capt Holley: If a German Polizei vehicle wants you to stop, stop.
say Capt Holley: Otherwise, drive on.
say Capt Holley: If you think you’re seeing a threat, identify first.
say Capt Holley: We are not in the business of shooting refugees, and you do not want to be the officer who finds out he was. | He looks at you more directly than he has so far.
var hq2=1
end
if $choice=2
say Pemberton: What’s the situation with the Bundeswehr?
say Capt Holley: They’re moving in parallel.
say Capt Holley: You’ll see their kit on the autobahn.
say Capt Holley: Stay out of each other’s way.
say Capt Holley: Their liaison is at Calloway’s harbour if you need anything.
var hq3=1
end
if $choice=3
say Pemberton: Are we expecting trouble on the route?
say Capt Holley: Spetsnaz are reported to be operating ahead of any crossing.
say Capt Holley: We’ve had nothing solid in this sector.
say Capt Holley: But you’ll want your hatches manned and your commanders alert.
say Capt Holley: Use cover where the road allows. | A brief pause first.
say Capt Holley: When you site your OPs forward, put them where you’d walk if you were them.
say Capt Holley: The other side doesn’t always think like a textbook. | Low, almost an aside, looking down at the map.
say Capt Holley: You’ll work it out.
var hq4=1
end
if $choice=4
say Pemberton: What about air?
say Capt Holley: RAF is up. The Soviets aren’t, yet.
say Capt Holley: If you see a low-flying aircraft, identify before reacting.
say Capt Holley: The Bundeswehr is moving Alpha Jets around at low level.
say Capt Holley: Looks aggressive, isn’t.
var hq5=1
end
if $choice=5
say Pemberton: Sir, no questions.
say Capt Holley: Good lad. | A small nod.
var hdone=1
end
if $choice=6
var hdone=1
end
if $hdone=0
var hasked+=1
say Capt Holley: Any more questions?
end
end
if $hasked>0
say Capt Holley: Good.
end
say Capt Holley: Right. On the bus, then. The road’s not getting any shorter.
say Capt Holley: You’ll do well. | Said evenly, looking at you directly. Then he turns slightly towards the map, letting you go.
endtalk
radio You salute. He returns it, more economically this time. As you walk back to the bay, a REME staff sergeant comes over to him with a clipboard and they begin a different conversation. Your briefing was one of many.
hear Capt Holley: …keep an eye on him.
radio If you look back, Holley is alone with his chalk map. The wind is already moving the dust across the dotted route.
radio BBC World Service: talks in Stockholm resuming, sterling firm.
title
replay Play again

at: 8.2,9.2
icon: 🗺️
look: radio A map in chalk on the tarmac: Detmold marked “we are here”; a little peak with a stick figure on top, sword raised; the B1 east under a wavy line for the Teutoburger Wald; Hameln on the Weser; Hildesheim circled, “SQN”; a hard line for the border and “3 SA” beyond it. It has been redrawn at least once today.
@rover the Land Rover
unit: rover
icon: 🚙
look: radio A Land Rover 110 in green-and-black, whip aerial up, “44” stencilled on the door, parked at an angle. A watercolour box is wedged behind the passenger seat, half under a map case.
@reme the REME crews
at: 4.3,4.9
icon: 🔧
look: radio The REME fitters have your tanks before your crews are out of them: track tension, fuel caps, ammunition bins, periscope glass. Nobody asks your permission. Nobody needs to.
</script>
<script type="text/plain" class="scene" data-name="lightgun">title: Off the Bus — Light Gun fire mission
hud: 1015 | 25 April 1990
endcard: Off the Bus | A Light Gun fire mission
net: Battery net | Four Three is the FOO · you are Four Zero | 40
maplabel: Isometric view of a Light Gun position on Salisbury Plain: six guns, the command post, the target ridge to the north-east
camera: 5.2,6.6,6.2
callsigns: Four Three=43
crew: Gun 1=1, Gun 2=2, Gun 3=3, Gun 4=4, Gun 5=5, Gun 6=6
---map
{"bg": "#9fb56a", "ground": {"x": [-12, 34], "y": [-14, 28], "c": ["#9fb56a", "#a6bb70"], "rects": [{"x": [18, 34], "y": [-14, 28], "c": ["#93a964", "#99ae69"]}, {"x": [-12, 34], "y": [13, 13], "c": ["#e6e1cf", "#ebe6d5"]}, {"x": [4, 4], "y": [13, 28], "c": ["#e6e1cf", "#ebe6d5"]}]}, "trees": [{"x": [-1, 3.5], "y": [1, 12], "n": 70, "seed": 5}, {"x": [19, 24], "y": [-2, 4], "n": 14, "seed": 9, "s": [0.6, 1.1]}], "keep": [[3.6, 7.2, 0.9]], "marks": [{"type": "flag", "x": 20, "y": 4.8}], "units": [{"id": "g1", "type": "lightgun", "x": 6.1, "y": 3.35, "label": "1", "gun": -0.072, "elev": 0.25}, {"id": "g2", "type": "lightgun", "x": 5.6, "y": 4.9, "label": "2", "gun": -0.163, "elev": 0.25}, {"id": "g3", "type": "lightgun", "x": 6.1, "y": 6.45, "label": "3", "gun": -0.261, "elev": 0.25}, {"id": "g4", "type": "lightgun", "x": 5.6, "y": 8.0, "label": "4", "gun": -0.34, "elev": 0.25}, {"id": "g5", "type": "lightgun", "x": 6.1, "y": 9.55, "label": "5", "gun": -0.433, "elev": 0.25}, {"id": "g6", "type": "lightgun", "x": 5.6, "y": 11.100000000000001, "label": "6", "gun": -0.497, "elev": 0.25}, {"id": "cp", "type": "cp", "x": 3.6, "y": 7.2, "label": "CP", "me": 1}]}
---script
stamp <b>Wednesday 25 April 1990</b> · 1015<br>Salisbury Plain Training Area
radio A Light Gun battery in action on the Plain: six 105mm guns, one command post. You are the Gun Position Officer. The FOO is up on the ridge with the infantry, watching the target area.
near board,brew,tannoy
wait 900
hear Gun 3, layer: Brew’s stewed.
hear Gun 3, Bombardier: It’s always stewed. It’s the Plain. Drink it.
hear Gun 5, loader: How long have we been sat here?
hear Gun 5, No. 1: Two hours. And you’ll sit two more if they want you to.
gloss Bombardier — the Royal Artillery’s corporal. The gun’s No. 1, its detachment commander, is usually a sergeant.
wait 600
net Four Three: Four Zero, Four Three. Fire mission. Over.
gloss Four Three — the Forward Observation Officer’s callsign. Four Zero — your command post. Fire mission — the call for fire.
choose Four Three, Four Zero. Send, over.
net Four Three: Grid zero nine seven four five two. Direction four eight zero zero. Infantry in the open. Adjust fire. Over.
gloss Grid — the target’s map reference. Direction — the FOO’s bearing to the target, in mils (6,400 to the circle). Adjust fire — range one gun onto the target before the battery fires.
choose Grid zero nine seven four five two. Direction four eight zero zero. Infantry in the open. Adjust fire. Out.
near board,face,tannoy
radio The command post’s computer, FACE, works out the data for the guns: bearing one six four zero, elevation three two zero, charge four.
gloss FACE — Field Artillery Computer Equipment.
choose ic: Fire mission battery!
ic Gun 3: Number three!
choose ic: HE, charge four, fuze quick. Bearing one six four zero. Elevation three two zero.
set g1,g2,g3,g4,g5,g6 telev=0.55
hear Gun 2, loader: Here we go.
hear Gun 2, No. 1: Ear defenders in. Now, not after.
gloss HE — high explosive. Charge four — the propellant; more charge, more range. Fuze quick — bursts on impact.
choose ic: Number three, one round, ranging. At my command.
hear Gun 3, No. 1: HE, charge four, fuze quick!
hear Gun 3, No. 5: Charge four!
hear Gun 3, No. 6: Fuze quick!
hear Gun 3, No. 1: Bearing one six four zero!
hear Gun 3, No. 3, layer: One six four zero… set!
hear Gun 3, No. 1: Elevation three two zero!
hear Gun 3, No. 3, layer: Three two zero… set!
hear Gun 3, No. 1: Load!
hear Gun 3, No. 4: Rammed!
hear Gun 3, No. 2: Breech closed!
gloss The detachment: No. 1 commands; No. 2 works the breech and fires; No. 3 lays the gun; No. 4 loads and rams; Nos. 5 and 6 prepare charges and fuzes. These calls are provisional until checked against a written drill.
ic Gun 3: Number three ready!
choose ic: Fire!
hear Gun 3, No. 1: Fire!
cam 12,4.5,17
fire g3 at 21.2,3.6
choose Four Three, Four Zero. Shot, over.
gloss Shot — the round is on its way. “Splash” follows five seconds before it lands, so the FOO knows which burst to watch.
net Four Three: Shot, out.
choose Splash, over.
wait 2600
burst 21.2,3.6
net Four Three: Splash, out.
wait 500
hear Gun 3, layer: Bet it’s short.
hear Gun 3, Bombardier: If it’s short it’s the charge, not you. Keep your eye on the sight.
wait 700
net Four Three: Four Zero, Four Three. Left two zero, add two hundred. Over.
gloss Corrections come line first, then range: twenty metres left, two hundred further.
choose Left two zero, add two hundred. Out.
radio FACE again: bearing one six three six, elevation three three four.
choose ic: Number three, bearing one six three six, elevation three three four. One round. Fire!
set g1,g2,g3,g4,g5,g6 telev=0.62
hear Gun 3, No. 1: Bearing one six three six!
hear Gun 3, No. 3, layer: One six three six… set!
hear Gun 3, No. 1: Elevation three three four!
hear Gun 3, No. 3, layer: Three three four… set!
hear Gun 3, No. 1: Load!
hear Gun 3, No. 4: Rammed!
hear Gun 3, No. 2: Breech closed!
hear Gun 3, No. 1: Fire!
fire g3 at 22,2.2
choose Four Three, Four Zero. Shot, over.
net Four Three: Shot, out.
wait 2600
burst 22,2.2
net Four Three: Four Zero, Four Three. Target. Fire for effect, three rounds. Over.
gloss Target — the ranging round is on. Fire for effect — now the whole battery fires.
hear Gun 3, layer: Told you it was the charge.
hear Gun 4, loader: Three rounds. Lovely. Arms are going to drop off.
choose Fire for effect, three rounds. Out.
choose ic: Battery, three rounds, fire for effect. At my command.
hear Gun 3, No. 1: Three rounds, fire for effect! Load!
hear Gun 3, No. 4: Rammed!
hear Gun 3, No. 2: Breech closed!
ic Gun 1: Number one ready!
ic Gun 2: Number two ready!
ic Gun 4: Number four ready!
ic Gun 5: Number five ready!
ic Gun 6: Number six ready!
choose ic: Fire!
hear Gun 3, No. 1: Fire!
fire g1,g2,g3,g4,g5,g6 at 22,2.2
hear Gun 3, No. 1: Load!
hear Gun 3, No. 4: Rammed!
hear Gun 3, No. 1: Fire!
fire g1,g2,g3,g4,g5,g6 at 22,2.2
hear Gun 3, No. 1: Load!
hear Gun 3, No. 4: Rammed!
hear Gun 3, No. 1: Fire!
fire g1,g2,g3,g4,g5,g6 at 22,2.2
choose Four Three, Four Zero. Shot, over.
net Four Three: Shot, out.
wait 1400
burst 21.6,1.8
burst 22.4,2.6
burst 22,2
wait 900
burst 21.4,2.4
burst 22.6,1.6
burst 21.9,2.9
wait 900
burst 22.2,1.4
burst 21.7,2.2
burst 22.5,2.5
ic Gun 3: Number three, rounds complete!
near cases,brew,board
hear Gun 6, loader: Mind the cases, they’re hot.
hear Gun 1, No. 1: Ears ringing? Good. Means you were here.
wait 1500
net Four Three: Four Zero, Four Three. End of mission. Target neutralised. Out.
gloss End of mission — the guns stand down from this target and wait for the next.
choose ic: Stop. End of mission.
set g1,g2,g3,g4,g5,g6 telev=0.25
cam 5.2,6.6,6.2
wait 800
hear Gun 3, Bombardier: Right. Clean the breech, stack the cases.
hear Gun 3, layer: Then a brew?
hear Gun 3, Bombardier: Then a stewed brew.
wait 900
stamp Six guns, ten rounds, and nobody on the gun line saw where any of them landed.
wait 1400
title
replay Play again
---props
@board the plotting board
unit: cp
icon: 🗺️
look: radio The artillery board: a gridded sheet under perspex, pins for the guns, a pencilled cross for the target. The arc of fire is drawn in red chinagraph.

unit: cp
icon: 🖥️
look: radio FACE: a grey military computer in a steel case, a keypad and a strip of red digits. It does in seconds what used to take a technical assistant and a slide rule a minute.
@tannoy the tannoy handset
unit: cp
icon: 📢
verb: Press the switch on
look: radio The tannoy handset, a black microphone on a curly lead. Its loudspeakers stand on poles along the gun line.
use: radio You press the switch. Your breath comes back to you from six loudspeakers along the gun line, slightly delayed. You let go.
@brew the brew
kit: yes
icon: ☕
verb: Drink
look: radio A mug of tea gone the colour of the Plain.
use: radio Stewed. Sweet. Hot. Exactly as described.
@cases the cartridge cases
unit: g3
icon: 🔩
look: radio Brass cartridge cases stacked by each gun, still smoking faintly in the cold air.
</script>

---script
str bx=Baxter
if $bxkia=1
str bx=Watts
end
stamp <b>Monday 7 May 1990</b> · 2300<br>Night patrol
radio Calloway wants the lanes south of the wood watched tonight. Since the ambush: two vehicles, weapons loaded, never the same route twice. Hollis drives you. {$bx} has the second Land Rover.
choose hint: Go yourself || hint: Send Hollis
if $choice=1
radio Hollis takes the patrol. They are back at three. Nothing to report but deer.
else
near notebook
move lr1 6,8.5 speed=0.5
move lr2 4.4,8.5 speed=0.5 delay=0.6
cam 6,8,6.5
radio No lights. The lane is a paler strip between black hedges. An owl calls from the trees, the long wavering hoot of a tawny owl.
waitmove lr1,lr2
radio Something barks in the dark beside the lane, hoarse and loud. {$bx}’s Land Rover brakes hard.
net One Two: One Two. Contact left! … Wait.
choose One Two, One Zero. Roe deer. Out. || hint: Say nothing
if $choice=0
net One Two: One Two. Roger. … Sorry.
xp obs 5 Knew the deer
else
radio A long minute. Then a white rump bounding away across the field, and {$bx}’s voice, embarrassed, on the net: “One Two. Deer. Out.”
end
gloss Roe deer bark when alarmed: a hoarse cough in the dark that has startled a great many sentries.
move lr1 14,8.5 speed=0.5
move lr2 12.4,8.5 speed=0.5 delay=0.6
waitmove lr1,lr2
set oldman hidden=0
move oldman 15.4,8.6 speed=0.3
radio A torch on the lane ahead, swinging. Someone is walking towards you.
choose act: Stop and challenge || act: Drive up and look
if $choice=0
say Pemberton: Halt! Wer da?
say The farmer: Nur der Bauer! Nur der Bauer! | “Only the farmer! Only the farmer!”
say The farmer: Meine Kuh kalbt. | “My cow is calving.” He points the torch at the farmhouse.
net One Two: One Two. Weapon made safe.
xp obs 5 Challenged correctly
else
radio You drive up on him without lights. He jumps into the ditch. In the second Land Rover, {$bx} has his rifle up before Hollis shouts.
say The farmer: Mein Gott! Ich bin der Bauer! | “My God! I’m the farmer!”
end
endtalk
radio The old man walks back to his barn. One light in the farmhouse, until long after you have gone.
move lr1 18,8.5 18,13 speed=0.5
move lr2 18,8.5 18,11.4 speed=0.5 delay=1
cam 19,12,6.5
waitmove lr1,lr2
radio The crossroads two kilometres south of the Sibbesse road. Hollis switches off and sits. “Smell that, sir? Somebody’s been smoking here.”
choose act: Search with the torch || hint: Drive on
if $choice=0
near tyres,butts,notebook
tutorial Look around: tap what you see, and note anything worth noting
choose act: Finish the search
tutorial
else
radio You drive on. Hollis says nothing, and lights a cigarette of his own.
end
if $foundvan=1
choose Zero, One Zero. Abandoned van in the trees, south of the Sibbesse road. Hannover plates. Believed connected to the ambush. Over.
net Zero: One Zero, Zero. Roger. Stay with it. Feldjäger on their way. Out.
radio The Feldjäger come at one in the morning, in a Unimog, and take the van apart by torchlight. They don’t say what they find.
else
radio Nothing else on the lanes. Back to the hides by three.
end
end

stamp <b>Wednesday 2 May 1990</b> · 1430<br>Fire positions
radio From this morning’s O Group: recce fire positions covering the way out of the wood to the north-east, where the squadron would fight if Corps commits it. Rain on the windscreen.
choose hint: Go yourself || hint: Send Hollis
if $choice=1
radio Hollis comes back soaked, with a fire position at the hedge corner and a range card to every landmark from the church tower in.
var posrange=1
var posgood=1
else
near notebook
move lr 5,8.5 speed=0.6
waitmove lr
cam 7,8,7
radio The wood edge. Beyond it, open fields under rain, a farm, a church tower on the skyline. You need a place a tank can sit hull-down and see all of it.
tutorial Tap a fire position, or its label
tap pos1=The knoll || pos2=The hedge corner || pos3=The bank by the track
tutorial
var pick=$choice
if $pick=0
say Sgt Hollis: You’ll be skylined there, sir. | The knoll stands up against the sky. A tank on it is a target for anyone east.
end
if $pick=2
say Sgt Hollis: Can’t see past the hedge from there, sir. | The bank hides you, and hides everything else too.
end
if $pick=1
say Sgt Hollis: Hedge corner. That’s the one, sir. | Hull-down behind the bank, turret clear of the hedge, the whole field in front.
var posgood=1
xp obs 5 Chose a fire position
else
ask Take the hedge corner || Keep your choice
if $choice=0
say Pemberton: Hedge corner, then.
var posgood=1
else
say Pemberton: We’ll keep it.
say Sgt Hollis: Sir. | He writes it down, carefully, so that it is clear whose choice it was.
end
end
endtalk
radio At the wood edge, a hunter’s high seat looks out over the whole of the ground.
choose act: Climb the high seat || hint: Stay below
if $choice=0
cam 14,10,8
radio From the top, the fields are a map. You fill in the range card: church tower 2100, farm 1400, track junction 900, field gate 600.
var posrange=1
xp obs 10 Range card
gloss Range card: a sketch of the arc in front of a fire position, with the ranges to landmarks, so the crew can engage without working it out under fire.
stamp From the high seat
near merc,pickers,stall,deer,notebook
tutorial Look around: tap what you see, and note anything worth noting
choose act: Climb down
tutorial
else
radio You leave the high seat alone. Hollis paces the ranges instead, counting under his breath in the rain.
end
if $sawmerc=1
choose Zero, One Zero. Grey Mercedes, H plates, two men with binoculars, farm track north-east of the wood. Over. || hint: Leave it for the O Group
if $choice=0
net Zero: One Zero, Zero. Roger. Probably the liaison mission again. Noted. Out.
radio Probably.
end
end
choose Zero, One Zero. Fire positions recced. Range card done. Returning. Over.
net Zero: One Zero, Zero. Roger. Out.
end

---script
stamp <b>Wednesday 25 April 1990</b> · 1800<br>The road east: Detmold to the Hildesheimer Wald
radio Out through the Hobart gate, the troop turns east for Horn and the B1. Sixty miles to the squadron.
near hermann,notebook
radio Behind you, once you’re out of town, Hermann on his hill, small against the last of the light. The Teutoburger Wald runs along on your right.
wait 3000
to a 7,7.5 p 5.7,7.5 b 4.4,7.5 speed=0.8 stagger=0.3
cam 2,7.5,7
net Zero: Hello all stations, this is Zero. Radio check. Over.
choose Bravo One Zero. OK. Over.
net Zero: Zero. All stations OK. Out.
gloss Radio check: every station answers in turn, so control knows who can hear.
waitmove a,p,b
cam 12,8,7
to a 19,7.5 p 17.7,7.5 b 16.4,7.5 speed=0.8 stagger=0.3
hud 1910
radio Past Horn the road drops into a valley. The net fills with hiss, then nothing. On the next rise it comes back.
waitmove a,p,b
teleport a 26,7.5 p 24.7,7.5 b 23.4,7.5
night 0.25
hud 1940
cam 31,5,7.5
move c0 -14,1.5 speed=1.1
move c1 -14,1.5 speed=1 delay=2
move c2 -14,1.5 speed=1.1 delay=4
move c3 -14,1.5 speed=1 delay=6
radio The B1 is a main supply route now, and the eastbound side is yours. Across the fields, on the parallel road, headlights move west in a steady line.
gloss Main supply route: a road kept clear for military traffic.
near traffic,notebook
to a 40,7.5 p 38.7,7.5 b 37.4,7.5 speed=0.6 stagger=0.3
wait 2200
radio In a lay-by outside Blomberg, two German anti-aircraft tanks with their engines running. On each turret a radar dish turns, round and round.
gloss Flakpanzer Gepard: the Bundeswehr’s anti-aircraft tank. Twin 35mm cannon, with its own radar.
near gepard,traffic,notebook
waitmove a,p,b
net Bravo One Two: Radars are turning. Who’re they looking for?
net Bravo One One: Anyone.
wait 1200
teleport a 46,7.5 p 44.7,7.5 b 43.4,7.5
night 0.6
hud 2130
cam 53,10,7
radio Dark by twenty-one hundred. The route card says a lay-up field west of Hameln, and there it is: a farm gate standing open.
move a 50.5,7.5 52,10.4 55.5,10.4 speed=0.6
move p 50.5,7.5 51.5,11.6 54.5,11.6 speed=0.6 delay=1.2
move b 50.5,7.5 51,12.8 53.5,12.8 speed=0.6 delay=2.4
near notebook
waitmove a,p,b
set a,p,b open=0
night 0.7
hud 2200
set q1,q2,q3 hidden=0
radio Towards twenty-two hundred, three FV432s come up the road behind you with their lights on and pull into the field: Sergeant Coates’s mortar section. From here they follow the troop.
gloss FV432: the Army’s tracked armoured carrier. These carry 81mm mortars.
# Placeholder: meeting Sgt Coates. Waits for his character file.
move q1 50.5,7.5 50.5,13.6 52.5,13.6 speed=0.6
move q2 50.5,7.5 50.5,13.6 51.3,13.6 speed=0.6 delay=1
move q3 50.5,7.5 50.5,12.4 speed=0.6 delay=2
near mortars,notebook
waitmove q1,q2,q3
radio Stag rota on the turret, sleeping bags on the engine decks. Nobody sleeps much the first night out.
wait 1400
night 0.15
hud 0545 | 26 April 1990
stamp <b>Thursday 26 April 1990</b> · 0545<br>Hameln
teleport a 72.5,7.5 p 71.2,7.5 b 69.9,7.5 q1 68.6,7.5 q2 67.4,7.5 q3 66.2,7.5
set a,p,b open=1
cam 79,10,7
radio The column comes down into Hameln in the grey light, and out over the Weser.
to a 88,7.5 p 86.7,7.5 b 85.4,7.5 q1 84.1,7.5 q2 82.9,7.5 q3 81.7,7.5 speed=0.5 stagger=0.2
wait 2400
night 0
radio Below the bridge, the river is full of lorries. A line of M2 rigs, side floats folded out, bolted together by their ramps across the water.
gloss M2 rigs: bridging lorries that swim, and join up into a bridge or a ferry. 28 Amphibious Engineer Regiment, the Rubber Ducks, are based in Hameln.
near rigs,notebook
waitmove a,p,b,q1,q2,q3
radio The bridge you are crossing is still there.
wait 1200
teleport a 96,7.5 p 94.7,7.5 b 93.4,7.5 q1 92.1,7.5 q2 90.9,7.5 q3 89.7,7.5
hud 1030
cam 105,6,7
move e1 106,7.5 106,-4 speed=0.7
move e2 106,7.5 106,-4 speed=0.7 delay=3
move e3 106,7.5 106,-4 speed=0.7 delay=6
to a 103.4,7.5 p 102.1,7.5 b 100.8,7.5 q1 99.5,7.5 q2 98.3,7.5 q3 97.1,7.5 speed=0.55 stagger=0.2
radio At a junction outside Elze, a green-and-white Polizei car is pulled across the side road. A policeman is turning every civilian car off the B1.
near polizei,notebook
waitmove a,p,b
radio He looks up at the tanks and holds up a hand.
choose Bravo One One, Bravo One Two, Bravo One Zero. Halt. Out. || hint: Drive on
if $choice=1
net Bravo One One: One One. Polizei wants us stopped, One Zero.
choose Bravo One One, Bravo One Two, Bravo One Zero. Halt. Out.
end
set f1,f2 hidden=0
move f1 92,6.7 speed=0.8
move f2 92,6.7 speed=0.8 delay=1.4
cam 108,6,6.5
radio Two six-wheeled armoured cars come the other way, boat-nosed, a tall aerial on each. Every hatch shut; nobody visible.
gloss Spürpanzer Fuchs: a six-wheeled armoured car that samples the air and the ground for chemical agents.
near fuchs,polizei,notebook
waitmove f1,f2
set f1,f2 hidden=1
radio The policeman waves you on.
wait 1200
teleport a 121,7.5 p 119.7,7.5 b 118.4,7.5 q1 117.1,7.5 q2 115.9,7.5 q3 114.7,7.5
hud 1600
cam 128,9,7
radio BBC World Service: “The Foreign Secretary, Mr Heseltine, has arrived in Stockholm this morning for further talks with the Soviet delegation…”
to a 130,7.5 p 128.7,7.5 b 127.4,7.5 q1 126.1,7.5 q2 124.9,7.5 q3 123.7,7.5 speed=0.6 stagger=0.2
wait 1800
radio Outside Hildesheim a soldier on a motorbike waits where a forest track goes in under the trees. He waves the troop in and leads off.
waitmove a,p,b
move guide 132.5,7.5 132.5,13 speed=0.5
cam 133,14,6.5
move a 132.5,7.5 132.5,14.2 131,15.2 speed=0.5
move p 132.5,7.5 132.5,14.2 130.5,16.5 speed=0.5 delay=1.6
move b 132.5,7.5 132.5,14.2 131.6,17.8 speed=0.5 delay=3.2
waitmove a,p,b
radio Under the trees: tanks dispersed under cam nets, REME on somebody else’s sprocket, the air smelling of diesel and damp grass.
radio A major is finishing a conversation with the quartermaster. He sees you, raises a hand, finishes it, and walks over.
move calloway 132,16 speed=0.4
near harbour,notebook
waitmove calloway
say Maj Calloway: Pemberton. Good. | He shakes your hand, brisk.
say Maj Calloway: Get your tanks dispersed, then come and find me at the command post.
say Maj Calloway: There’s a tour going on in an hour.
say Maj Calloway: You’ll meet the rest of the squadron then.
say Maj Calloway: Anything urgent first?
ask Say “No, sir” || Ask “Where do you want us?”
if $choice=0
say Pemberton: No, sir.
say Maj Calloway: Right. Cam them properly, the air picture isn’t what it was.
else
say Pemberton: Where do you want us, sir?
say Maj Calloway: In the trees behind the command post.
say Maj Calloway: Under the canopy, not on the edge.
say Maj Calloway: And cam them properly, the air picture isn’t what it was.
end
say Maj Calloway: Crusher will show you where. | Captain Davies, the squadron 2IC, by his squadron nickname.
say Maj Calloway: Welcome to the squadron.
endtalk
radio Fifteen seconds, and he is walking back to the command post. The full briefing comes at the tour.
title
replay Play again
---props
@notebook your notebook
kit: yes
icon: 📓
verb: Write in
look: radio Your notebook. Holley’s route in your writing: “B1. Horn, Blomberg, Barntrup, Hameln (Weser), Elze, Hildesheim. Maj Calloway by 1800 tomorrow.”
use: radio You write the time and the place, and tick off the town.
@hermann the monument
unit: hermann
icon: 🗿
look: radio Hermann, on his hill behind you, getting smaller.
@traffic the traffic across the fields
at: 22,1.5
icon: 🚗
look: radio Cars on the parallel road, all heading west: estates with roof boxes, a Trabant with a mattress tied on, a Mercedes towing a caravan. Driving carefully. Windows up.
@gepard the anti-aircraft tanks
unit: g1
icon: 📡
look: radio A tank chassis with a turret of guns and dishes: two long cannon either side, a radar turning on top and another on the front. The crews are sitting on the hulls, smoking, watching the sky.
@mortars the mortar carriers
unit: q1
icon: 🛡️
look: radio Three FV432s, box-shaped, a big round hatch in each roof. The crews are already putting a brew on.
@rigs the bridging rigs
unit: m2
icon: 🌉
look: radio Each rig is a lorry with a boat for a hull. In the water its side floats fold out, and the next rig is bolted on by its ramps. Engineers in life jackets walk across the joined decks as if they were a road.
@polizei the Polizei
unit: pol
icon: 🚓
look: radio A green-and-white Polizei car across the side road, its blue light turning. A sign: UMLEITUNG, diversion. The cars it turns away are full to the roof.
@fuchs the armoured cars
unit: f1
icon: 🧪
look: radio Six big wheels, a hull shaped like a boat, black-and-white crosses on the sides. Every hatch is shut. Whoever is inside is sealed in.
@harbour the squadron’s hides
at: 138,15
icon: 🌲
look: radio Tanks backed in under the trees, cam nets over them, the nets dressed with cut branches. A REME fitter has a sprocket off a tank that isn’t yours.
</script>

def crashmove
if $crash<40
choose One One, One Two, One Zero. Stand to. Out.
net One One: One One. Wilco, out.
net One Two: One Two. Wilco… wait out.
choose One One, One Two, One Zero. Move now to battle positions. Out.
move a 6.3,3.6 speed=0.8
move p 6.4,7 speed=0.8
move b 6.3,10.4 speed=0.8 delay=2.2
choose One One, One Two, One Zero. Close down. Out.
set a,p,b open=0
waitmove a,p,b
net One One: One One. In position.
net One Two: One Two. In position.
choose Zero, One Zero. In position. Out.
stamp 1st Troop in position · <b>6 min 40 s</b>
else
if $crash<100
choose One One, One Two, One Zero. Stand to. Battle positions. Out.
to a 6.3,3.6 p 6.4,7 b 6.3,10.4 speed=1.1
set a,p,b open=0
waitmove a,p,b
net One One: One One. In position.
net One Two: One Two. In position.
choose Zero, One Zero. In position. Out.
stamp 1st Troop in position · <b>3 min 50 s</b>
else
choose One One, One Two, One Zero. Stand to. Out.
to a 6.3,3.6 p 6.4,7 b 6.3,10.4 speed=1.7
set a,p,b open=0
waitmove a,p,b
net One One: One One. In position.
net One Two: One Two. In position.
me Zero, One Zero. In position. Out.
stamp 1st Troop in position · <b>1 min 55 s</b>
end
end
enddef

def hollisstandto
radio You hear the troop stand to from your sleeping bag. Hollis has it.
if $crash<40
stamp 1st Troop in position · <b>6 min 40 s</b> (Hollis)
else
if $crash<100
stamp 1st Troop in position · <b>3 min 50 s</b> (Hollis)
else
stamp 1st Troop in position · <b>1 min 55 s</b> (Hollis)
end
end
if $hrun>2
radio Hollis was at stand-to again. He looks exactly the same as always.
else
xp crash 3 Crash move (Hollis)
end
net Zero Alpha: Hello all stations, this is Zero Alpha. Stand down. Out.
enddef

def standdown
net Zero Alpha: Hello all stations, this is Zero Alpha. Stand down. Out.
to a 2.6,3.8 p 2.4,7 b 2.8,10.2 speed=0.9
set a,p,b open=1
enddef

def gasdrill
choose Gas! Gas! Gas!
if $gas<40
radio Respirators on. You count. Seven. Eight. Nine.
net One One: One One. Respirators on.
net One Two: One Two… respirators on.
radio Eleven seconds for One Two. The standard is nine.
choose One One, One Two, One Zero. Close down. NBC pack on. Out.
set a,p,b open=0
net One One: One One. Closed down.
net One Two: One Two. Closed down.
else
radio Eight seconds. Seven for One Two, who has been practising in his sleep.
net One One: One One. Respirators on. Closed down.
net One Two: One Two. Respirators on. Closed down.
end
choose All clear. Unmask. Out.
set a,p,b open=1
enddef

def gundrill
radio Drill rounds only. A tin can on a fence post at eight hundred metres for the gunners to lay on.
if $gun<40
choose ic: Action!
ic Gunner: Gunner ready.
ic Loader: Loaded.
choose ic: FIN, tank, on.
wait 1300
ic Gunner: On.
choose ic: Fire.
ic Gunner: Lasing… firing now.
radio Click. The firing circuit closes on an empty breech.
ic Gunner: Target.
choose ic: Target stop.
else
if $gun<100
choose ic: FIN, tank, on.
ic Gunner: On.
ic Loader: Loaded.
choose ic: Fire.
ic Gunner: Lasing… firing now. Target.
ic Gunner: Target stop.
else
choose ic: FIN, tank, on.
ic Gunner: On.
ic Loader: Loaded.
icme Fire.
ic Gunner: Lasing… firing now. Target. Target stop.
end
end
enddef

def contactdrill
net Zero Alpha: One Zero, Zero Alpha. Exercise. Contact, two tanks, the rapeseed, eight hundred, moving north. Out.
if $contact<40
choose One One, One Two, One Zero. Halt. Out.
choose Zero, One Zero. Contact, wait out.
choose One One, One Two, One Zero. Fire positions. Out.
to a 6.3,3.6 p 6.4,7 b 6.3,10.4 speed=1
waitmove a,p,b
choose Zero, One Zero. Contact. Two tanks, rapeseed, eight hundred, moving north. Engaging. Over.
net Zero Alpha: Zero Alpha. Exercise ends. Slow, One Zero. Again tomorrow. Out.
else
choose Zero, One Zero. Contact, wait out.
to a 6.3,3.6 p 6.4,7 b 6.3,10.4 speed=1.4
waitmove a,p,b
me Zero, One Zero. Contact. Two tanks, rapeseed, eight hundred, moving north. Engaging. Over.
net Zero Alpha: Zero Alpha. Exercise ends. Better. Out.
end
to a 2.6,3.8 p 2.4,7 b 2.8,10.2 speed=0.9
enddef

def brew
radio Hollis comes over with two mugs.
if $brew=0
say Sgt Hollis: Brew, sir. Stewed, but it’s wet.
ask Say “Thank you, Sergeant” || Ask “The net?”
if $choice=0
say Pemberton: Thank you, Sergeant.
end
if $choice=1
say Pemberton: What’s the word on the net?
say Sgt Hollis: Same as yesterday, sir. Nothing’s happening, very loudly.
end
end
if $brew=1
say Sgt Hollis: One Two’s been writing letters, sir. Four of them.
say Sgt Hollis: His mum, his nan, two girls.
ask Ask “Two girls?” || Say “Good for him”
if $choice=0
say Pemberton: Two girls?
say Sgt Hollis: He’ll find out, sir. They always do.
end
if $choice=1
say Pemberton: Good for him.
end
end
if $brew=2
say Cpl Baxter: Morning, sir! Did you hear the BFBS request show?
say Cpl Baxter: Somebody asked for Fools Gold for the whole regiment.
ask Say “I did” || Ask “Who asked?”
if $choice=0
say Pemberton: I did.
end
if $choice=1
say Pemberton: Who asked for it?
say Cpl Baxter: Wasn’t me, sir. | It was him.
end
end
if $brew=3
say Sgt Hollis: Quiet night, sir. Convoys on the far road till two.
say Sgt Hollis: All going east.
ask Say “Going east” || Ask “How many?”
if $choice=0
say Pemberton: All going east.
end
if $choice=1
say Pemberton: How many?
say Sgt Hollis: Stopped counting at forty, sir.
end
end
endtalk
enddef

if $day=4
if $logbridge=1
if $logjunction=1

end
end

end
if $drift=2
radio BBC World Service: “The Stockholm session ended without a published statement. A Foreign Office spokesman said only that discussions are continuing.”

choose Zero, One Zero. Liaison car, two up, one camera, at the field gate, moving north. Over. || hint: Watch it go
