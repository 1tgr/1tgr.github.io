/* ================= the map loop ================= */
let last=performance.now(), shownScene=null;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!core){ requestAnimationFrame(frame); return; }
  core.tick(dt); for(const id in VIS) VIS[id].recoil=Math.max(0,(VIS[id].recoil||0)-dt*2.2);
  const st=ST(), w=st.world, sc=SC();
  if(shownScene!==st.scene){ shownScene=st.scene; cam.fx=w.cam[0]; cam.fy=w.cam[1]; cam.z=w.cam[2]; night=w.night; }
  cam.tfx=w.cam[0]; cam.tfy=w.cam[1]; cam.tz=w.cam[2]; nightT=w.night;
  for(const k of ['fx','fy','z']) cam[k]+=(cam['t'+k]-cam[k])*Math.min(1,dt*2.2);
  night+=(nightT-night)*Math.min(1,dt*1.5);
  resizeIf(); setCam(); if(shake>0){ shake-=dt; ox+=(Math.random()-.5)*6; oy+=(Math.random()-.5)*4; }
  cx.fillStyle=sc.map.bg||'#8a9a5a'; cx.fillRect(0,0,W,H); drawGround();
  for(const m of sc.map.marks||[]) if(m.type==='pad'||m.type==='parapet'||m.type==='chalk') drawMark(m);
  cx.fillStyle='rgba(120,92,52,.55)'; for(const [x,y,a] of w.tracks){ for(const o of [-.11,.11]){ const p=iso(x-Math.sin(a)*o,y+Math.cos(a)*o); cx.beginPath(); cx.ellipse(p[0],p[1],Math.max(1.5,tw*.035),Math.max(1,tw*.02),0,0,7); cx.fill(); } }
  for(const [x,y] of w.gaps){ const p=iso(x,y); cx.fillStyle='rgba(110,84,50,.7)'; cx.beginPath(); cx.ellipse(p[0],p[1],tw*.14,tw*.06,0,0,7); cx.fill(); cx.strokeStyle='#5a4126'; cx.lineWidth=1; for(let i=0;i<3;i++){ cx.beginPath(); cx.moveTo(p[0]-tw*.1+i*tw*.08,p[1]-2); cx.lineTo(p[0]-tw*.06+i*tw*.08,p[1]-tw*.07); cx.stroke(); } }
  const trees=core.treesOf(st.scene).filter((t,i)=>!w.broken.includes(i));
  const items=[...trees.map(t=>({k:t.x+t.y,f:()=>drawTree(t)})),...(sc.map.marks||[]).filter(m=>m.type!=='pad'&&m.type!=='parapet'&&m.type!=='chalk').map(m=>({k:m.x+m.y,f:()=>drawMark(m)})),
    ...w.units.filter(u=>!u.hidden).map(u=>({k:u.x+u.y+.01,f:()=>DRAW[u.type](u)}))];
  items.sort((a,b)=>a.k-b.k).forEach(i=>i.f());
  for(const u of w.units){ if(u.hidden) continue; const p=iso(u.x,u.y);
    if(u.smoke&&Math.random()<dt*7) puff(p[0]+(Math.random()-.5)*6,p[1]-tw*.2,{r:3,grow:tw*.35,life:3,col:'55,50,46',a:.55,vy:-9});
    if(u.blossom&&Math.random()<dt*1.5) puff(p[0]+(Math.random()-.5)*tw,p[1]-tw*.3,{r:1.5,grow:0,life:2.5,col:'245,200,215',a:.9,vy:4}); }
  for(const t of trees) if(t.blossom&&Math.random()<dt*1.5){ const p=iso(t.x+(Math.random()-.5),t.y+(Math.random()-.5)); puff(p[0],p[1]-tw*.3,{r:1.5,grow:0,life:2.5,col:'245,200,215',a:.9,vy:4}); }
  if(tracer){ tracer.t+=dt; const k=Math.min(1,tracer.t/.18), a=tracer.a, b=tracer.b(); cx.strokeStyle=`rgba(255,240,200,${Math.max(0,1-tracer.t*3)})`; cx.lineWidth=2; cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k); cx.stroke(); if(tracer.t>.35) tracer=null; }
  if(missile){ missile.t+=dt; const k=Math.min(1,missile.t/1.6), a=missile.a, b=iso(...missile.to); const x=a[0]+(b[0]-a[0])*k, y=a[1]+(b[1]-a[1])*k-Math.sin(k*Math.PI)*tw*.4;
    puff(x,y,{r:1.5,grow:4,life:1.2,col:'235,235,235',a:.7,vy:0}); cx.fillStyle='#ffd27a'; cx.beginPath(); cx.arc(x,y,2.5,0,7); cx.fill(); if(k>=1) missile=null; }
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.t+=dt; if(p.t>p.life){fx.splice(i,1);continue;} const k=p.t/p.life, r=Math.max(1,p.r+p.grow*k); cx.fillStyle=`rgba(${p.col},${p.a*(1-k)})`; cx.beginPath(); cx.arc(p.x,p.y+p.vy*p.t*3,r,0,7); cx.fill(); }
  if(night>.01){ cx.fillStyle=`rgba(12,22,52,${.62*night})`; cx.fillRect(0,0,W,H); }
  if(canAct()){ const seen={}; for(const p of core.nearProps()){ const u=p.unit&&unitById(p.unit); let pos=p.at||(u&&[u.x,u.y]); if(!pos) continue; const key=pos.map(v=>v.toFixed(1)).join(); const k=seen[key]=(seen[key]||0)+1; pos=[pos[0]+(k-1)*.45,pos[1]-(k-1)*.45]; const [sx,sy]=iso(...pos);
    const pulse=1+Math.sin(now/300)*.12, r=Math.max(9,tw*.14)*pulse; cx.fillStyle='rgba(253,247,228,.92)'; cx.strokeStyle='#e3a33a'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(sx,sy-tw*.55,r,0,7); cx.fill(); cx.stroke(); cx.font=`${Math.round(r*1.1)}px system-ui`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p.icon!=='•'?p.icon:'🔍',sx,sy-tw*.55+1); MARK[p.id]=[sx,sy-tw*.55]; } }
  requestAnimationFrame(frame);
}
const MARK={};
cv.addEventListener('click',e=>{ const rc=cv.getBoundingClientRect(), px=e.clientX-rc.left, py=e.clientY-rc.top;
  if(canAct()){ let best=null,bd=1e9; for(const p of core.nearProps()){ const m=MARK[p.id]; if(!m) continue; const d=Math.hypot(m[0]-px,m[1]-py); if(d<bd){bd=d;best=p;} } if(best&&bd<Math.max(22,tw*.3)){ openPopAt(best,MARK[best.id][0],MARK[best.id][1]-10); return; } }
  if(!tapTargets||!mapPick) return;
  let best=-1,bd=1e9; tapTargets.forEach((list,i)=>{ for(const id of list){ const t=unitById(id)||(SC().map.marks||[]).find(m=>m.id===id); if(!t) continue; const p=iso(t.x,t.y), d=Math.hypot(p[0]-px,p[1]-py); if(d<bd){bd=d;best=i;} } });
  if(best>=0&&bd<tw*1.2) mapPick(best); });
cv.addEventListener('wheel',e=>{ if(zoomWanted&&e.deltaY>0){ e.preventDefault(); zoomWanted(); } },{passive:false});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&zoomWanted){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(pinch&&d<pinch-25) zoomWanted(); pinch=pinch||d; e.preventDefault(); } },{passive:false});
cv.addEventListener('touchend',()=>pinch=null);

/* ================= saving and starting ================= */
const SAVEKEY='offthebus:'+(CAMPAIGN.name||'scene');
let BUILD=0; { const t=Object.values(SCENES).join('\u0001')+'|core-1'; for(let i=0;i<t.length;i++) BUILD=(BUILD*31+t.charCodeAt(i))|0; }
function clearSave(){ try{ localStorage.removeItem(SAVEKEY); }catch(e){} }
async function start(){
  if(QS.has('reset')){ clearSave(); history.replaceState(null,'',location.pathname); }
  core=OTBCore.createCore({scenes:SCENES, campaign:CAMPAIGN, io});
  window.__core=core;
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(SAVEKEY)); }catch(e){}
  const sn=saved&&saved.state?JSON.parse(saved.state):null;
  if(sn&&sn.v===3&&saved.build===BUILD){ redrawPending=true; return core.resume(sn); }
  if(sn&&sn.v===3){ redrawPending=true; return core.restartScene(sn,'<b>The game was updated.</b> Picking up at the start of this scene.'); }
  return core.start();
}
resize(); requestAnimationFrame(frame);
start();
window.__redraw=redrawThread;
})();
</script>
