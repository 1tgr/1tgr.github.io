<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Off the Bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --fg:#000000; --muted:#8a8a8e; --hair:#d8d8dc;
  --in:#e9e9eb; --in-fg:#000; --out:#0a84ff; --out-fg:#fff;
  --chip:#f2f2f7; --chip-fg:#0a84ff; --bar:#f7f7f9;
  --sheet:#ffffff; --scrim:rgba(0,0,0,.35);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#ffffff; --muted:#8d8d93; --hair:#2c2c2e;
    --in:#26252a; --in-fg:#fff; --chip:#1c1c1e; --chip-fg:#4aa3ff; --bar:#121214;
    --sheet:#1c1c1e; --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#ffffff; --muted:#8d8d93; --hair:#2c2c2e;
  --in:#26252a; --in-fg:#fff; --chip:#1c1c1e; --chip-fg:#4aa3ff; --bar:#121214;
  --sheet:#1c1c1e; --scrim:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
@media (max-width:440px){.app{border:0}}

/* map */
.map{position:relative;flex:0 0 40%;min-height:220px;background:#7a9a52;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;top:10px;font-family:"Stardos Stencil","Impact","Arial Narrow",sans-serif;color:#f4efd8;text-shadow:0 1px 0 rgba(0,0,0,.45);line-height:1.05;pointer-events:none}
.hud .t{font-size:30px;letter-spacing:.5px}
.hud .d{font-size:15px;opacity:.92}
.drill{position:absolute;right:10px;top:10px;background:rgba(20,26,14,.62);color:#f4efd8;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.35;pointer-events:none}
.drill b{font-weight:600}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:7px;height:7px;border-radius:2px;background:rgba(244,239,216,.25)}
.pips i.on{background:#f4efd8}

/* contact header */
.head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--hair)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(#9aa6b5,#7b8798);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.head .n{font-size:15px;font-weight:600}
.head .s{font-size:12px;color:var(--muted)}

/* thread */
.thread{flex:1 1 auto;overflow-y:auto;padding:10px 12px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.stamp{align-self:center;text-align:center;color:var(--muted);font-size:11.5px;margin:10px 0 4px;max-width:88%;line-height:1.35}
.stamp b{font-weight:600}
.scroll{align-self:center;text-align:center;color:var(--muted);font-size:12.5px;font-style:italic;margin:6px 0;max-width:86%;line-height:1.4}
.from{font-size:11px;color:var(--muted);margin:7px 0 1px 12px}
.b{max-width:78%;padding:7px 12px;border-radius:18px;font-size:16px;line-height:1.3;word-wrap:break-word}
.b.in{align-self:flex-start;background:var(--in);color:var(--in-fg);border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:#34c759;color:var(--out-fg);border-bottom-right-radius:6px;margin-top:6px}
.b.typing{display:flex;gap:4px;padding:11px 13px}
.b.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.b.typing span:nth-child(2){animation-delay:.2s}.b.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.delivered{align-self:flex-end;font-size:11px;color:var(--muted);margin:2px 4px 2px 0}

/* reply area */
.replies{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:6px 12px 14px}
.chip{appearance:none;border:1px solid var(--hair);background:var(--chip);color:var(--chip-fg);border-radius:18px;padding:9px 14px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.chip:focus-visible{outline:3px solid var(--out);outline-offset:2px}
.chip:active{transform:scale(.98)}
.inputbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 10px}
.inputbar .field{flex:1;border:1px solid var(--hair);border-radius:18px;padding:8px 14px;color:var(--muted);font-size:15px}
.ptt{width:32px;height:32px;border-radius:50%;background:var(--hair);display:grid;place-items:center;color:var(--muted);font-size:15px}

/* training sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);display:none;align-items:flex-end;z-index:5}
.scrim.show{display:flex}
.sheet{background:var(--sheet);width:100%;border-radius:16px 16px 0 0;padding:16px 14px 18px}
.sheet h2{font-size:18px;margin:0 0 2px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.4}
.card{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;margin-top:8px;font:inherit;cursor:pointer}
.card:focus-visible{outline:3px solid var(--out);outline-offset:2px}
.card .ct{font-size:15.5px;font-weight:600}
.card .cs{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.card .lvl{float:right;font-size:12px;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){.b.typing span{animation:none}}

.gloss{align-self:flex-start;max-width:80%;margin:2px 0 4px 42px;font-size:12.5px;line-height:1.35;color:var(--muted);font-style:italic}
.ic{align-self:center;max-width:86%;text-align:center;font-size:13px;color:var(--fg);opacity:.85;margin:6px 0;padding:5px 10px;border:1px dashed var(--hair);border-radius:10px}
.ic b{font-weight:600;color:var(--muted);margin-right:4px}
.b.ic-in{align-self:flex-start;background:var(--in);color:var(--in-fg);border-bottom-left-radius:6px}
.b.ic-out{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px;margin-top:6px}
.chip.hint{color:var(--fg);background:transparent;border-style:dashed}
.avatar.f2f{background:linear-gradient(#c9a77a,#a7835a)}
.thread[hidden]{display:none}
.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,132,255,.92);color:#fff;font-size:13px;padding:7px 12px;border-radius:14px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tip[hidden]{display:none}
.title{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,18,10,.78);opacity:0;transition:opacity 1.2s;pointer-events:none}
.title.show{opacity:1}
.title div{font-family:"Stardos Stencil","Impact","Arial Narrow",sans-serif;color:#f4efd8;text-align:center;line-height:1.1}
.title .big{font-size:44px;letter-spacing:1px}
.title .sub{font-size:15px;margin-top:8px;opacity:.9}
@media (prefers-reduced-motion:reduce){.title{transition:none}}
.ac{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:none;cursor:pointer;font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.ac.show{display:block}
.ac .bal{position:relative;background:#fdf7e4;color:#6b5236;border-radius:34px/44px;padding:26px 24px 30px;min-height:118px;box-shadow:0 3px 0 #e7dcbd,0 8px 24px rgba(60,40,10,.25);font-size:19px;font-weight:700;line-height:1.45}
.ac .tag{position:absolute;top:-16px;left:26px;padding:4px 16px;border-radius:16px;color:#fff;font-weight:800;font-size:16px;transform:rotate(-4deg);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.ac .gl{display:block;margin-top:8px;font-size:13.5px;font-weight:700;color:#a68c66;font-style:italic}
.ac .more{position:absolute;right:26px;bottom:12px;color:#e3a33a;font-size:16px;visibility:hidden;animation:bob 1s ease-in-out infinite}
.ac.ready .more{visibility:visible}
@keyframes bob{50%{transform:translateY(4px)}}
.ac .opts{position:absolute;right:6px;bottom:calc(100% + 18px);background:#fdf7e4;border-radius:26px;padding:10px 8px;box-shadow:0 3px 0 #e7dcbd,0 8px 24px rgba(60,40,10,.25);display:none}
.ac .opts.show{display:block}
.ac .opts button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:#6b5236;padding:8px 14px 8px 30px;border-radius:14px;position:relative;cursor:pointer}
.ac .opts button:hover,.ac .opts button:focus-visible{background:#f6ecc9;outline:none}
.ac .opts button:hover::before,.ac .opts button:focus-visible::before{content:"▶";position:absolute;left:10px;color:#e3a33a;font-size:13px;top:11px}
@media (prefers-reduced-motion:reduce){.ac .more{animation:none}}
.chip.ch-net{color:#1f9a45}
.chip.ch-ic{color:#0a84ff}
.row{display:flex;align-items:flex-end;gap:6px;align-self:flex-start;max-width:86%}
.row .b{max-width:100%}
.from{margin-left:42px!important}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:-.2px}

stamp <b>Tuesday 24 April 1990</b> · 1730<br>The road from Sennelager to Detmold
radio The troop has squared away at the range and pulled out onto the B-road for Detmold. Twenty-odd kilometres of lanes and woodland.
near notebook,traffic
tutorial Line ahead for the road; wedge for going off-road
choose One One, One Two, One Zero. Line ahead. Out. || One One, One Two, One Zero. Wedge. Out.
tutorial
if $choice=1
net One One: One One. Wedge? On this road?
choose One One, One Two, One Zero. Correction. Line ahead. Out.
end
gloss Line ahead — one behind the other, for roads. Wedge — an arrowhead, for open ground.
to a 11.6,7.5 p 10.4,7.5 b 9.2,7.5 speed=0.8 stagger=0.3
cam 8,7.1,6.4
move golf -12,1.5 speed=1.4
move van -12,1.5 speed=1.2 delay=3
wait 2000
radio Across the fields, on the parallel road, civilian traffic. All of it heading west.
radio BBC World Service: “…Federal Border Police report increased traffic from the German Democratic Republic this week. The Interior Ministry has urged calm and asks West German citizens to extend the usual hospitalities to recent arrivals…”
waitmove a,p,b
cam 13,7.4,5.6
near merc,trabant,plate,suitcase,family,hedge,field,notebook
radio Round the bend, the road is blocked. A Mercedes has nudged the rear corner of a Trabant. Both cars are at an angle across the road. Nobody is hurt.
choose Zero, One Zero. Possible obstacle. Wait, out.
set a,p,b open=1
hear Mercedes driver: Mein Gott, schauen Sie sich das an!
gloss “My God, look at this!”
hear Mercedes driver: Sind Sie blind?
gloss “Are you blind?”
hear Mercedes driver: Versicherung — haben Sie Versicherung?
gloss “Insurance — do you have insurance?”
hear Trabant driver: Nein.
gloss “No.” Their East German state insurance means nothing on a West German road. They are from the other side.
net Zero: One Zero, Zero. Sitrep your location, over.
choose Zero, One Zero. Civilian RTA blocking the road. No casualties. No way through. Over.
gloss RTA — road traffic accident.
net Zero: Bypass it. Don’t get drawn in. Holley’s been on the net — don’t keep him. Out.

tutorial Switch to wedge, then tap the field beyond the crash
choose One One, One Two, One Zero. Wedge. Out. || One One, One Two, One Zero. Line ahead. Bypass left, through the trees. Out.
if $choice=1
net One One: One One. Trees are too thick, One Zero. Field’s the only way.
choose One One, One Two, One Zero. Wedge. Out.
end
tap wp1|wp2=Through the field
tutorial
choose One One, One Two, One Zero. Move now. Through the field. Out.
set a,p,b trail=1
move p 12.3,8.3 13.4,9.3 15.6,11.6 18.4,9.3 19.6,8.1 21.6,7.5 speed=0.75
move a 13.3,8.2 14.4,9.4 16.6,11 19.2,9.3 20.4,8.1 22.8,7.5 speed=0.75 delay=0.4
move b 11.3,8.3 12.4,9.3 14.6,12.2 17.6,9.3 18.8,8.1 20.4,7.5 speed=0.75 delay=0.8
cam 16,9.5,7
wait 1800
radio The lead tank crests the verge and goes through the hawthorn. Branches snap. The others follow through the same gap.
move mother 16.8,8.0 speed=0.5
radio The mother pulls the child closer as the tanks come off the road.
wait 1400
radio Both drivers stop arguing and watch. The Trabant driver glances at the tanks, once.
wait 1600
radio As the tanks pass, the child waves. Once. You can’t tell whether it’s hope, or fear, or neither.
radio In One Two’s cupola, Baxter looks towards the family for a moment, then looks ahead again.
waitmove a,p,b
set a,p,b trail=0
near tracks,gaps,notebook,family
stamp Through. Two gaps in the hedge, three pairs of tracks in the yellow.
tutorial Back to line ahead for the road
choose One One, One Two, One Zero. Line ahead. Out.
tutorial
to a 26,7.5 p 24.8,7.5 b 23.6,7.5 speed=0.9 stagger=0.3
cam 22,7.2,6.4
wait 2500
net One One: That little ’un waving.
net One Two: Easterners. Came over recently.
net One One: Yeah.

waitmove a,p,b
wait 1200

stamp <b>Saturday 12 May 1990</b> · 0700<br>The hides, south of Hildesheim · Day 4 of the war
radio Three days at Stand-To-Charlie. The artillery to the east has been continuous and distant. Nothing has come near the troop. 2nd Troop is out in front on the ridge, as the squadron’s screen.
near notebook,rangecard,periscope,telegraph,bv
wait 900
net Zero Alpha: Hello all stations, this is Zero Alpha. Today is the day. Sunray reports OMG forward elements have penetrated to within five kilometres of our screen. First contact expected before noon. Stand to. Crews mounted. Sectors of fire confirmed. Mortar section on standby on frequency four. Out.
gloss OMG — Operational Manoeuvre Group: Soviet forces sent deep, past the front, to break up the defence. Sunray — the commander; here, the commanding officer.
choose One Zero. Wilco, out.
net One One: One One. Wilco, out.
net One Two: One Two. Standing to, hatches manned, mortar section on four. Out.
radio The waiting begins.
wait 1400
stamp 0900
hud 0900
net One One: One One.
radio Nothing else. Hollis is letting you know he is there.
choose One Zero.
wait 1500

stamp 0915
hud 0915
net Two Zero: Hello Zero, this is Two Zero. Contact, wait out.
cam 10,7.2,13
wait 700
net Two Zero: Zero, Two Zero. Contact. Two BRDM, grid five four seven three one two, one thousand, moving west. Engaging. Out.
near togs,periscope,rangecard
net One One: One One. Stand by.
fire s0 at 18,4
burst 18.5,4
wait 500
fire s1 at 18,6.2
burst 18.5,6.2
wait 500
fire s2 at 18,8.4
burst 18.5,8.4
wait 500
fire s3 at 18,10.6
burst 18.5,10.6
radio A flat, heavy thump to the east, and the chatter of coax. Heavier machine-gun fire answers.
wait 1200
net Two Zero: Zero, Two Zero. Two BRDM stopped. Larger element behind. T-80 and BMP, count six plus. Pulling back to bound. Out.

stamp 0925 · Passage of lines
hud 0925
set s0,s1,s2,s3 gun=3.1416
set s1 smoke=1
move s0 6,2.4 -8,3.6 speed=1.6
move s1 6,4.6 -8,5.8 speed=1.6 delay=0.3
move s2 6,9.2 -8,8 speed=1.6 delay=0.6
move s3 6,11.4 -8,10.2 speed=1.6 delay=0.9
radio 2nd Troop’s Challengers come back through your position, passing between the hides at speed. One is trailing smoke from the engine decks.
net Two Zero: One Zero, Two Zero. They’re four minutes behind us. T-80 leading. Good luck. Out.
net Zero: Two Zero, Zero. On the bus, next bound. Out.
gloss Passage of lines — one unit passing back through another’s position. 1st Troop is now the squadron’s front edge.
net One One: One One. Range markers confirmed.
choose One One, take the right axis. One Two, left. I’ll take centre. Engage on my order. Out.

stamp 0930
hud 0930
set t80,bmp1,bmp2,bmp3,bmp4 hidden=0
move t80 12.6,7.0 speed=0.55
radio A whine carries before the dust: a gas turbine. A T-80 crests the rise at fourteen hundred metres. It is on the move and has not seen you.
gloss T-80 — Soviet main battle tank, gas-turbine engine. Engage with FIN.
wait 1800
choose Engage. || hint: Wait.
if $choice=1
radio You let it come. Six hundred metres of open field between it and the wood.
wait 1500
choose Engage.
end
choose ic: FIN, tank, on.
ic Gunner: On.
ic Loader: Loaded.
choose ic: Fire.
ic Gunner: Lasing… firing now.
fire p,a,b at t80
set t80 smoke=1
move t80 12.6,7.0
ic Gunner: Target.
ic Gunner: Target stop.
radio The T-80 brews up. A column of black smoke stands over the rise.
wait 800

move bmp1 14.6,5.2 speed=0.6
move bmp2 15,8.6 speed=0.6
move bmp3 15.4,6.6 speed=0.6
move bmp4 15.8,9.8 speed=0.6
radio The BMPs behind it come over the rise.
choose ic: Stop loading. Load HESH.
ic Loader: Loaded.
choose ic: HESH, BMP, on.
ic Gunner: On.
choose ic: Fire.
ic Gunner: Lasing… firing now.
fire p at bmp1
set bmp1 smoke=1
move bmp1 14.6,5.2
ic Gunner: Target. Target stop.
fire a at bmp2
set bmp2 smoke=1
move bmp2 15,8.6
net One One: One One. BMP, target stop.
move bmp3 17.5,6.6 speed=0.6
radio A third BMP reverses behind the rise. The fourth stops.
wait 600
missile bmp4 3.6,5.8
radio A wire-guided missile leaves the fourth BMP, trailing smoke, straight at you.
wait 1700
burst 3.6,5.8 shake
net One One: One Zero, One One. That was close.
gloss AT-5 Spandrel — a wire-guided anti-tank missile. The operator rushed it; it passed thirty metres wide.
fire b at bmp4
set bmp4 smoke=1
move bmp4 15.8,9.8
net One Two: One Two. Target stop.
stamp 0934 · Contact broken. The rest pull back east.

net Zero: One Zero, this is Zero. Good engagement. Hold position. Expect counter-battery soon. Out.
choose One Zero. Wilco, out.
wait 1800
stamp 0938 · Counter-battery
burst 4.5,4
wait 650
burst 2,9
wait 650
burst 5.5,11

radio A round lands thirty metres from your tank. It rocks. Splinters ring off the armour.
net One One: One One. That’s normal. Closer than ideal. Not aimed.
burst 1.5,3
wait 900
burst 5,6
wait 900
burst 2.5,12
wait 2500

hud 0948

radio Three minutes of silence. Hatches come open, carefully.

wait 1500

choose One Zero. Well done, all. Out.

@rangecard your range card

@periscope the periscope

icon: 🔭

use: radio Through the periscope: the field, the track, the rise. Nothing. Nothing. Then, very faint, dust above the rise where there was no dust before.
@togs the thermal sight
unit: p
icon: 🌡️
verb: Look through
look: radio TOGS — the Thermal Observation and Gunnery Sight. The gunner’s picture, repeated for you.
use: radio In the thermal picture the field is grey and cold. Beyond the rise, too far for the eye, small white shapes are moving: engines, warm and getting warmer.
use: gloss TOGS sees heat, not light. No Soviet tank of 1990 has anything like it.
@telegraph the Telegraph
kit: yes
icon: 📰
look: radio The Telegraph, four days old by the time it reached you. The deaths column runs to two pages.
use: radio You read the deaths column. You don’t know any of the names. Then you do.
@bv the boiling vessel
unit: p
icon: ☕
verb: Brew up with
look: radio The boiling vessel, the BV, built into the turret: hot water for tea and boil-in-the-bag food without leaving the tank.
use: radio The water takes four minutes. You make three teas and pass two down. Your loader says it is the best tea he has ever had. He says that every time.
use: gloss Brew-up — a brew of tea. Also a tank catching fire, as the T-80 did. Nobody in the turret mentions it.
@cigarette Hollis’s cigarette
unit: a
icon: 🚬
look: radio Hollis in his cupola, cigarette in his hand, looking east at the smoke over the rise. It is the first time you have seen him smoke.

stamp <b>Wednesday 25 April 1990</b> · 1015<br>Salisbury Plain Training Area
radio A Light Gun battery in action on the Plain: six 105mm guns, one command post. You are the Gun Position Officer. The FOO is up on the ridge with the infantry, watching the target area.
near board,brew,tannoy
wait 900
hear Gun 3, layer: Brew’s stewed.
hear Gun 3, Bombardier: It’s always stewed. It’s the Plain. Drink it.
hear Gun 5, loader: How long have we been sat here?
hear Gun 5, No. 1: Two hours. And you’ll sit two more if they want you to.
gloss Bombardier — the Royal Artillery’s corporal. The gun’s No. 1, its detachment commander, is usually a sergeant.
wait 600
net Four Three: Four Zero, this is Four Three. Fire mission. Over.
gloss Four Three — the Forward Observation Officer’s callsign. Four Zero — your command post. Fire mission — the call for fire.
choose Four Three, Four Zero. Send, over.
net Four Three: Grid zero nine seven four five two. Direction four eight zero zero. Infantry in the open. Adjust fire. Over.
gloss Grid — the target’s map reference. Direction — the FOO’s bearing to the target, in mils (6,400 to the circle). Adjust fire — range one gun onto the target before the battery fires.

else

end
end

say Sgt Hollis: One Two’s been writing letters, sir. Four of them. His mum, his nan, two girls.

if $choice=0
say Pemberton: Two girls?
say Sgt Hollis: He’ll find out, sir. They always do.
end
if $choice=1
say Pemberton: Good for him.
end
end

end
end

if $choice=0
say Pemberton: All going east.
end
if $choice=1
say Pemberton: How many?
say Sgt Hollis: Stopped counting at forty, sir.
end
end
endtalk

near telegraph,notebook
choose act: Read your letter || act: Leave it till tonight
if $choice=0
radio A letter from your mother: the garden, the dog, your sister’s new job. Nothing about Germany. She has underlined “take care” twice.
end
end
if $aft=2
radio One Two’s gunner has gone sick with something he ate. Baxter’s loader is covering. One Two is a man short until tomorrow.
net One Two: One Two. Short a gunner till morning. Out.
end
if $aft=3
do farmer
end
if $aft=5
radio The squadron net is full of hiss and a wavering tone, then music, then hiss. Somebody east of the border is practising jamming.
choose One One, One Two, One Zero. WINDMILL. Out. || hint: Ride it out
if $choice=0
if $full=0
net One Two: One Two. Say again codeword? Over.
net One One: One Two, One One. Frequency two. Now.
radio One Two was never told the codeword. Two minutes of jammed net while Hollis sorts it out.
end
gloss WINDMILL — the codeword from this morning’s O Group: every station changes to frequency two.
xp contact 5 Net drill under jamming
end
end
if $aft=6
radio A Bundeswehr Iltis stops at the track: Hauptmann Weber, the liaison officer, on his rounds. He doesn’t get out.
radio “Herr Leutnant. My people say the exercises over there are not exercises. I thought you should hear it from somebody.” He nods, and drives on.
end
if $aft=4
radio A car comes slowly along the far road: an olive Mercedes with odd number plates, two men in it, one with a camera. It stops by the field gate, then drives on.
gloss The Soviet military liaison mission — Soviet officers allowed by treaty to travel in West Germany, watching. They were to be reported, every time.
choose Zero, One Zero. Liaison car, two up, one camera, at the field gate, moving north. Over. || hint: Watch it go
if $choice=0
net Zero: One Zero, Zero. Roger. Good spot. Out.
end
end
enddef

def farmer
radio A man in a flat cap and a waxed jacket walks up the track from the field, carrying a clipboard.
say The farmer: Sie sind der Offizier? | “You are the officer?”
ask Introduce yourself || Call Hollis
if $choice=0
say Pemberton: Ja. Pemberton.
end
if $choice=1
say Pemberton: Sergeant Hollis!
say Sgt Hollis: Ah. Manöverschäden. Field damage, sir. They claim, we pay. Mostly we pay.
end
say The farmer: Your tanks have driven on my field. The winter wheat. Here — and here.
ask Apologise || Deny it || The form
if $choice=0
say Pemberton: I’m sorry. We’ll make it right.
say The farmer: Gut. | He seems surprised. He writes something on the clipboard and underlines it.
end
if $choice=1
say Pemberton: That wasn’t this troop.
say The farmer: Tanks are tanks. | He writes something down anyway.
end
if $choice=2
say Pemberton: Fill in the form, and we’ll pass it on.
say The farmer: The form. Always the form. | He has already filled it in.
end
gloss Manöverschäden — manoeuvre damage. Farmers claimed for it every exercise season; the Army paid.
endtalk
enddef

badge Crash move <b>{level:$crash}</b>{bar:$crash}
radio Corps reserve, in hides in the Hildesheimer Wald since Thursday. A week of routine, until the SPAR route recce on Monday and whatever comes after.

while $day<12

play spar

if $day=7

night 1

near periscope,notebook

wait 2600
hud 0400
night 0.9
radio To the east, the horizon flickers. No sound yet.

else

hud: 1640 | 24 April 1990
endcard: Off the Bus | Next: the road to Detmold
net: B Squadron net | Zero is the squadron · you are One Zero | 0
maplabel: Isometric view of the Sennelager range: 1st Troop, three firing positions, two hulks at a thousand metres
camera: 3.8,6.6,5.6
callsigns: Zero=0, One One=11, One Two=12
crew: Gunner=G, Loader=L, Driver=D

vars: level=0
---map
{"bg": "#6a7a40", "ground": {"x": [-6, 22], "y": [-4, 22], "c": ["#b9ab72", "#beb077"], "rects": [{"x": [-6, 1], "y": [-4, 22], "c": ["#5c6e3a", "#62743e"]}, {"x": [-6, 22], "y": [-4, 0], "c": ["#5c6e3a", "#62743e"]}, {"x": [-6, 8], "y": [13, 22], "c": ["#5c6e3a", "#62743e"]}, {"x": [2, 2], "y": [-4, 22], "c": ["#8c7d5a", "#93845f"]}]}, "trees": [{"x": [-6, 2], "y": [-3, 21], "n": 130, "kind": "pine", "seed": 11, "s": [0.75, 1.25]}, {"x": [2, 21], "y": [-3, 0.6], "n": 40, "kind": "pine", "seed": 5}, {"x": [2, 9], "y": [12.6, 21], "n": 40, "kind": "pine", "seed": 9}], "keep": [[5.6, 6.6], [5.6, 4.9], [5.6, 8.3], [2.5, 5.0], [2.5, 6.6], [2.5, 8.2], [6.7, 7.45], [2.5, -2, 0.75], [2.5, -1, 0.75], [2.5, 0, 0.75], [2.5, 1, 0.75], [2.5, 2, 0.75], [2.5, 3, 0.75], [2.5, 4, 0.75], [2.5, 5, 0.75], [2.5, 6, 0.75], [2.5, 7, 0.75], [2.5, 8, 0.75], [2.5, 9, 0.75], [2.5, 10, 0.75], [2.5, 11, 0.75], [2.5, 12, 0.75], [2.5, 13, 0.75], [2.5, 14, 0.75], [2.5, 15, 0.75], [2.5, 16, 0.75], [2.5, 17, 0.75], [2.5, 18, 0.75], [2.5, 19, 0.75], [2.5, 20, 0.75]], "marks": [{"type": "pad", "id": "pad1", "x": 5.6, "y": 4.9}, {"type": "pad", "id": "pad2", "x": 5.6, "y": 6.6}, {"type": "pad", "id": "pad3", "x": 5.6, "y": 8.3}, {"type": "peg", "x": 7, "y": 10.4}, {"type": "peg", "x": 9, "y": 10.4}, {"type": "peg", "x": 11, "y": 10.4}, {"type": "peg", "x": 13, "y": 10.4}], "units": [{"id": "a", "type": "challenger", "x": 2.5, "y": 5.0, "label": "11"}, {"id": "p", "type": "challenger", "x": 2.5, "y": 6.6, "label": "10", "me": 1}, {"id": "b", "type": "challenger", "x": 2.5, "y": 8.2, "label": "12"}, {"id": "bmp", "type": "hulk_bmp", "x": 14.2, "y": 5.3, "label": "BMP"}, {"id": "t54", "type": "hulk_t54", "x": 14.4, "y": 8.1, "label": "T-54"}, {"id": "rover", "type": "rover", "x": 2.5, "y": 17, "label": "44", "hidden": 1}]}
---script
stamp <b>Tuesday 24 April 1990</b> · 1640<br>Sennelager Training Area, North Rhine-Westphalia
radio You are 2Lt David Pemberton, 1st/5th Dragoon Guards, in command of 1st Troop. You have been at Sennelager since dawn for live-fire certification. Other troops have been firing all day. Yours has not. The slot has slipped four times.
near tea,notebook,bins,binoculars
wait 1400
net One One: Range control says we’re next. They’ve said that twice.
net One Two: Third time pays for all, sergeant.
net One One: Yeah. We’ll see.
wait 900

# Step 1: sitrep and the move to the firing positions
net Zero: One Zero, this is Zero. Apologies for the wait. Sitrep when ready, over.
gloss Sitrep — situation report.
choose Zero, One Zero. Crews mounted, all up. Ready, over.
gloss All up — all present and ready.
net Zero: Move to firing positions, line abreast. Send when in position. Out.
gloss Line abreast — side by side, facing forward. Out — “I’m done; no reply needed.”
tutorial Tap a firing position to move the troop
tap pad1|pad2|pad3=Firing positions, line abreast
tutorial
me One One, One Two, One Zero. Firing positions, line abreast. Out.
to a 5.6,4.9 p 5.6,6.6 b 5.6,8.3 speed=0.9 stagger=0.2
net One One: One One. Wilco, out.
waitmove a,p,b
choose Zero, One Zero. In position. Out.
net Zero: Targets: armoured hulks your front, one thousand metres. One round each. Free target choice. Cleared to engage. Out.
gloss Cleared to engage — permission to fire on the targets given.

# Step 2: see the range
tutorial Pinch out (or scroll) to see the range
zoomgate Zoom out to see the range
tutorial
cam 9.2,6.7,11.5
near tea,notebook,bins,binoculars,hulks
wait 1300
net One One: One One ready. My target the BMP.
gloss BMP — Soviet infantry fighting vehicle. The smaller hulk.
net One Two: One Two ready. Mine the T-54.
gloss T-54 — older Soviet tank. The larger hulk.

# Step 3: One Zero's gun drill, at the level chosen on replay
set bmp,t54 tagged=1
tutorial Tap a hulk to choose your target
radio Your loader has a practice FIN round loaded.
gloss FIN — the armour-piercing tank-killer round (APFSDS). Old Chieftain hands still call it “sabot”.
tap bmp=Target the BMP || t54=Target the T-54
var target=0
if $choice=1
var target=1
end
tutorial
set bmp,t54 tagged=0
if $level<2
if $target=0
choose ic: FIN, BMP, on.
else
choose ic: FIN, tank, on.
end
if $level=0
gloss The fire order: ammunition, target, “on” — you have laid the gun onto the target yourself.
wait 1500
end
ic Gunner: On.
if $level=0
gloss On — the gunner has the target in his sight.
end
ic Loader: Loaded.
choose ic: Fire.
if $level=0
gloss Fire — the executive order. Only the commander gives it.
end
else
if $target=0
icme FIN, BMP, on.
else
icme FIN, tank, on.
end
ic Gunner: On.
ic Loader: Loaded.
icme Fire.
end
ic Gunner: Lasing… firing now.
if $level=0
gloss Lasing — the laser takes the range; the gunner fires on “now”.
end
if $target=0
fire p at bmp
else
fire p at t54
end
ic Gunner: Target.
if $level=0
gloss Target — a hit. “Target stop” — the target is finished.
end
if $level=2
ic Gunner: Target stop.
else
choose ic: Target stop.
end
wait 700
fire a at bmp
net One One: One One. Target.
wait 500
fire b at t54 miss
wait 900
net One Two: One Two. Short. Out.
gloss Short — the round fell short. A miss is reported by where it fell, never as “miss”.
wait 2600

# Step 4: ENDEX
net Zero: ENDEX. ENDEX. ENDEX. All stations out.
gloss ENDEX — end of exercise. Firing stops; weapons made safe.
ic Gunner: Weapon safe.
stamp Certification complete

# Step 5: the quiet
cam 4.6,6.8,6.2
set a,p,b open=1
wait 1200
radio Engines idle. Birds resettle in the treeline. The radio is quiet for the first time today.
wait 3800

# Step 6: Davies
set rover hidden=0
move rover 2.5,7.45 6.7,7.45 speed=2.2
radio A diesel, somewhere back along the forest road.
waitmove rover
near rover,davies,bins
wait 600
radio Captain Davies, rear-party commander, leans on the open door of the Land Rover. He doesn’t get out.
say Capt Davies: Hello there. How’d you get on, then?
ask Report the shoot
say Pemberton: Two clean hits. One short.
say Capt Davies: Mm. Tell your corporal he’s drinking on his own coin tonight. | Davies’s joke — the man who missed pays for his own drinks tonight.
say Capt Davies: … | He glances into your open hatch, at the ammunition bins. Nearly full.
say Capt Davies: Bins still full. Hmm. Well — happens.
say Capt Davies: Actually, lucky. Plans have changed. You’re being moved on. You’ll be glad of the rounds.
say Capt Davies: Squadron’s deploying ahead of schedule. Square your lot away, then bring them to the workshop at Detmold. Captain Holley’s expecting you. He’ll have your orders. | Square away — get sorted out: clean up, stow kit, ready for the next move.
say Capt Davies: Crews all right? | He taps the roof. The Lance Corporal starts the engine.
say Pemberton: All up, sir.
move rover 2.5,7.45 2.5,18 speed=2.2
say Capt Davies: Right then. On the bus. Don’t dally. | On the bus, off the bus — army slang for order and counter-order: told to get on the bus, told to get off it, and nothing happens. Today, the bus is going somewhere.
endtalk
near notebook,tea,bins
wait 1200

# Step 8
net One One: Workshop?
net One Two: Means we’re moving forward.
net One One: Brew first, though.
net One Two: Wouldn’t dream of denying you.
set rover hidden=1
wait 800
stamp Pemberton’s notebook updated · 8 new entries
wait 1500
title
replay Play again, gun drill Raw=level:0 || Play again, gun drill Practised=level:1 || Play again, gun drill Drilled=level:2

unit: rover

@davies Captain Davies

unit: rover
icon: 💬
ask about Detmold: say Capt Davies: Lovely spot. Hills, a Schloss, a statue of a chap with a sword. You’ll like it. Everybody likes Detmold.
ask about the squadron: say Capt Davies: Gone forward, ahead of schedule. Major Calloway is in his element. Map in one hand, brew in the other.

---script
stamp <b>Monday 30 April 1990</b> · 1500<br>The hides, Hildesheimer Wald
radio Five days in reserve. As corps reserve, the squadron’s work while it waits is learning the ground it may have to counter-attack across. Calloway has given each troop a stretch of route to recce.
wait 900
near mapcase,hollis,notebook
radio Hollis walks over from his tank with the map case.
say Sgt Hollis: Sir. Route recce. Squadron’s given us the stretch south through the Wald. Got a minute?
say Pemberton: Sergeant.
say Sgt Hollis: Bridge here — need the classification. Bend here, tight for a Challenger. Then through Sibbesse. Narrow street, junction in the middle. We’ll want to stop and look at that junction properly, sir.
say Pemberton: …the junction.
say Sgt Hollis: The junction outside the SPAR, sir. Key node. Civilian movement patterns. Logistical reconnaissance.
ask Bread. || Reconnaissance? || Go on.
if $choice=0
say Pemberton: You want bread.
say Sgt Hollis: I want to verify the route, sir. Check the clearances. Assess the operational readiness of local supply infrastructure.
end
if $choice=1
say Pemberton: Logistical reconnaissance?
say Sgt Hollis: Of the junction, sir. And its surroundings. Check the clearances. Assess the operational readiness of local supply infrastructure.
end
if $choice=2
say Pemberton: Go on.
say Sgt Hollis: Clearances, sir. Turning circle. And the operational readiness of local supply infrastructure.
end
ask Bread. || Infrastructure? || Sergeant…
if $choice=0
say Pemberton: You want bread.
say Sgt Hollis: The men want bread, sir. I am merely concerned for their welfare. The junction is genuinely tight.
end
if $choice=1
say Pemberton: Supply infrastructure.
say Sgt Hollis: Bread, sir. For the men. I am merely concerned for their welfare. The junction is genuinely tight.
end
if $choice=2
say Pemberton: Sergeant Hollis.
say Sgt Hollis: The men want bread, sir. And the junction is genuinely tight. Both things are true.
end
ask Mount up || Two minutes, not three || Fine
if $choice=0
say Pemberton: Right. Mount up. Route recce, south through Sibbesse. Two minutes at the junction. Out and back.
say Sgt Hollis: Sir.
end
if $choice=1
say Pemberton: Two minutes at the junction, Sergeant. Not three.
say Sgt Hollis: Two minutes, sir. The junction won’t need longer.
end
if $choice=2
say Pemberton: Fine. Get the crews mounted.
say Sgt Hollis: Sir. | He is already walking back to his tank, and he is very nearly smiling.
end
endtalk

net One Two: One Zero, One Two. Where are we off to?
net One One: Route recce, One Two. Bridge classification, clearances, and a key junction in Sibbesse.
net One Two: …the junction with the shop on it?
net One One: The junction, One Two.
net One Two: The shop. We’re recceing the shop.
net One One: We are recceing the junction, One Two. The shop is on it. Mount up.
radio The whole squadron net heard that. Nobody comments.
near notebook
choose One One, One Two, One Zero. Move now. Out.
to a 4.0,7.5 p 2.75,7.5 b 1.5,7.5 speed=0.9 stagger=0.25
cam 3,7.1,6.4
waitmove a,p,b
near disc,notebook,brook
radio At the bridge, a yellow Military Load Class disc. Seventy. A Challenger weighs about sixty-two tonnes.
gloss Military Load Class — the weight a West German bridge is rated for, posted on a yellow disc. Route recce means writing every one down.
choose act: 📝 Log it: bridge, class seventy || act: Carry on
if $choice=0
var logbridge=1
radio You write it in your notebook: “Bridge over the brook, MLC 70. Fordable alongside, about a metre.”
end
move tractor 8.4,7.5 8.4,8.8 speed=0.8
to a 7.2,7.5 p 5.95,7.5 b 4.7,7.5 speed=0.9 stagger=0.25
cam 6,7.1,6.4
wait 1500
radio A farmer pulls his tractor into a field gateway to let them by. He raises a hand. Hollis raises one back from his hatch.
waitmove a,p,b
move b 4.9,7.85 4.5,7.6 4.8,7.5 speed=1
net One Two: One Two. Bit tight, this. Shunting.
waitmove b
to a 10.6,7.5 p 9.35,7.5 b 8.1,7.5 speed=0.8 stagger=0.25
cam 9.4,7.1,6.4
waitmove a,p,b
near sign,church,notebook
net One One: One Two, One One. Built-up area. Mind your tracks. Don’t put one through anyone’s garden.
to a 12.0,7.5 p 10.75,7.5 b 9.5,7.5 speed=0.6 stagger=0.25
cam 10.8,7.1,6.4
waitmove a,p,b
near boy,notebook
radio A boy of about ten on a bicycle has stopped in the middle of the road, mouth open. His mother calls him sharply. He doesn’t move.
net One Two: One One, One Two. That kid’s not going anywhere.
net One One: Seen.
radio Hollis raises a hand and waves, slowly. The boy waves back, suddenly grinning. His mother drags him to the side of the road.
move boy 12.4,9.0 speed=1.2
wait 1200
to a 16.9,7.5 p 15.649999999999999,7.5 b 14.399999999999999,7.5 speed=0.6 stagger=0.25
cam 15.6,7.1,6.4
waitmove a,p,b
radio The troop halts at the junction, pulled tight to the kerb outside the SPAR. Engines idle.
near spar,cherry,notebook
choose act: 📝 Log it: junction, one go if the cars are gone || act: Carry on
if $choice=0
var logjunction=1
radio You write it in your notebook: “Sibbesse junction, outside the SPAR. One go for a Challenger if the parked cars are gone.”
gloss Route recce — the notes become the route card the squadron will plan with.
end

stamp The SPAR, Sibbesse
radio Bell over the door. Fresh Brötchen. NDR playing low behind the counter. Two elderly customers turn to look.
say Frau Müller: Ah! Die Briten. Guten Tag. | “Ah! The British. Good afternoon.”
say Sgt Hollis: Guten Tag, Frau Müller. | She is mildly surprised that he knows her name. She doesn’t ask.
say Frau Müller: You are buying bread?
say Sgt Hollis: Bread please. And some cold meat. And six bottles of Jever if you have it.
say Cpl Baxter: Anything in it, sir? | Baxter is at the magazine rack, holding up the Hildesheimer Allgemeine Zeitung.
near paper,bread,jever,tv,photo,hollis
ask Same as the radio || Read it
if $choice=1
say Pemberton: Let’s have a look.
say Pemberton: “Heseltine berichtet von Fortschritt in Stockholm. Bundeswehr auf normaler Bereitschaft.” | Heseltine reports progress in Stockholm. Bundeswehr on normal readiness. Nothing the radio hasn’t said.
else
say Pemberton: Same as the radio, I expect.
say Cpl Baxter: Bet it is, sir.
end
say Herr Müller: Sie sind aus Detmold? | “You are from Detmold?” He looks at the British soldiers without surprise.
say Sgt Hollis: 1st/5th Dragoon Guards, sir. We are forward of Detmold.
say Herr Müller: My boy is in the Bundeswehr. He is with his unit also. Near Wolfsburg.
say Sgt Hollis: He’ll be all right, sir.
say Frau Müller: Are you here long?
say Sgt Hollis: As long as needed.
ask Thank her
say Pemberton: Thank you, Frau Müller.
say Frau Müller: Pass auf dich auf, junger Mann. | “Take care of yourself, young man.” She has caught his sleeve. Hollis pauses. Nods. Says nothing.
endtalk

near bag,boy,cherry
radio Back at the tanks. The Jever goes into the turret bins for later — sergeant’s rule: nobody drinks on the move.
say Cpl Baxter: Productive recce, sir?
ask Most informative.
say Pemberton: Most informative.
say Sgt Hollis: The local supply infrastructure remains fully operational. | Deadpan, lighting a cigarette.
endtalk
set a,p,b open=0
radio The boy on the bicycle is back across the road. He waves. Baxter waves back from his cupola, with a piece of Brötchen.
choose One One, One Two, One Zero. Back to the hides. Out.
to a -2.6,7.5 p -1.3,7.5 b 0,7.5 speed=1.1
cam 1,7.1,6.4
waitmove a,p,b
set a,p,b open=1

stamp The hides
near notebook,bag,hollis
say Sgt Hollis: Worth the trip, sir.
ask Was it?
say Pemberton: Was it?
say Sgt Hollis: Frau Müller. Said pass auf dich auf. To me. Not to you, sir, no disrespect intended.
say Sgt Hollis: That’s the first time in this country anyone’s said that to me on this tour.
say Sgt Hollis: They know, sir. The locals. They know what’s coming.
say Sgt Hollis: Crews are happy. I’ll get the routine sorted for tomorrow. | He walks off. You are left standing by your tank, holding half a Brötchen.
endtalk
str card=
if $logbridge=1
str card=bridge MLC 70, fordable alongside
end
if $logjunction=1
if $logbridge=1
str card={$card} · junction turns in one go if the cars are gone
else
str card=junction turns in one go if the cars are gone
end
end
if $logbridge=0
if $logjunction=0
str card=blank — nothing logged
end
end
stamp Your route card: {$card}
wait 1200
title
replay Play again

---props
@mapcase Hollis’s map
unit: a
icon: 🗺️
look: radio The 1:50,000 sheet in its case, the route marked in Hollis’s neat chinagraph: the bridge, the bend, Sibbesse, and a small circle at the junction. The circle is very neat.
@hollis Hollis
person: Sgt Hollis
unit: a
icon: 💬
ask about the bridge: say Sgt Hollis: Class seventy on the old sheet, sir. I want to see the disc with our own eyes. Sheets lie.
ask about Sibbesse: say Sgt Hollis: Village. Church, petrol pump, the shop. Locals are used to us. Forty-five years of being used to us.
ask about the Müllers: say Sgt Hollis: Run the shop since before I was born, sir. She remembers faces. He remembers regiments.
@notebook your notebook
kit: yes
icon: 📓
verb: Write in
look: radio Your notebook, open at a page headed “Route recce — south through Sibbesse”. So far, the heading.
use: radio You sketch the route as you go: road, brook, bridge, the bend, the village, the junction. You are surprised how much of it you have already forgotten.
@disc the bridge disc
at: 4.6,6.6
icon: 🟡
look: radio A yellow disc on a post: “70”. Military Load Class seventy. Under it, a smaller German sign about agricultural vehicles.
@brook the brook
at: 5.5,4.5
icon: 💧
look: radio A brook under the bridge, a metre deep and fast with spring rain. Nothing a Challenger couldn’t ford in a hurry. You write that down too.
@sign the village sign
at: 9.6,6.6
icon: 🪧
look: radio The yellow sign: “Sibbesse, Landkreis Hildesheim”. Somebody has added a sticker for the local football club.
@church the church
at: 13.4,10.2
icon: ⛪
look: radio A Lutheran church, steep slate roof, the clock four minutes slow. The noticeboard has a flower rota on it.
@boy the boy on the bicycle
unit: boy
icon: 🚲
look: radio About ten, on a red bicycle too big for him. He is looking at the tanks the way you looked at tanks at ten.
@spar the SPAR
at: 16.4,5.4
icon: 🏪
look: radio A small shop with a red SPAR sign, a crate of empties by the door, a bell above it. A hand-written card in the window: frische Brötchen.
@cherry the cherry tree
at: 17.3,6.2
icon: 🌸
look: radio Past its best. Petals on the gravel, a few last blossoms holding on.
@paper the paper
icon: 📰
verb: Read
look: radio The Hildesheimer Allgemeine Zeitung, folded on the rack. The front page leads on Stockholm.
use: say Pemberton: “Heseltine berichtet von Fortschritt in Stockholm. Bundeswehr auf normaler Bereitschaft.” | Heseltine reports progress in Stockholm. Bundeswehr on normal readiness. Nothing the radio hasn’t said.
@bread the bread
icon: 🥖
verb: Take
look: radio Brötchen in a wicker basket, still warm. Frau Müller is counting out twelve into a paper bag without being asked.
use: say Frau Müller: … | You take a Brötchen from the basket. Frau Müller watches you. Hollis puts a coin on the counter without looking up.
@jever the Jever
icon: 🍺
verb: Open
look: radio A crate of Jever by the fridge. Frisian, bitter, and a long way from Friesland.
use: say Sgt Hollis: Sergeant’s rule, sir. Nobody drinks on the move. | The six bottles go into a bag. They will go into a turret bin.
@tv the television
icon: 📺
look: radio A small portable TV by the till, sound off. Regional news: a town council meeting, men in cardigans voting on something.
@photo the photograph
icon: 🖼️
look: radio Behind the till, a framed photograph of a young man in Bundeswehr uniform, grinning. Herr Müller sees you looking, and looks at it too.
@bag the bag
kit: yes
icon: 🥖
verb: Eat a Brötchen from
look: radio A paper bag of Brötchen, still warm, going soft at the bottom.
use: radio You eat one. Crisp outside, soft inside, still faintly warm. The best thing you have eaten since you arrived in Germany.
</script>

<script>/* Off the Bus prototype engine.
   One engine for every scene. A scene is a text file (see scenes/*.scene) with a header,
   a JSON map and a script; tools/build.py combines engine + scene + portraits into one page. */
(()=>{
const SCENE_TEXTS = {}; document.querySelectorAll('script.scene').forEach(e=>SCENE_TEXTS[e.dataset.name]=e.textContent);
const CAMPAIGN = JSON.parse(document.getElementById('campaign').textContent);   // {name, order:[scene names]}
const PORTRAITS = JSON.parse(document.getElementById('portraits').textContent);
const TESTARG = new URLSearchParams(location.search).get('test');
const TEST = TESTARG!=null;                                  // ?test=<seed>: no pauses, instant moves, plays itself
let tseed = (parseInt(TESTARG)||1)*7919; const trand = n => { tseed=(tseed*16807)%2147483647; return tseed % n; };
const TLOG = window.__test = {done:false, steps:0, choices:[], errors:[]};
function finalState(){ return JSON.stringify(vars)+'|'+thread.innerText.length+'|'+[...thread.innerText].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,0); }
const QS=new URLSearchParams(location.search), RESTORE_AT=+(QS.get('restoreAt')||0), RESUME=QS.has('resume'), RESTORE_MODE=QS.get('restoreMode')||'before';   // playtest save/restore checks
if(TEST) window.addEventListener('error', e=>TLOG.errors.push(String(e.message)));
const reduce = TEST || matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const soon = f => TEST ? Promise.resolve().then(f) : setTimeout(f,0);
const sleep = ms => TEST ? Promise.resolve() : new Promise(r=>setTimeout(r, reduce?Math.min(ms,150):ms));

/* ================= universal objects: always to hand ================= */
const UNIVERSAL_PROPS=`
@pistol your pistol
kit: yes
icon: 🔫
verb: Clean
use: radio You strip and clean your 9mm Browning — slide, barrel, spring, frame — and put it back together. It was clean before. It is cleaner now.
use: gloss Clean your weapon whenever there is nothing else to do. There is always something else to do, and you clean it anyway.
@socks your socks
kit: yes
icon: 🧦
verb: Change
use: radio You take off your boots and change your socks. Dry feet. For a few minutes, the world is a better place.
use: gloss Foot care: every soldier is taught that wet feet end campaigns. Nobody needs to tell you twice.
`;
/* ================= scene parsing ================= */
function parseScene(text){
  const [headText, rest] = text.split(/^---map\s*$/m);
  const [mapText, afterMap] = rest.split(/^---script\s*$/m);
  const [scriptAndProps, daysText=''] = afterMap.split(/^---days\s*$/m);
  const [scriptText, propsText=''] = scriptAndProps.split(/^---props\s*$/m);
  const legend={}, days=[];
  for(const raw of daysText.split('\n')){ const l=raw.trim(); if(!l||l.startsWith('#')) continue;
    let m=l.match(/^legend:\s*(.*)$/); if(m){ for(const part of m[1].split('|')){ const [key,...vals]=part.trim().split(/\s+/); legend[key]={}; for(const v of vals){ const [n,num]=v.split('='); legend[key][n]=+num; } } continue; }
    m=l.match(/^([^:]+):\s*(.*)$/); if(m){ const row={label:m[1].trim()}; for(const kv of m[2].split(/\s+/)){ const [k,v]=kv.split('='); if(k) row[k]=legend[k]&&v in legend[k]?legend[k][v]:+v; } days.push(row); } }
  const head={};
  for(const line of headText.split('\n')){ const m=line.match(/^(\w+):\s*(.*)$/); if(m) head[m[1]]=m[2].trim(); }
  const lists=k=>Object.fromEntries((head[k]||'').split(',').filter(Boolean).map(p=>p.split('=').map(s=>s.trim())));
  const people={}; for(const [n,v] of Object.entries(lists('people'))){ const [col,por]=v.split(':'); people[n]={col,portrait:por}; }
  const all=scriptText.split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim() && !l.trim().startsWith('#')).map(l=>l.trim());
  const macros={}, script=[]; let into=null;
  for(const l of all){ const m=l.match(/^def\s+(\w+)$/); if(m){ into=macros[m[1]]=[]; continue; } if(l==='enddef'){ into=null; continue; } (into||script).push(l); }
  const props={}; let cur=null;
  for(const raw of (UNIVERSAL_PROPS+'\n'+propsText).split('\n')){ const l=raw.trim(); if(!l||l.startsWith('#')) continue;
    let m=l.match(/^@(\w+)\s+(.*)$/); if(m){ cur=props[m[1]]={id:m[1],label:m[2],verb:'Use',look:[],use:[],asks:{},at:null,kit:false,person:null,icon:'•'}; continue; }
    m=l.match(/^at:\s*(-?[\d.]+),\s*(-?[\d.]+)$/); if(m&&cur){ cur.at=[+m[1],+m[2]]; continue; }
    m=l.match(/^(kit|person|icon|unit):\s*(.*)$/); if(m&&cur){ cur[m[1]]=m[1]==='kit'?true:m[2]; continue; }
    m=l.match(/^verb:\s*(.*)$/); if(m&&cur){ cur.verb=m[1]; continue; }
    m=l.match(/^(look|use):\s*(.*)$/); if(m&&cur){ cur[m[1]].push(m[2]); continue; }
    m=l.match(/^ask (.+?):\s*(.*)$/); if(m&&cur){ (cur.asks[m[1]]=cur.asks[m[1]]||[]).push(m[2]); } }
  return { head, map:JSON.parse(mapText), script, macros, props, days, legend, callsigns:lists('callsigns'), crew:lists('crew'), people,
    vars:Object.fromEntries(Object.entries(lists('vars')).map(([k,v])=>[k,Number(v)])) };
}
const PARSED={}; const sceneOf=n=>PARSED[n]||(PARSED[n]=parseScene(SCENE_TEXTS[n]));
let SNAME=CAMPAIGN.order[0], S=sceneOf(SNAME);

/* ================= page chrome ================= */
function applyChrome(){
document.title = S.head.title || 'Off the Bus';
let [hudT,hudD] = (S.head.hud||'|').split('|').map(s=>s.trim()); $('hudT').textContent=hudT; $('hudD').textContent=hudD;
let [endBig,endSub] = (S.head.endcard||'Off the Bus|').split('|').map(s=>s.trim()); $('endBig').textContent=endBig; $('endSub').textContent=endSub;
let [netName,netSub,netAv] = (S.head.net||'Net||').split('|').map(s=>s.trim()); $('hn').textContent=netName; $('hs').textContent=netSub; $('av').textContent=netAv;
$('map').setAttribute('aria-label', S.head.maplabel||'Isometric map');
}

/* ================= the thread ================= */
const thread=$('thread'), replies=$('replies');
let lastFrom=null, lastDelivered=null, skip=false, speaking=false;
thread.addEventListener('click',()=>{ if(speaking) skip=true; });
const scrollDown=()=>{ if(!TEST) thread.scrollTop=thread.scrollHeight; };
function el(cls,txt,html){ const d=document.createElement('div'); d.className=cls; if(html!=null) d.innerHTML=html; else d.textContent=txt; return d; }
function add(e){ thread.appendChild(e); scrollDown(); return e; }
const NET_WPM=380, IC_WPM=250;
async function speak(b,text,msPerWord){
  b.textContent=''; speaking=true; skip=false;
  const said=document.createElement('span'), rest=document.createElement('span'); rest.className='unsaid'; rest.textContent=text; b.append(said,rest); scrollDown();
  const per=msPerWord/5.5;
  for(let i=0;i<text.length;i++){ if(skip||reduce) break; said.textContent=text.slice(0,i+1); rest.textContent=text.slice(i+1);
    const ch=text[i], nx=text[i+1]||' '; let d=per; if(/[.!?…]/.test(ch)&&/[\s"”’]/.test(nx)) d+=380; else if(/[,—–:;]/.test(ch)) d+=200;
    await new Promise(r=>setTimeout(r,d)); }
  said.textContent=text; rest.textContent=''; skip=false; speaking=false;
}
function row(avCls,avTxt,bCls){ const r=el('row',null,`<span class="av ${avCls}">${avTxt}</span>`); const b=el(bCls,''); r.appendChild(b); add(r); return b; }
function fromLabel(t){ if(lastFrom!==t){ add(el('from',t)); } lastFrom=t; }
let printedHook=null, choiceHook=null;   // set by the interpreter: a step's output has finished / a choice was made
const printed=()=>{ const h=printedHook; printedHook=null; h&&h(); };
async function netIn(who,text){ fromLabel(who); const b=row('av-net',S.callsigns[who]??who.slice(0,2),'b in typing'); b.innerHTML='<span></span><span></span><span></span>'; await sleep(650); b.className='b in'; await speak(b,text,NET_WPM); printed(); await sleep(250); }
async function netOut(text){ if(lastDelivered) lastDelivered.remove(); const b=add(el('b out','')); await speak(b,text,NET_WPM); lastDelivered=add(el('delivered','Transmitted')); lastFrom=null; printed(); await sleep(200); }
async function icIn(who,text){ fromLabel(who+' · intercom'); const b=row('av-ic',S.crew[who]??who[0],'b ic-in'); await sleep(250); await speak(b,text,IC_WPM); printed(); await sleep(150); }

/* the world: objects on the map, people by their face, kit in the pouch.
   Usable whenever the game is waiting for the player (a choice, or a balloon waiting for a tap). */
const propsBar=$('props'), pop=$('pop'); let near=[], used=new Set(), waiting=0, busy=false;
const kitIds=()=>Object.values(S.props).filter(p=>p.kit).map(p=>p.id);
function verbsOf(p){ const out=[];
  if(p.look.length) out.push({icon:'🔍',text:'Look at '+p.label,lines:p.look,key:p.id+':look'});
  if(p.use.length&&!used.has(p.id+':use')) out.push({icon:'✋',text:p.verb+' '+p.label,lines:p.use,key:p.id+':use',once:1});
  for(const [topic,lines] of Object.entries(p.asks)) if(!used.has(p.id+':ask:'+topic)) out.push({icon:'💬',text:'Ask '+topic,lines,key:p.id+':ask:'+topic,once:1});
  return out; }
const nearProps=()=>near.map(id=>S.props[id]).filter(Boolean);
function canAct(){ return waiting>0 && !busy; }
function refreshWorld(){ propsBar.innerHTML=''; $('pouch').hidden=!canAct(); AC.classList.toggle('can-hide',canAct());
  if(!canAct()){ closePop(); return; }
  for(const p of nearProps()){ if(p.at||p.unit||p.kit||p.person||!verbsOf(p).length) continue;   // things in the room with no place on the map
    const b=document.createElement('button'); b.className='chip ch-prop'; b.textContent=(p.icon!=='•'?p.icon+' ':'')+p.label; b.onclick=e=>openPop(p,e.currentTarget); propsBar.appendChild(b); } }
function openPop(p,anchor){ const vs=verbsOf(p); if(!vs.length||!canAct()) return;
  pop.innerHTML=`<div class="pt">${p.label}</div>`; for(const v of vs){ const b=document.createElement('button'); b.textContent=v.icon+' '+v.text; b.onclick=e=>{ e.stopPropagation(); runVerb(v); }; pop.appendChild(b); }
  pop.hidden=false; const r=anchor?anchor.getBoundingClientRect():null, app=$('app').getBoundingClientRect();
  if(r){ pop.style.left=Math.max(8,Math.min(app.width-pop.offsetWidth-8,r.left-app.left+r.width/2-pop.offsetWidth/2))+'px'; pop.style.top=Math.max(8,r.top-app.top-pop.offsetHeight-6)+'px'; }
  else { pop.style.left=((app.width-pop.offsetWidth)/2)+'px'; pop.style.top='30%'; } }
function openPopAt(p,sx,sy){ const fake={getBoundingClientRect:()=>{ const c=cv.getBoundingClientRect(); return {left:c.left+sx,top:c.top+sy,width:0,height:0}; }}; openPop(p,fake); }
function closePop(){ pop.hidden=true; pop.innerHTML=''; }
document.addEventListener('click',e=>{ if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('.ch-prop')&&e.target!==cv&&!e.target.closest('#acTag')&&!e.target.closest('#acPortrait')) closePop(); });
async function runVerb(v){ closePop(); const speaks=v.lines.some(l=>/^say\s/.test(l)); const wasCollapsed=AC.classList.contains('collapsed'); if(speaks) setCollapsed(false); busy=true; refreshWorld();
  const acWas=AC.classList.contains('show'), optsWas=acOpts.classList.contains('show'), readyWas=AC.classList.contains('ready');
  const saved=acWas?{tag:acTag.textContent,bg:acTag.style.background,text:acText.textContent,gl:acGl.textContent,por:acPor.className,img:acPor.style.backgroundImage,tap:acTap}:null;
  replies.style.visibility='hidden'; acOpts.classList.remove('show');
  if(v.once) used.add(v.key);
  await exec(v.lines);
  replies.style.visibility='';
  if(saved){ acShow(true); acTag.textContent=saved.tag; acTag.style.background=saved.bg; acText.textContent=saved.text; acGl.textContent=saved.gl; acPor.className=saved.por; acPor.style.backgroundImage=saved.img;
    if(optsWas) acOpts.classList.add('show'); AC.classList.toggle('ready',readyWas); acTap=saved.tap; if(wasCollapsed&&speaks) setCollapsed(true); } else acShow(false);
  busy=false; refreshWorld(); scrollDown(); save(); }
async function waitFor(promise){ waiting++; refreshWorld(); try{ return await promise; } finally{ waiting--; refreshWorld(); } }
function openPouch(){ if(!canAct()) return; const sh=$('sheet'); sh.innerHTML='<h2>Pouch</h2><p>What you carry.</p>';
  for(const id of kitIds()){ const p=S.props[id]; for(const v of verbsOf(p)){ const b=document.createElement('button'); b.className='card';
    b.innerHTML=`<div class="ct">${p.icon!=='•'?p.icon+' ':''}${v.text}</div>`; b.onclick=()=>{ $('scrim').classList.remove('show'); runVerb(v); }; sh.appendChild(b); } }
  const r=document.createElement('button'); r.className='card'; r.innerHTML='<div class="ct">↺ Start again from the beginning</div><div class="cs">Clears your saved game.</div>';
  r.onclick=()=>{ sh.innerHTML='<h2>Start again?</h2><p>Your saved game will be cleared and the campaign will start from the beginning.</p>';
    const y=document.createElement('button'); y.className='card'; y.innerHTML='<div class="ct">Yes, start again</div>'; y.onclick=()=>{ clearSave(); location.reload(); };
    const n=document.createElement('button'); n.className='card'; n.innerHTML='<div class="cs">No, keep playing</div>'; n.onclick=()=>$('scrim').classList.remove('show');
    sh.append(y,n); }; sh.appendChild(r);
  const c=document.createElement('button'); c.className='card'; c.innerHTML='<div class="cs">Close</div>'; c.onclick=()=>$('scrim').classList.remove('show'); sh.appendChild(c);
  $('scrim').classList.add('show'); }
$('pouch').addEventListener('click',openPouch);
function personProp(name){ return nearProps().find(p=>p.person===name); }
$('acTag').addEventListener('click',e=>{ const p=personProp(acTag.textContent); if(p&&canAct()){ e.stopPropagation(); openPop(p,acTag); } });
$('acPortrait').addEventListener('click',e=>{ const p=personProp(acTag.textContent); if(p&&canAct()){ e.stopPropagation(); openPop(p,acPor); } });

/* choices: net: transmits, ic: says it on the intercom, act: Pemberton's own action, hint: silent */
let mapPick=null;
function parseOpts(arg){ return arg.split('||').map(o=>{ o=o.trim(); const m=o.match(/^(net|ic|act|hint):\s*(.*)$/); return m?{kind:m[1],text:m[2]}:{kind:'net',text:o}; }); }
async function chooseEffect(o){ const ph=printedHook; printedHook=null;   // the reply's own output: a transmission, an intercom line, an action
  if(o.kind==='net') await netOut(o.text); else if(o.kind==='ic') await icOut(o.text); else if(o.kind==='act') add(el('stamp',null,'<b>'+o.text+'</b>'));
  printedHook=ph; }
function choose(opts){
  return new Promise(res=>{
    replies.innerHTML='';
    const pick=async i=>{ replies.innerHTML=''; mapPick=null; const ch=choiceHook; choiceHook=null; ch&&ch(i);
      await chooseEffect(opts[i]); printed(); res(i); };
    opts.forEach((o,i)=>{ const b=document.createElement('button');
      b.className='chip '+({net:'ch-net',ic:'ch-ic',act:'ch-act',hint:'hint'}[o.kind]);
      b.textContent=o.kind==='ic'?`“${o.text}”`:o.text; b.onclick=()=>pick(i); replies.appendChild(b); });
    mapPick=pick; scrollDown();
    if(TEST){ const i=trand(opts.length); TLOG.choices.push(opts[i].text.slice(0,40)); soon(()=>pick(i)); }
  });
}

/* in person: Animal Crossing-style balloon */
const AC=$('ac'), acText=$('acText'), acTag=$('acTag'), acGl=$('acGl'), acOpts=$('acOpts'), acPor=$('acPortrait');
let acTap=null;
AC.addEventListener('click',()=>acTap&&acTap());
AC.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&acTap){ e.preventDefault(); acTap(); } });
const acShow=on=>{ AC.classList.toggle('show',on); if(!on) setCollapsed(false); };
function setCollapsed(c){ AC.classList.toggle('collapsed',c); const r=$('acReopen'); r.hidden=!c; if(c) r.textContent='💬 Back to '+(acTag.textContent==='Pemberton'?'the conversation':acTag.textContent); }
$('acHide').addEventListener('click',e=>{ e.stopPropagation(); setCollapsed(true); });
$('acReopen').addEventListener('click',()=>setCollapsed(false));
async function acSay(name,text,gl){
  acShow(true); AC.classList.remove('ready'); acOpts.classList.remove('show');
  const p=S.people[name]||{}; acTag.textContent=name; acTag.style.background=p.col||'#8aa05a';
  const img=p.portrait&&PORTRAITS[p.portrait]; acPor.classList.toggle('show',!!img); if(img){ acPor.style.backgroundImage=`url(${img})`; acPor.setAttribute('aria-label',name); }
  acGl.textContent=''; acText.textContent=''; let done=false; acTap=()=>{done=true;};
  for(let i=0;i<text.length&&!done;i++){ acText.textContent=text.slice(0,i+1); if(reduce) continue;
    const ch=text[i]; let d=70; if(/[.!?…]/.test(ch)) d+=320; else if(/[,—–]/.test(ch)) d+=160; await new Promise(r=>setTimeout(r,d)); }
  acText.textContent=text; if(gl) acGl.textContent=gl;
  printed(); await acWaitTap();
}
async function acWaitTap(){ AC.classList.add('ready'); AC.focus({preventScroll:true});
  await waitFor(new Promise(r=>{ acTap=()=>{ acTap=null; r(); }; if(TEST) soon(()=>acTap&&acTap()); })); }
function acChoose(opts){
  return new Promise(res=>{ acOpts.innerHTML=''; acOpts.classList.add('show'); AC.classList.remove('ready'); acTap=null;
    opts.forEach((o,i)=>{ const b=document.createElement('button'); b.textContent=o.text;
      b.onclick=e=>{ e.stopPropagation(); acOpts.classList.remove('show'); const ch=choiceHook; choiceHook=null; ch&&ch(i); res(i); }; acOpts.appendChild(b); if(i===0) setTimeout(()=>b.focus(),30); });
    if(TEST){ const i=trand(opts.length); TLOG.choices.push(opts[i].text.slice(0,40)); soon(()=>{ acOpts.classList.remove('show'); const ch=choiceHook; choiceHook=null; ch&&ch(i); res(i); }); } });
}

const iso=(x,y)=>[ox+(x-y)*tw/2, oy+(x+y)*th/2];
const unIso=(sx,sy)=>{ const a=(sx-ox)/(tw/2), b=(sy-oy)/(th/2); return [(a+b)/2,(b-a)/2]; };

function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

function box(t,L,Wd,h,cols,base=0){
  const c=(dx,dy,z)=>{const p=iso(t.x+dx,t.y+dy);return[p[0],p[1]-z];};
  poly([c(L/2,-Wd/2,base),c(L/2,Wd/2,base),c(L/2,Wd/2,base+h),c(L/2,-Wd/2,base+h)],cols[0]);
  poly([c(-L/2,Wd/2,base),c(L/2,Wd/2,base),c(L/2,Wd/2,base+h),c(-L/2,Wd/2,base+h)],cols[1]);
  poly([c(-L/2,-Wd/2,base+h),c(L/2,-Wd/2,base+h),c(L/2,Wd/2,base+h),c(-L/2,Wd/2,base+h)],cols[2]);
  return c;

function shadow(t,s){ const [sx,sy]=iso(t.x,t.y); cx.fillStyle='rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(sx+s*.15,sy+s*.12,s*1.05,s*.5,0,0,7); cx.fill(); }

  const w=cx.measureText(label).width+10, y=p[1]-s*.75; cx.fillStyle=col; rr(p[0]-w/2,y-9,w,17,8); cx.fill();

  for(const t of S.map.tree||[]) trees.push({s:1,kind:'broad',...t});

}
